'use strict';
// ============================================================================
//  Na Pali coast — 100% procedural. No textures, images, models or samples.
//  The only data is a traced waterline (a vector path, like an artist's sketch)
//  plus a few art-direction control points. Everything else is generated:
//  stream-power erosion on the GPU, an FFT ocean, layered basalt, rainforest
//  canopy, breaking surf, sky and a physically-driven FPV drone flight.
// ============================================================================
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'drone';
const DEG = Math.PI / 180;
const num = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);

// Reference camera (the still frame) -----------------------------------------
const REF_W = 1672, REF_H = 941;
const STILL = { h: num('camH', 1000), pitch: num('pitch', 50) * DEG, vfov: num('vfov', 38) * DEG, aspect: REF_W / REF_H };

function camBasis(yaw, pitch) {
  // yaw around +y (0 = looking toward +z), pitch = down angle
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const f = [sy * cp, -sp, cy * cp];
  const r = [cy, 0, -sy];
  const u = [sy * sp, cp, cy * sp];
  return { r, u, f };
}
function unproject(px, py, planeY = 0) {
  const t = Math.tan(STILL.vfov / 2);
  const sx = (2 * px / REF_W - 1) * STILL.aspect * t, sy = (1 - 2 * py / REF_H) * t;
  const { r, u, f } = camBasis(0, STILL.pitch);
  const d = [f[0] + sx * r[0] + sy * u[0], f[1] + sx * r[1] + sy * u[1], f[2] + sx * r[2] + sy * u[2]];
  const k = (STILL.h - planeY) / -d[1];
  return [d[0] * k, d[2] * k];
}


// Metre-scale inland river, independent of the retained ocean coast trace.
function liSmooth(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function lijiangRiverCenter(z){return 46*Math.sin((z+140)*.00168)+28*Math.sin((z-70)*.0031)-430*(1-liSmooth(-1350,-350,z));}
function lijiangRiverWidth(z){return 340*(1+.11*Math.sin(z*.0013-.4)+.055*Math.cos(z*.0037));}
function buildCoastSegments(){
  const segs=[];
  for(const side of [-1,1])for(let z=-3000;z<3000;z+=24){
    const b=z+24;
    segs.push(lijiangRiverCenter(z)+side*lijiangRiverWidth(z)/2,z,lijiangRiverCenter(b)+side*lijiangRiverWidth(b)/2,b);
  }
  const d=(lijiangRiverCenter(101)-lijiangRiverCenter(99))/2,l=Math.hypot(d,1);
  return{segs:new Float32Array(segs),n:segs.length/4,coastDir:[d/l,1/l],inland:[1/l,-d/l]};
}
function buildValleys(){
  const empty=()=>new Float32Array(4);
  return{S:empty(),P:empty(),n:0,SH:empty(),nSH:0,BZ:empty(),nBZ:0,CH:empty(),nCH:0,MS:empty(),nMS:0};
}

  return -1.+2.*(a+(b-a)*u.x+(c-a)*u.y+(a-b-c+d)*u.x*u.y);}

  float k1=b-a,k2=c-a,k4=a-b-c+d;

  for(int i=uZero;i<o;i++){vec3 n=vnoised(p);s.x+=a*n.x;s.yz+=a*(n.yz*m);p=M2*p;m=M2*m;a*=.5;}return s;}

  for(int i=uZero;i<o;i++){vec4 n=noised3(p);s.x+=a*n.x;s.yzw+=a*(n.yzw*m);p=M3*p;m=M3*m;a*=.5;}return s;}

  for(int j=uZero-1;j<=1;j++)for(int i=uZero-1;i<=1;i++){vec2 g=vec2(i,j);vec2 o=hash22(n+g);vec2 r=g+o-f;float d=dot(r,r);

`;

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv; void main(){ vUv=aPos*.5+.5; gl_Position=vec4(aPos,0,1); }`;

// ---- terrain generation ------------------------------------------------------

vec2 liMassTurn(vec2 q,float angle){
  float c=cos(angle),s=sin(angle);
  return vec2(c*q.x+s*q.y,-s*q.x+c*q.y);
}
float liRockMass(vec2 q,vec4 mass,vec4 form){
  vec2 v=liMassTurn(q-mass.xy,form.w)/mass.zw;
  float roundR=(sqrt(dot(v,v)+.0016)-.04)/.96;
  // Eight unequal supporting planes form an inscribed, oblique rock section.
  // This is a scalar-field change, not an albedo/normal-map outline.  The
  // constant-bounded arithmetic adds no repeated volume/noise lookup.
  vec4 seed=fract(vec4(mass.x*11.73+mass.y*7.19+form.w*.37,
    mass.y*13.41-form.w*.53+form.x*3.17,
    mass.x*5.71-mass.y*9.23+form.x*7.31,
    form.w*2.71+mass.x*17.13+mass.y*3.61));

  float planeZ=abs(v.y)*(1.+.035*sign(v.y)*(seed.w-.5))*support.y;
  float planeA=abs((v.x+v.y)*.70710678118)*support.z;
  float planeB=abs((v.x-v.y)*.70710678118)*support.w;

  // This limits the same continuous cylindrical highlight around every mass.

  // height drop over radius made the first M3 experiment into thin cones.
  // The power curve retains broad shoulders and a steep limestone flank;
  // supporting planes, scarps and finite joints supply its structural faces.
  float crownExponent=max(1.7,form.y*(.96+.06*seed.y));
  float flankExponent=max(.32,form.z*(.88+.08*seed.z));
  float h=pow(max(0.,1.-pow(r,crownExponent)),flankExponent);
  // Broken, gently dipping beds.  Each setback has one finite lateral gate;
  // different inclinations/widths prevent a contour ring around the mass.
  float bedA=r+.075*v.y-.038*v.x;
  float startA=.555+.055*(seed.x-.5);
  float shelfA=smoothstep(startA-.017,startA+.017,bedA)
      *(1.-smoothstep(startA+.105,startA+.165,bedA));
  float sideA=smoothstep(.015,.31,v.x+.24*v.y)
      *(1.-smoothstep(.42,.82,abs(v.y-.10)));

  float startB=.755+.060*(seed.w-.5);
  float shelfB=smoothstep(startB-.014,startB+.014,bedB)
      *(1.-smoothstep(startB+.060,startB+.115,bedB));

      *(1.-smoothstep(.34,.76,abs(v.x+.12)));

                -(.022+.012*seed.z)*shelfB*sideB);

  // Its two possible orientations are local structural directions, not a
  // summit-centred radial fan. Intact shoulders frame the plane on both sides.
  vec2 scarpN=mix(vec2(.24,.97077289),vec2(-.97590148,.21821789),step(.48,seed.x));
  float along=dot(v,scarpN),across=dot(v,vec2(-scarpN.y,scarpN.x));
  float plane=1.66-2.25*along+.055*across;

      *(1.-smoothstep(.26,.55,abs(across+.10*(seed.z-.5))));
  h-=max(0.,h-max(0.,plane))*scarp;

  // unwarped 1.20 support is applied once more by liKarstBody.

float liMassJoin(float a,float b,float k){
  // The blend width also vanishes at zero: smooth-max(0,0) must be 0,
  // otherwise every mountain acquires the same low circular pedestal.
  float w=min(k,a+b);
  if(w<1e-7)return max(a,b);
  float h=max(w-abs(a-b),0.)/w;
  return max(a,b)+.25*w*h*h;

float liJointCut(vec2 q,vec2 origin,float angle,float width,float ph,float reach){
  vec2 v=liMassTurn(q-origin,angle);
  // Meandering, oblique dissolution joints, at different offsets and extents.
  // There is no radial angular sin() fan and no common altitude gate.
  float bend=.047*sin(v.x*3.7+ph)+.018*sin(v.x*10.1+ph*1.31);
  float across=v.y-bend;

  // old Gaussian only scooped a smoothly rounded groove from each blob.

  // behind the coast rising to ~80 % further inland, ~20 % far out at sea (a broken band on the sea horizon)
  // (r13 sky) + banks from ~.5-1.5 km inland (the valley mouth / coastal hills): the v4 / v5 photos carry big soft banks at
  //  25-40 deg elevation, the r12f sky had only the far banks low over the ridges and popcorn above them (v5 photo ~20 % cloud, r12f ~6 %)
  float eB=(fbm(w*.33+vec2(3.7,1.9),3)+.25*bg.x-(.55-.38*fSea-.4*fL-.08*smoothstep(.5,1.5,dl)-uCloud-uCu.x))*2.2;
  // small scattered heaps (a few hundred m): a handful near the coast, ~9 % further out (no popcorn sky)
  // (r13 sky) threshold .46 -> .62, mid .12 -> .1: far fewer small heaps (they read as popcorn)
  float eS=(fbm(w*1.5+vec2(8.2,4.4),2)-(.62-.1*mid-.1*bg.x-uCloud-uCu.x))*2.8;
  // dome tops: flat near the footprint edge, then a rounded flank (no thin skirts, no vertical walls)
  float tB=(.25+.35*max(fSea,fL)+.25*fL)*(.8+.4*bg.y)*pow(smoothstep(0.,1.2,eB),.6);
  float tS=(.12+.1*mid)*(.8+.4*bg.y)*pow(smoothstep(0.,.6,eS),.6);
  gCuT=max(tB,tS);
  gCuK=smoothstep(.1,.35,tB-tS*.5);
  gCuE=max(eB,eS);
  return gCuE;
}
float cuEnv(vec3 p){ float h=p.y-CB; return min(gCuT-h,h*2.5); }   // km: flat base, rounded top (call after cuCov)
float cuAmp(){ return (1.15+uCu.y*.1)*clamp(gCuT,.1,.6)*smoothstep(-.4,0.,gCuE); }   // detail amplitude (km); 0 well off the heaps
float puffy(vec3 p){                                     // union of jittered balls -> height of the ball surface (0 outside)
  vec3 n=floor(p), o=step(.5,fract(p))-1.;
  float b=0.;
  for(int k=uZero;k<8;k++){
    vec3 c=n+o+vec3(k&1,(k>>1)&1,k>>2);
    vec3 h=hash33(c);
    vec3 r=c+.25+.5*h-p;
    float rad=.5+.24*h.x;
    b=max(b,rad*rad-dot(r,r));
  }
  return sqrt(b);
}
float gCuH;                                              // relative height of the last sample inside its heap (0 base .. 1 top)
float gCuS;                                              // depth (km) of the last sample below the detailed cloud surface
float cuDens(vec3 p, float lod, float w){
  float s=cuEnv(p);
  float A=cuAmp();
  if(s<-A*.9-.04) return 0.;
  float h=max(p.y-CB,0.);
  gCuH=clamp(h/max(gCuT,.05),0.,1.);
  float up=smoothstep(0.,mix(.35,.18,gCuK),gCuH);       // only the lowest part of a heap is torn and wispy (banks: lobed almost to the base)
  vec3 q=p+vec3(uTime*.002,0.,0.);
  q.xz=mat2(.94,.34,-.34,.94)*q.xz;                     // lumps lean / stretch along the trade wind
  float n1=noise3(q*vec3(3.3,4.,4.)+1.7);
  float n2=noise3(q*vec3(8.,9.,9.)+5.1);
  float n3=noise3(q*vec3(18.,26.,28.)+9.3);              // slightly drawn out along the wind
  float n4=lod>.01?noise3(q*vec3(42.,58.,62.)+3.3):0.;
  float wis=n1*.45+n2*.25+n3*.2+n4*.1*lod-.08;          // smoky, torn lumps and wisps
  // cauliflower lobes; big banks add a coarse turret level so the top is a pile of rounded towers, not a lid
  float lob=(puffy(q*3.4)-.42)*1.+(puffy(q*7.5+3.1)-.42)*.5+(lod>.01?(puffy(q*17.+7.7)-.42)*.25*lod:0.);
  lob+=gCuK*(puffy(q*1.5+11.3)-.42)*1.3;
  s+=mix(wis,lob*(.8+uCu.w)+wis*.5,up)*A;
  // fixed-size fibrous detail (tens of m) on every heap, whatever its size: torn, textured edges instead of
  // airbrushed blobs on the small heaps
  s+=(n3*.6+n4*.4*lod)*.02*smoothstep(-.4,0.,gCuE);    // (r13 sky) .028 -> .015: softer, less chipped edges; (r13 fix) .02: a little texture back on the soft rims
  gCuS=s;
  // density builds up inward: torn wisps at the base / edges stay translucent, the lobed body is dense
  float core=mix(3.,7.,up);
  return smoothstep(0.,w,s)*clamp(mix(.12,.3,up)+s*(core+uCv.x*10.),0.,1.);
}
vec3 cirrus(vec3 rd, vec3 c){                            // a few thin high wisps (~8 km), stretched along the upper wind
  vec2 q=rd.xz/max(rd.y,.04)*8.+vec2(uTime*.01,0.);
  vec2 w=mat2(.8,.6,-.6,.8)*q;
  float fld=smoothstep(.55,.9,fbm(w*.025+2.,3)*.5+.5);  // only a few patches of the sky carry cirrus
  vec2 wq=w+vec2(fbm(w*.11+3.,3),fbm(w*.11+7.,3))*6.;
  float f=fbm(wq*vec2(.4,1.6)+fbm(w*.3,2)*1.4,5);
  float cov=smoothstep(.3,.85,f)*fld*.07*smoothstep(.06,.25,rd.y);
  float s=max(dot(rd,uSun),0.);
  vec3 cc=vec3(.95,.97,1.)*(1.25+1.2*pow(s,6.));
  return mix(c,cc,cov);
}
vec3 skyView(vec3 rd){
  vec3 c=skyDome(rd);
  float s=max(dot(rd,uSun),0.);
  c+=vec3(1.,.95,.85)*smoothstep(.99985,.99995,s)*80.;
  c=cirrus(rd,c);
  if(rd.y<=.004) return c;
  vec3 ro=uRo*.001+vec3(uTime*.004,0.,uTime*.0015);      // world-anchored field (km): the same heaps in every view
  float t0=max((CB-.05-ro.y)/rd.y,0.), t1=min((CB+1.6-ro.y)/rd.y,60.);
  if(t0>=t1) return c;
  float cs=dot(rd,uSun);
  // phase (normalised to mean 1): forward lobe + broad back lobe; a softer lobe for the scattering octaves
  float g1=.62, g2=-.18, g3=.3;
  float ph0=.62*(1.-g1*g1)/pow(1.+g1*g1-2.*g1*cs,1.5)+.38*(1.-g2*g2)/pow(1.+g2*g2-2.*g2*cs,1.5);
  float ph1=(1.-g3*g3)/pow(1.+g3*g3-2.*g3*cs,1.5);
  float sunI=1.35+uCu.z;
  float j=hash12(gl_FragCoord.xy*1.37+uJit*173.1+fract(uTime*7.3)*91.);
  float T=1.; vec3 acc=vec3(0); float tw=0., ws=0.;
  float rxz=max(length(rd.xz),.15);
  float t=t0+j*max(.015,t0*.0015);
  for(int i=uZero;i<170;i++){
    if(t>t1||T<.02) break;
    vec3 p=ro+rd*t;
    float pix=t*.0012;                                   // pixel footprint (km)
    float lod=1.-smoothstep(.008,.035,pix);              // fine lobes / wisps faded with the pixel footprint (gone by ~30 km)
    float dmin=max(.01,pix*.8);
    float w=max(.021,pix*2.4);                           // edge ramp: about 2.4 pixels, never under 21 m ((r13 sky) 12 m / 2 px: hard cut-out edges; (r13 fix) the sky round's 30 m / 3 px read slightly out of focus next to the photos' crisp cumulus (v4 / v5): halfway back)
    float e=cuCov(p.xz);
    // conservative clearance (km) to anything that can carry cloud: off the footprints (horizontal) or above the
    // detailed top of the heap below (vertical)
    float clr=max(e<-.4?(-e-.4)*.2/rxz:0., (-cuEnv(p)-cuAmp()*.9-.04)*.45);
    if(clr>dmin*1.5){ t+=clr; continue; }
    float d=cuDens(p,lod,w);
    if(d<.003){ t+=dmin; continue; }
    float hH=gCuH, sD=gCuS, gT=gCuT, gK=gCuK;
    // sun: optical depth toward the sun through the detailed (lobed, eroded) cloud: 25 m .. 440 m, so the near
    // lobes shadow each other ...
    float od=d*.006, ls=.025;
    for(int k=uZero;k<4;k++){ vec3 pl=p+uSun*ls; cuCov(pl.xz); od+=cuDens(pl,0.,max(w,.02))*ls*1.2; ls*=2.6; }
    // ... plus the thick body of a bank further along the sun ray (beyond the march), so bases and the far side
    // of the big heaps sink into shade
    float hh=p.y-CB;
    od+=max((gT-hh)/uSun.y-.75,0.)*.45;
    od*=SIG;
    vec3 sunL=vec3(1.,.96,.9)*ph0*exp(-od)+vec3(.9,.95,1.04)*(.38*ph1*exp(-od*.35)+.18/(1.+od*.1));   // single scattering (warm direct sun) + multiple scattering (the deep, diffuse part falls off slowly: bases stay grey, not black)
    // sky light: blue from above on the tops, dimmer sea / land bounce under the base; less of it deep inside
    // (r13 sky) under-base light (.17,.2,.26) -> (.23,.26,.32) and the deep multiple scattering .14/(1+.12 od) -> .18/(1+.1 od): the
    //  bank bases over the ridges read as dirty grey smoke (cloud p10 L* 70 vs photos 73-78)
    vec3 amb=mix(vec3(.23,.26,.32),vec3(.28,.37,.55),smoothstep(.1,.9,hH))*(1.+uCv.z);
    amb*=mix(1.,.5,smoothstep(.0,.12,sD));               // crevices and the body interior see less sky
    vec3 S=sunI*sunL+amb;
    float dt=dmin*mix(.5,1.,smoothstep(.97,.75,T));     // fine steps where the ray enters the heap: smooth, grain-free wisps
    float a=1.-exp(-d*SIG*dt);
    acc+=T*a*S; tw+=T*a*t; ws+=T*a;
    T*=1.-a;
    t+=dt;
  }
  if(ws>0.){
    float td=tw/ws;
    vec3 hz=skyDome(normalize(vec3(rd.x,.02,rd.z)))*1.25;
    vec3 cc=mix(acc,hz*(1.-T),(1.-exp(-td*.035))*.85);   // distant heaps dissolve into the horizon haze
    float fade=smoothstep(.004,.03,rd.y);
    c=mix(c,c*T+cc*.84,fade);
  }
  return c;
}
vec3 skyIrr(vec3 N){
  vec3 up=vec3(.17,.29,.58), hor=vec3(.36,.45,.58), gnd=vec3(.06,.08,.045);
  float y=N.y;
  return y>0.?mix(hor,up,y):mix(hor,gnd,-y);
}

// ---------------------------------------------------------------- vegetation + rock geometry (signed distance fields)
// Every tree, palm and bush is an individual object, instanced on jittered grids that a
// generation pass fills from the terrain / vegetation masks. Rock faces get true 3D relief.
float gPix=.01;          // pixel footprint (m) at the current sample
bool gVeg=true;          // evaluate trees / bushes at this sample
const float ENV=32.;     // vegetation envelope above the ground (m)

float sdEll(vec3 q, vec3 r){ float k0=length(q/r), k1=length(q/(r*r)); return k0*(k0-1.)/max(k1,1e-5); }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
vec2 tJit(vec4 T){ return fract(T.xy*.5)*2.; }   // cell jitter (the integer part carries a lean: x = direction /16, y = amount)
vec2 tLean(vec4 T){ float k=floor(T.x*.5), m=floor(T.y*.5); float a=k*.3926991; return m>0.?vec2(cos(a),sin(a))*m:vec2(0); }
vec4 cellTex(sampler2D s, vec2 c){ ivec2 sz=textureSize(s,0); return texelFetch(s,clamp(ivec2(c),ivec2(0),sz-1),0); }

// ---- broadleaf crowns: crown envelope -> leaf clusters (~1-1.5 m) -> leaf sprays (~0.5 m) -> individual leaves.
// Every level fades out before it gets smaller than ~2 pixels (band-limited, no sparkle).
float gEpsM=0.;         // (r5) hit tolerance of the current primary march step (0 elsewhere): cheap-bound early-outs keep their value above it
float lodF(float size){ return clamp(size/max(gPix,1e-4)*.5-1.,0.,1.); }   // 1 when size >= 4 px, 0 at <= 2 px
// shading hints written by the crown that won the last treesSD / bushSD evaluation
float gClId, gDe, gSpr, gLeafId, gLeafW, gInner, gCarpIn; vec3 gClOff; vec4 gCrC;   // gCrC: crown centre (xyz) and size R of the crown that won
float gCarpHit=0.;   // (r9 side) gCarpIn of the primary hit (saved by march: the shading no longer re-evaluates terrSD for it)
float tClId, tDe, tSpr, tLeafId, tLeafW, tInner; vec3 tClOff;   // scratch (current candidate)
// leaf sprays: one rounded bump per spray (worley cells), x = dome 0..1
float sprayDome(vec3 p, float cs){
  vec3 q=p/cs, n=floor(q), f=fract(q);
  float d1=8.;
  for(int k=uZero;k<8;k++){
    vec3 o=vec3(k&1,(k>>1)&1,(k>>2)&1)+step(.5,f)-1.;
    vec3 c=n+o;
    vec3 r=o+.2+.6*hash33(c)-f;
    d1=min(d1,dot(r,r));
  }
  float v=max(1.-d1*2.2,0.);
  return v*v*(3.-2.*v);                                      // soft foot: no crease ring around each dome
}
// leaf clusters / sprays as shading-only bumps (below the geometric LOD): x = dome (0 in a gap .. 1 on top),
// yzw = gradient of the dome height (1/m)
vec4 domeG(vec3 p, float cs){
  vec3 q=p/cs, n=floor(q), f=fract(q);
  float d1=8.; vec3 rb=vec3(0);
  for(int k=uZero;k<8;k++){
    vec3 o=vec3(k&1,(k>>1)&1,(k>>2)&1)+step(.5,f)-1.;
    vec3 c=n+o;
    vec3 r=o+.2+.6*hash33(c+5.3)-f;
    float d=dot(r,r);
    if(d<d1){ d1=d; rb=r; }
  }
  float s=max(1.-d1*2.2,0.);
  return vec4(s*s*(3.-2.*s),s>0.?6.*s*(1.-s)*4.4*rb/cs:vec3(0));
}
// individual leaves: one elliptic blade per jittered cell (size ls), facing up / outward, tip drooping.
// dbase = distance to the foliage volume at p: every leaf is clipped at its own depth -> ragged, leafy outline
float leavesSD(vec3 p, float ls, float seed, float dbase){
  vec3 g=p/ls, n=floor(g), f=fract(g);
  float d=1e9;
  for(int k=uZero;k<8;k++){
    vec3 o=vec3(k&1,(k>>1)&1,(k>>2)&1)+step(.5,f)-1.;
    vec3 c=n+o;
    vec3 h=hash33(c+seed), h2=hash33(c*1.71+seed+3.1);
    if(h2.z>.88) continue;                                     // a few empty cells: gaps
    vec3 q=(f-o-.25-.5*h)*ls;
    vec3 nn=normalize(h2*2.-1.+vec3(0,.8,0));
    float s=nn.z>=0.?1.:-1., aa=-1./(s+nn.z), bb=nn.x*nn.y*aa;
    vec3 t1=vec3(1.+s*nn.x*nn.x*aa,s*bb,-s*nn.x), t2=vec3(bb,s+nn.y*nn.y*aa,-nn.y);
    float an=h.z*6.2831853;
    vec3 a=cos(an)*t1+sin(an)*t2, b=cross(nn,a);
    float L=ls*(.38+.24*h.x);                                  // half length
    float x=dot(q,a), y=dot(q,b), z=dot(q,nn)+(.15+.4*h2.y)*x*x/ls+.25*y*y/ls;   // droops along, cups across the midrib
    float xc=clamp(x/L,-1.,1.);
    float e=max(abs(x)-L,(abs(y)-L*(.3+.12*h.y)*(1.-xc*xc))*.75);              // pointed lance / ovate blade
    float dl=max(max(e,abs(z)-.004-gPix*.45),dbase-(.25+1.8*h2.x)*min(ls,.2)-.5*pow(h.y,6.));   // a few leaves sit deep inside: leafy interior
    if(dl<d){ d=dl; tLeafId=h2.y; }
  }
  return d;
}
// multi-scale leafy relief for a foliage surface: leaf clusters (~1.1 m) and sprays (~0.45 m), band-limited.
// tSpr = crevice occlusion factor (mean 1: dark in the gaps between clusters / sprays, bright on their tops)
// (r5) leaf clumps of very different sizes: per-cell size .55-1 and some empty cells, overlapping (max of the domes),
// with a soft foot -> ragged clumps, not a field of identical round pebbles
float sprayDomeV(vec3 p, float cs){
  vec3 q=p/cs, n=floor(q), f=fract(q);
  float v=0.;
  for(int k=uZero;k<8;k++){
    vec3 o=vec3(k&1,(k>>1)&1,(k>>2)&1)+step(.5,f)-1.;
    vec3 c=n+o;
    vec3 h=hash33(c);
    vec3 r=o+.2+.6*h-f;
    float sz=fract(h.x*7.13+h.z*3.7);
    if(sz<.12) continue;                                        // gap
    float kr=mix(.55,1.,sz);
    float s=clamp((1.-dot(r,r)*2.2/(kr*kr))*1.25,0.,1.);
    v=max(v,s*s*(3.-2.*s)*mix(.65,1.,fract(h.y*5.3)));
  }
  return v;
}
float foliageRelief(vec3 p, float fine){
  float f1=lodF(2.2), f2=lodF(1.)*clamp((.3-gPix)*10.,0.,1.), f3=lodF(.45)*fine;   // f2 done by gPix .3 (keeps the shadow LOD pass cheap)
  float r=0., ao=1.;
  if(f1+f2>0.) p+=noised3(p*.45+2.).yzw*.55;                   // warped: irregular leaf clusters, not a sheet of round bubbles
  if(f1>0.){ float s=sprayDomeV(p+7.1,2.2); r+=(s-.45)*.6*f1; ao*=mix(1.,(.66+.4*s)/.86,f1); }   // (r5: softer crevice rims: no dark outline round every 2 m clump)
  if(f2>0.){ float s=sprayDomeV(p,1.); r+=(s-.45)*.3*f2; ao*=mix(1.,(.62+.38*s)/.81,f2); }
  if(f3>0.){ float s=sprayDome(p+3.7,.45); r+=(s-.45)*.13*f3; ao*=mix(1.,(.62+.42*s)/.80,f3); }
  tSpr=ao;
  return r;
}
// leaf clusters on a crown lobe: ~1 m rosettes with deep, dark gaps between them, on a 2.2 m undulation (tSpr = gap occlusion)
float crownRelief(vec3 p){
  float f1=lodF(2.2), f2=lodF(1.05)*clamp((.3-gPix)*10.,0.,1.);
  float r=0., ao=1.;
  vec3 wq=f1>0.?noised3(p*.8).yzw*.3:vec3(0);
  if(f1>0.){ float s=sprayDomeV(p+7.1+wq*1.5,2.2); r+=(s-.45)*.62*f1; ao*=mix(1.,(.5+.6*s)/.77,f1); }   // (r5: clusters of varied size with gaps, warped: ragged crown outlines with protruding clumps, not cauliflower bumps)
  if(f2>0.){ float s=sprayDome(p+wq,1.05); r+=(s-.55)*.8*f2; ao*=mix(1.,(.42+.75*s)/.8,f2); }   // warped: irregular clusters, not round bubbles
  tSpr=ao;
  return r;
}
// ragged, lobed crown envelope (crown-local q): a few big lobes + smaller bulges, no perfect ellipsoids
float crownEnv(vec3 q, vec3 rad, float R, float seed, float rag){
  float de=sdEll(q,rad);
  float n1=noise3(q*(1.5/R)+seed*9.)*.5+.5, n2=noise3(q*(3.4/R)+seed*5.+2.)*.5+.5;
  return de-R*rag*(1.+.7*smoothstep(.3,1.,gPix))*(.62*n1+.38*n2-.35);   // from afar: more ragged, cauliflower outlines
}
// leaves at every distance: the blade size steps up in octaves (x2) so a leaf never gets smaller than ~2.5 px;
// far away a 'leaf' stands for a tuft, which keeps the leafy light / gap structure instead of smooth bumps.
// returns the blended distance; maxOct limits the coarsest octave
float leafOct(vec3 p, float leafS, float seed, float dbase, float maxOct){
  float kf=clamp(log2(max(3.6*gPix/leafS,1.)),0.,maxOct);   // a leaf never smaller than ~3.6 px: leafy, not grainy
  float k0=floor(kf), fk=smoothstep(.72,1.,fract(kf));
  if(kf>=maxOct) fk=0.;
  float s0=exp2(k0);
  float shell=2.05*min(leafS*s0*(fk>0.?2.:1.),.2)+leafS*s0*(fk>0.?2.:1.)*.6+.5;
  if(dbase>shell+.05+2.*gEpsM){ tLeafId=.5; return dbase-shell; }   // far from the foliage shell: cheap bound (r5: the value returned at the threshold, x .6 in crownSD, stays above the current march hit tolerance gEpsM, or the bound itself is hit as a false dotted hull around every crown at grazing angles)
  float d0=leavesSD(p,leafS*s0,seed+k0*13.,dbase);
  float id0=tLeafId;
  if(fk>0.){ float d1=leavesSD(p,leafS*s0*2.,seed+k0*13.+13.,dbase); d0=mix(d0,d1,fk); if(fk<.5) tLeafId=id0; }
  return d0;
}
// leaf clusters on a jittered grid inside the crown envelope
// the cluster lattice is rotated / tilted per tree, so clusters never line up in horizontal rows (no terraced hedges)
mat3 latticeRot(float seed){
  float a=seed*6.2831, b=.45+.35*fract(seed*7.7), c=fract(seed*3.3)*6.2831;
  float ca=cos(a), sa=sin(a), cb=cos(b), sb=sin(b), cc=cos(c), sc=sin(c);
  return mat3(ca,0.,-sa, 0.,1.,0., sa,0.,ca)*mat3(1.,0.,0., 0.,cb,sb, 0.,-sb,cb)*mat3(cc,0.,-sc, 0.,1.,0., sc,0.,cc);
}
float clusterField(vec3 q, float cs, float seed, vec3 rad, float R, float rag, float rs){
  mat3 M=latticeRot(seed);
  vec3 g=(M*q)/cs, n=floor(g), f=fract(g);
  float best=1e9;
  for(int k=uZero;k<8;k++){
    vec3 o=vec3(k&1,(k>>1)&1,(k>>2)&1)+step(.5,f)-1.;
    vec3 c=n+o;
    vec3 h=hash33(c+seed*17.3);
    vec3 cc=((c+.1+.8*h)*cs)*M;                               // cluster centre (crown-local, back from the lattice frame)
    float env=sdEll(cc,rad*(.74+.45*rag*h.z));
    if(env>0.) continue;
    float r=cs*(rs+.24*h.x)*(1.-.3*smoothstep(-.3*R,0.,env));
    vec3 dq=q-cc; dq.y*=1.35;                                 // flattish clusters (leaves at branch tips)
    float d=length(dq)-r;
    if(d<best){ best=d; tClId=h.y; tClOff=dq/r; }
  }
  return best/1.35;
}
// R = crown size (m); leafS = leaf length (m); rag = raggedness of the outline
// Crown v3: K leaf masses at the branch tips, set on the outer shell of the crown volume (a crown is hollow: dark
// limbs and a sparse inner core show through the gaps between the masses), joined softly at their bases.
// Near: every mass carries leaf clusters (2.2 m / 1 m) and real leaves. Far: masses stay until ~5 px, then the lobed envelope.
float tLimb=0.;
float crownSD(vec3 p, vec3 cen, vec3 rad, float seed, float R, float leafS, float rag){
  vec3 q=p-cen;
  float de=sdEll(q,rad);
  tDe=de/R; tSpr=1.; tClId=seed; tClOff=q/rad; tLeafW=0.; tInner=0.; tLimb=0.;
  if(de>R*.6+1.2*gEpsM) return de-R*.5;   // (r5: threshold above the hit tolerance: returning ~.1R there made a thin false shell around every crown, hit only at grazing angles = the dotted 'hoops' on skylines)
  float env=crownEnv(q,rad,R,seed,rag);
  vec3 offE=normalize(q/rad+vec3(0,.6,0));
  float f2=clamp(R*.4/gPix/1.2-1.,0.,1.);                     // masses full at ~3 px each (seen from the air too); below, one lobed dome
  if(f2<=0.){ tClOff=offE; tDe=0.; return env*.75; }
  float K=floor(7.+4.*fract(seed*5.13));                         // 7..10 branch-tip masses
  float a0=seed*6.2831853;
  float d=1e9, d2=1e9, bi=0.; vec3 bo=vec3(0,1,0);
  float dlb=1e9;
  bool limbs=gPix<.2&&uDbgM!=50;
  vec3 tb=vec3(0.,-rad.y*.6,0.);                                 // top of the trunk (crown base)
  for(int i=uZero;i<10;i++){
    float fi=float(i); if(fi>=K) break;
    vec3 h=hash33(vec3(seed*53.17+fi*1.731,fi*7.13+seed*3.1,seed*11.7-fi));
    float az=a0+(fi+.8*h.x)*6.2831853/K;
    float el=fi<.5?1.4:mix(-.15,1.15,h.y);                        // elevation of the branch tip: low wide masses .. upper masses
    float rho=fi<.5?.3:mix(.38,.72,h.z);
    float hs=fract(h.x*7.7+h.z*3.1);
    float s=R*mix(.18,.46,hs*hs*(3.-2.*hs))*(fi<.5?1.1:1.);
    if(fract(h.y*13.1)<.4&&fi>.5){ rho=mix(.84,1.,h.z); s*=.55; }   // small masses sticking far out: ragged outline (r5: more of them, further out)
    vec3 c=rad*rho*vec3(cos(el)*cos(az),sin(el),cos(el)*sin(az));
    vec3 sr=vec3(s,s*mix(.68,.92,h.y),s);                          // flattish: leaves in horizontal sprays (layered crowns) ((r10 canopy) .55-.8 -> .68-.92: rounded masses, not stacked pads)
    vec3 dq=q-c;
    float dm=sdEll(dq,sr);
    if(dm<d){ d2=d; d=dm; bi=fi; bo=dq/sr; } else d2=min(d2,dm);
    if(limbs) dlb=min(dlb,sdCap(q,tb,c*.85,R*.022+.035));
  }
  float kk=R*.09, hh=max(kk-abs(d-d2),0.)/kk; d-=hh*hh*kk*.25;   // masses join softly at their bases, deep clefts between them (r5: less webbing: see-through gaps)
  d-=R*rag*.3*(noise3(q*(2.4/R)+seed*11.)*.5+.25);               // ragged outlines
  float inn=0.;
  d=mix(env,d,f2);
  tClId=fract(bi*.618+seed*3.7); tClOff=mix(offE,normalize(bo+vec3(0,.2,0)),f2); tDe=env/R*f2;
  if(gPix>.3||uDbgM==52){ tInner=inn; return d*.72; }
  float dr=d-crownRelief(p+seed*31.);                           // leaf clusters with dark gaps on the masses
  tLeafW=1.;
  float dl=leafOct(p,leafS,seed*57.,dr-.06,3.), fb=dr+.6;     // leaves; the dense interior .6 m below shows through the gaps
  tInner=max(max(smoothstep(-.03,.03,dl-fb),smoothstep(.0,.5,-dr)),inn);
  float dm=uDbgM==21?dr:min(dl,fb);
  if(limbs&&dlb<dm*.6){ tLimb=1.; return dlb; }
  return dm*.6;
}
// tree species (from the per-tree seed): 0 dark dome (mango, java plum), 1 mid-green dome, 2 umbrella (albizia, monkeypod),
// 3 pale open crown (kukui), 4 yellow-green tangle (hau, guava)
float treeType(float seed){ float k=fract(seed*7.31); return k<.32?0.:k<.6?1.:k<.75?2.:k<.83?3.:4.; }   // kukui (3) rarer: few pale crowns
void treeGeo(vec2 c, vec4 T, out vec3 base, out vec3 cen, out vec3 rad, out float sp, out float seed){
  float R=mod(T.w,100.); sp=floor(T.w/100.+.01);
  seed=hash12(c*1.37+.5);
  vec2 bxz=uTG.xy+(c+tJit(T))*uTG.z;
  base=vec3(bxz.x,T.z,bxz.y);
  vec2 ln=tLean(T);
  float ty=treeType(seed), h1=hash12(c+3.3), h2=hash12(c+7.1), h3=hash12(c+9.7);
  float th=R*(.32+.55*h1);                                       // crowns reach down: a closed canopy from above, short trunks under it
  rad=vec3(R*(.75+.3*seed),R*(.6+.3*h2),R*(.75+.3*h3));       // crowns a bit wider than tall
  if(ty==2.){ float wu=mix(1.2,1.04,smoothstep(4.,6.5,R)); rad*=vec3(wu,.92,wu); th=R*(.42+.3*h1); }        // umbrella: wide flat crown on a taller trunk ((r10 canopy) 1.3-1.1 x .8 / .55R -> 1.2-1.04 x .92 / .42R: no pancake discs on sticks on the v4 / v5 skylines)
  if(ty==4.){ rad*=vec3(1.1,.8,1.1); th=R*.05; }                // low tangle down to the ground
  if(sp>1.5) th+=R*.4;                                           // emergent
  th+=max(noise3(vec3(bxz*.016,3.7))+.25*noise3(vec3(bxz*.05,1.3)),-.3)*4.5;   // groves of tall trees and lower gaps: big lit / shaded canopy masses
  if(ln.x!=0.||ln.y!=0.) th*=.55;                                // beach trees: low crowns leaning out over the sand
  cen=base+vec3((hash12(c+1.9)-.5)*.35*R+ln.x*.4,th+rad.y,(hash12(c+4.2)-.5)*.35*R+ln.y*.4);
}
// ---- coconut palm: slender curved trunk + ~22 arching / drooping pinnate fronds in two whorls (polar repetition).
// Fronds: parabolic rachis; leaflets every ~10 cm of arc length hang down / outward in a V and curl at the tips.
vec4 gFr, tFr, gFrW, gPalmC, tPalmC;   // gPalmC: crown top (xyz) and frond length (w) of the palm that won        // frond hints: x = position along the frond (0..1), y = frond hash, z = leaflet hash, w = leaflet across (0 rachis .. 1 tip)
float asinh_(float x){ return log(x+sqrt(x*x+1.)); }
float arcF(float u){ return u*sqrt(1.+u*u)+asinh_(u); }
float frondSD(vec3 q, float a, float k, float off, float seed, float fl, float tier, float nb){
  float sec=6.2831853/k;
  float xs=(a+off)/sec, ai=floor(xs+.5), sd=xs>ai?1.:-1.;
  if(nb>.5) ai+=sd;                                     // the neighbouring frond: fronds overlap freely (no pie-slice fans)
  float h1=hash11(ai*1.7+seed*13.+tier*5.);
  if(tier<1.5&&fract(h1*31.7)<.12){                    // a few fronds missing (irregular crowns): take the frond on the other side
    if(nb>.5) return 1.5+gPix;
    ai-=sd; h1=hash11(ai*1.7+seed*13.+tier*5.);
    if(fract(h1*31.7)<.12) return 1.5+gPix;
  }
  float aa=a+off-ai*sec;
  float h2=hash11(ai*3.1+seed*7.+tier*3.), h3=hash11(ai*5.3+seed*3.+tier);
  aa+=(h3-.5)*sec*.8;                                   // irregular azimuths
  float rxz=length(q.xz);
  float gm=min(gPix*2.,.45);                            // (r5) early-out values stay above the hit tolerance at mid range too (the 2.2 m / 1 m margins keep them conservative)
  { float lt=abs(rxz*sin(aa))-.42*fl-2.2; if(lt>0.) return lt*.8+.35+gm; }   // far to the side of this frond (incl. its sideways bend): cheap early out.
  // NB every early return must stay well above the march epsilon at its threshold, or its boundary becomes a false surface
  // tier 0: spreading, 1: old drooping, 2: young upright fronds in the centre
  float up=tier<.5?mix(.3,1.2,h1):tier<1.5?mix(-.25,.35,h1):mix(1.2,2.2,h1);
  float dr=tier<.5?mix(.45,1.,h2):tier<1.5?mix(.7,1.2,h2):mix(.35,.8,h2);   // upper fronds rise and arch out, lower ones hang
  float flen=fl*(tier<.5?.85+.35*h2:tier<1.5?.75+.3*h3:.45+.25*h3);
  // horizontal reach from the arc length: steep fronds are not longer than flat ones
  float Lh=flen*4.*dr/(arcF(up)-arcF(up-2.*dr));
  float b=dr/Lh;
  float fx=rxz*cos(aa), fz=rxz*sin(aa);
  float x=clamp(fx,0.,Lh);
  fz-=(h3-.5)*.7*x*x/Lh;                                // fronds also bend sideways
  if(abs(fz)>2.4) return (abs(fz)-1.75)*.8+gm;           // beyond the longest leaflet: cheap bound (>= .52 at the threshold)
  float Y=up*x-b*x*x, Yp=up-2.*b*x;
  float t=x/Lh;
  float sArc=(arcF(up)-arcF(Yp))/(4.*b);              // arc length along the rachis
  float lat=abs(fz);
  float gs=inversesqrt(1.+Yp*Yp);
  // rachis (midrib)
  float rach=length(vec2((q.y-Y)*gs,fz))-.04*(1.-t*.7);
  rach=max(rach,max(fx-Lh,-fx-.2));
  // leaflets: longest mid-frond; near the crown they rise in a shallow V, toward the tip they hang almost straight down
  float lmax=mix(.9,1.2,h3)*(.2+.8*sin(PI*clamp(t*1.04+.03,0.,1.)))*(tier>1.5?.75:1.);
  float tV=mix(.22,.5,h1)+1.3*t*t+(tier>.5&&tier<1.5?.3:0.);   // shallow V near the crown (flat feathery blades from above), drooping toward the tip
  // leaflets (~8.5 cm apart, swept forward ~50 deg); each has its own hang angle and length, a few are torn out.
  // Wide at the rachis, tapering to the tip: a full blade near the midrib, a see-through feathery fringe outside.
  // Spacing never drops below ~4 px (it follows the pixel size); the fringe gaps stay wider than the march epsilon
  // (no hit-tolerance growth on fronds, see march) and the vertical fringe bound below keeps rays from crawling under
  // the crown, so no 'curtains'.
  float pg=max(gPix,1e-4);
  const float fw=1.2;
  float sp=max(.085,pg*5.2);                           // real leaflet spacing (~8.5 cm) close up; further away >= ~3.3 px between strands across (.64*sp; r4: 2.7 px = sub-pixel comb, 4 px = fat paddles)
  float sl=sArc-lat*(fw+.35*sin(sArc*2.3+ai*1.7+seed*9.)), li=floor(sl/sp+.5), ls=(sl-li*sp)*.64;   // .64 = 1/sqrt(1+fw^2): across the strand
  float hl=hash11(li*7.3+ai*1.3+seed*5.+tier*9.+floor(sp*40.)+step(0.,fz)*31.);
  float hl2=fract(hl*17.31), hl3=fract(hl*53.7);
  float plim=clamp(.085/(pg*5.2),0.,1.);              // < 1: spacing held at the pixel limit
  ls+=(fract(hl*91.3)-.5)*sp*mix(.1,.3,plim*plim);    // strands irregularly spaced (no regular comb); less jitter at the pixel limit (no sub-pixel gaps)
  float tVl=tV*(.55+.9*hl2)+sign(fz)*(h2-.5)*1.2*t;   // every strand hangs at its own angle (neighbours overlap in depth: no comb); the frond rolls along its length
  float lw=lmax*(.75+.4*hl3)*step(.07,hl)/sqrt(1.+tVl*tVl);   // strand of true length ~lmax: steep strands reach less far out (a few missing / torn)
  float u=clamp(lat/max(lw,.05),0.,1.);
  float cu=(.3+.4*hl2)/max(mix(lw,lmax,smoothstep(.4,.6,pg)),.2);
  float yl=Y-lat*tVl-lat*lat*cu;                       // strands curl down toward their tips
  float gl=inversesqrt(1.+Yp*Yp+pow(abs(tVl)+2.*lat*cu,2.));
  float wid=sp*(.34+.12*hl3)*(1.-.55*u);       // leaflets touch at the rachis (a full feathery blade) and taper to an open fringe at the tips (r5: a bit wider: fewer dark V gaps)
  // (r5) filtered fallback: neither a leaflet nor the gap between two leaflets gets narrower than ~2 px (sub-pixel
  // combs alias into stair-stepped dark serrations); where the gaps near the rachis would be sub-pixel the blade closes
  // (the strands repeat every .64*sp across: half period P)
  { float gmn=pg*1.0, P=sp*.32;
    float core=smoothstep(.45,.18,u)*smoothstep(gmn*1.4,gmn*.5,P-wid);
    wid=min(max(wid,gmn),P-gmn);
    wid=mix(wid,P*1.2,core); }
  float thick=.006+pg*.35;
  float slab=abs(q.y-yl)*gl-thick;
  float lfd=max(max(slab,abs(ls)-wid),lat-lw);
  float sol=smoothstep(.4,.6,pg);                     // aerial: fronds as narrow solid blades (a star from above)
  if(sol>0.) lfd=mix(lfd,max(slab-pg*.25,lat-lmax*mix(.6,1.4,smoothstep(.3,1.,pg))),sol);
  lfd=max(lfd,max(fx-Lh-.1,-fx));
  // vertical bound of the whole hanging fringe at this point of the frond: no strand reaches below ybot or above the
  // rachis. Without it the steep strands' slab distance (|dy| * small gradient factor) crawls under / over every crown.
  float ybot=Y-lmax*mix(1.42,1.4*(tV*1.45+.6*t)+1.4,sol)-.05-pg*.3;
  lfd=max(lfd,max(ybot-q.y,q.y-Y-.08-pg*.3)*gs*.85);
  tFr=vec4(t,h2,hl,u);
  return min(rach,lfd);
}
// (r9 side) palm placement from its cell, shared by palmSD and the per-cell bound pass FS_TREEB (patch_v3.cjs)
void palmGeo(vec2 c, vec4 T, out float seed, out vec3 base, out float ht, out vec2 lean){
  seed=hash12(c*1.37+.5);
  vec2 bxz=uTG.xy+(c+tJit(T))*uTG.z; base=vec3(bxz.x,T.z,bxz.y);
  float hv=hash12(c+11.3);
  ht=9.5+16.*hv;                                         // palms of every age: some tower above the broadleaf canopy, others stand in it (r5)
  lean=(hash22(c+5.1)-.5)*mix(2.,7.,hash12(c+2.7));
  vec2 ln=tLean(T); if(ln.x!=0.||ln.y!=0.){ lean=lean*.3+ln*mix(.45,.8,hash12(c+8.3)); ht=8.+10.*seed; }   // beach palms: lower, leaning out over the sand
}
float palmSD(vec3 p, vec2 c, vec4 T, out float part){
  float seed, ht; vec3 base; vec2 lean; palmGeo(c,T,seed,base,ht,lean);
  float ty=clamp((p.y-base.y)/ht,0.,1.);
  vec2 tc=base.xz+lean*(1.-(1.-ty)*(1.-ty));                  // leaves the ground slanted, grows straight up
  float slope=2.*length(lean)*(1.-ty)/ht;
  float rad=.16-.04*ty+.12*exp(-ty*ht*1.5);                    // slender, swollen foot
  float tr=(length(p.xz-tc)-rad)*inversesqrt(1.+slope*slope);
  tr=max(tr,max(base.y-.6-p.y,p.y-base.y-ht-.2))*.85;
  tr+=smoothstep(.3,.6,gPix)*.6;                               // sub-pixel trunks vanish from afar instead of aliasing into streaks
  vec3 top=vec3(base.x+lean.x,base.y+ht,base.z+lean.y);
  float fl0=mod(T.w,100.); tPalmC=vec4(top-vec3(0,fl0*.2,0),fl0);
  vec3 q=p-top;
  float fl=mod(T.w,100.);
  float hd=length(q+vec3(0,.35,0))-.42;                        // crown shaft and frond bases
  if(hd<1.2&&gPix<.15){                                         // a bunch of coconuts under the crown (near only)
    float an=atan(q.z,q.x)+seed*9.; float ia=floor(an/.8976+.5); float aa=an-ia*.8976;   // 7 sectors
    float hn=hash11(ia+seed*31.);
    vec2 pq=vec2(length(q.xz)*cos(aa)-.36-.08*hn,length(q.xz)*sin(aa));
    float nut=hn<.25?1e9:length(vec3(pq.x,q.y+.62+.22*hn,pq.y))-.13;
    hd=min(hd,nut);
  }
  float fr=length(q+vec3(0,fl*.1,0))-fl*1.2-1.5;
  part=4.;
  if(fr<1.&&gPix<.75){
    float a=atan(q.z,q.x)+seed*6.2831;
    // each whorl only where it can reach (vertical slabs around the crown): saves most of the frond cost
    float rq=length(q.xz);
    float lo0=-.85*fl-1.4, hi0=.7*fl+.3, lo1=-.95*fl-1.5, hi1=.25*fl+.3, hi2=.7*fl;
    float k0=11.+floor(4.*fract(seed*7.3)), k1=8.+floor(4.*fract(seed*11.9));   // 11-14 spreading, 8-11 drooping fronds: full coconut crowns (r5, r4)
    // 2 whorls x (nearest + neighbouring frond) + the young upright fronds, in one loop (frondSD inlined once: short compile)
    float fm=1e9; vec4 frB=vec4(0);
    for(int i=uZero;i<5;i++){
      float tier=float(min(i>>1,2)), nb=float(i&1)*(i<4?1.:0.);
      if(nb>.5&&uDbgM==53) continue;
      float lo=tier<.5?lo0:tier<1.5?lo1:-.8, hi=tier<.5?hi0:tier<1.5?hi1:hi2;
      float ob=max(lo-q.y,q.y-hi); if(tier>1.5) ob=max(ob,rq-fl*.6-.8);
      float fd=ob+.3+gPix*2.;
      if(ob<0.) fd=frondSD(q,a,tier<.5?k0:tier<1.5?k1:5.,tier<.5?0.:tier<1.5?.31:.5,seed,fl,tier,nb);

    }
    tFr=frB;
    fr=fm*.92;
  }
  gFr=tFr;
  if(hd<fr){ fr=hd; gFr=vec4(0,.5,.5,0); }

  float sw=smoothstep(.4,.75,gPix);
  if(sw>0.){
    float a=atan(q.z,q.x)+seed*6.2831;
    float ka=6.+floor(4.*fract(seed*7.3));                          // (r4f: 7-8 arms as in r3: 11-14 arms are sub-pixel from the air and break into checker speckle; r5: 6-9, crowns differ)
    float x=a*ka/6.2831853, ia=floor(x+.5);

    float lobe=1.-smoothstep(.1,.5,fa);                              // narrow frond arms, notches between them
    // (r4f: the arms / notches fade to the mean once an arm spans fewer than ~3 px: no per-pixel checker speckle from the air)
    float armPx=4.*fl/(ka*max(gPix,.01));
    lobe=mix(.55,lobe,smoothstep(1.5,3.5,armPx));
    float rr=fl*(.55+.5*lobe*(.45+.7*ha*ha));                        // uneven frond lengths: a ragged rosette, not a starfish (r5: a few short / broken arms, shallower notches)
    float rq=clamp(length(q.xz)/max(rr,.1),0.,1.);
    // (r5) every crown tilts its own way and droops by its own amount: from the air the sunlit part of each rosette
    // differs (it was the same half-star fan on every palm)
    vec2 tv=(hash22(c+17.7)-.5)*.6;
    float dro=mix(.06,.26,hash12(c+23.1));
    float cap=sdEll(q+vec3(0,fl*(.2+dro*rq*rq)-dot(q.xz,tv),0),vec3(rr,fl*.22,rr))*.7;   // the arms droop toward their tips
    fr=sw>=1.?cap:mix(fr,cap,sw);
    if(sw>.5) gFr=vec4(.6,ha,.5,clamp(.15+.5*(1.-lobe)+.35*rq,.15,1.));   // shading: yellow arm centres, dark notches / drooping tips, a few dead arms
  }
  if(tr<fr){ part=5.; return tr; }
  return fr;
}
// inf: x=seed, y=species, z=height in crown (0..1), w=material (1 crown, 2 trunk, 4 frond, 5 palm trunk)
// bound: distance of the closest other surface (terrain): cells that cannot beat it are skipped (most of the cost)
float treesSD(vec3 p, out vec4 inf, float bound){
  vec2 ci=floor((p.xz-uTG.xy)*uTG.w);
  float best=1e9; inf=vec4(0,0,0,1);
  vec2 tsz=vec2(textureSize(uTrees,0));
  for(int k=uZero;k<9;k++){
    int kk=k==0?4:(k<5?k-1:k);   // (r9 side) the centre cell first: the nearest crowns set 'best' early, so more cells fail the bound tests
    vec2 c=ci+vec2(kk%3-1,kk/3-1);
    vec4 T=cellTex(uTrees,c);
    float R=mod(T.w,100.); if(R<.5) continue;
    vec2 bq=uTG.xy+(c+tJit(T))*uTG.z;
    if(length(p.xz-bq)-(T.w>299.?R*1.25+6.5:R*1.75+3.)>min(best,bound)) continue;   // cheap reject: cell cannot beat the best hit so far
    // (r9 side) 3D reject with the cell's baked bound (FS_TREEB): a capsule from the foot to the crown centre (palms: to the crown
    // top) that encloses trunk and crown (radius max(rad) + .75 R as in the crown test below; palms 1.6 L + 2 m). Rays skimming over
    // the canopy (view 5) no longer run treeGeo / palmSD for every crown below them. Same image (conservative bound).
    if(uDbgM!=78&&uDbgM!=80&&uDbgM!=82&&c.x>=0.&&c.y>=0.&&c.x<tsz.x&&c.y<tsz.y){ vec4 Bd=texelFetch(uTB,ivec2(c),0); if(sdCap(p,vec3(bq.x,T.z-.6,bq.y),Bd.xyz,Bd.w)>min(best,bound)) continue; }
    if(T.w>299.){ if(uDbgM==84) continue; float part; float d=palmSD(p,c,T,part); if(d<best){best=d; inf=vec4(hash12(c*1.37+.5),3.,0.,part); gFrW=gFr; gPalmC=tPalmC;} continue; }
    vec3 base,cen,rad; float sp,seed; treeGeo(c,T,base,cen,rad,sp,seed);
    float dt=sdCap(p,base-vec3(0,.5,0),cen,.14+R*.035);
    if(dt<best){best=dt; inf=vec4(seed,sp,0.,2.);}
    vec3 q=p-cen;
    if(sdEll(q,rad)-R*.75>min(best,bound)) continue;
    float ty=treeType(seed);
    float d=crownSD(p,cen,rad,seed,R,ty==3.?.26:.13+.1*fract(seed*5.3),ty==3.?.55:ty==2.?.3:.4);
    if(d<best){best=d; inf=vec4(seed,sp,clamp(q.y/rad.y*.5+.5,0.,1.),tLimb>.5?2.:1.); gClId=tClId; gClOff=tClOff; gDe=tDe; gSpr=tSpr; gLeafId=tLeafId; gLeafW=tLeafW; gInner=tInner; gCrC=vec4(cen,R);}
  }
  return best;
}
float treesSD(vec3 p, out vec4 inf){ return treesSD(p,inf,1e9); }
// shrubs and fern clumps (inf.w = 3)
float bushSD(vec3 p, out vec4 inf, float bound){
  vec2 ci=floor((p.xz-uBG.xy)*uBG.w);
  float best=1e9; inf=vec4(0,0,0,3);
  for(int j=uZero-1;j<=1;j++) for(int i=uZero-1;i<=1;i++){
    vec2 c=ci+vec2(i,j);
    vec4 T=cellTex(uBush,c);
    float R=T.w; if(R<.3) continue;
    float thk=R>9.?1.:0.; R-=10.*thk;                          // thicket shrub: raised, taller mass
    float seed=hash12(c*2.31+.7);
    vec2 bxz=uBG.xy+(c+T.xy)*uBG.z;
    vec3 cen=vec3(bxz.x,T.z+R*(.28+.5*thk),bxz.y);
    vec3 rad=vec3(R*(.85+.3*hash12(c+1.1)),R*(.55+.2*seed+.25*thk),R*(.85+.3*hash12(c+2.2)));
    vec3 q=p-cen;
    float de=sdEll(q,rad);

// The rock mass is cut by three joint sets: near-horizontal flow bedding and two steep joint sets, each with irregular
// spacing (every joint jittered by up to +-.32 of the spacing) and gently curved (domain warp). Every block between

// thresholded noise (no iso-contour scribbles / topographic lines), no vertical prisms (no organ pipes).
// Four octaves (~20 m, ~8 m, ~3 m, ~1 m) in one non-unrolled loop, plus knobby weathering (smooth noise ~3 m, ~1.1 m,
// ~.45 m) and ~25 m runoff flutes on the walls. Every term is band-limited by the pixel footprint: risers widen to
// ~1.6 px, steps fade to tilted facets, and once a block / knob is < ~5 px it fades to its mean (no shimmer).

float rkSet(float s, float sd, float e, out vec4 o){

float rkSlotD(float s, float sd, out float id){   // distance (spacing units) to the nearest jittered joint, its index

float rkSlots(vec3 q, float gp){

// x = canopy height here (m), y = crown id, z = this crown's own top height (m)
vec3 canopyCrowns(vec3 p, float cs, float seed, float hs, float pres){

  float liReliefBase=d;   // conservative bound for the relief below (r5 fix: the value returned at the threshold, 2 m + 1.5 gEpsM, stays above the march hit tolerance gEpsM as in crownSD / leafOct -- a plain 2 m was hit as a false shell ~10 m above far ridges on grazing rays once gEpsM > 2 m)
  {
    vec4 vm=VEG(p.xz);
    float bare=1.; // M4: independent rock substrate; V is habitat potential
    // rock relief weight from a wide-baseline slope (10 m) and the sample height: the relief shell reaches ~5 m in
    // front of a wall, where the local 1.2 m slope and the ground height h are those of the foot of the wall;
    // weighting by them switched metres of relief on and off between neighbouring samples (speckled normals / AO)
    const float e3=5.;
    float sx=H(p.xz+vec2(e3,0.))-H(p.xz-vec2(e3,0.)), sz=H(p.xz+vec2(0.,e3))-H(p.xz-vec2(0.,e3));
    float sl10=sqrt(sx*sx+sz*sz)/(2.*e3);
    float steepB=smoothstep(.6,1.3,sl10);
    gRkSl=smoothstep(1.2,2.2,sl10); gRkSt=smoothstep(1.,2.2,sl10);
    float rw=steepB*bare*smoothstep(-.5,2.5,max(h,p.y))*smoothstep(-1.5,1.5,p.y);   // (r5: relief down to the waterline: the rock there is the most rugged)
    // rock: the base surface is the C2 bicubic height, not the bilinear one. On a wall the bilinear cells' normal kinks
    // read as evenly spaced horizontal / vertical light lines (~3-4 m apart: the 1.17 m grid seen up a steep face)
    // The relief offset is scaled with the slope of that smooth surface too: at a sheer cliff foot the bilinear 1.2 m
    // slope jumps from cell to cell, so the wall stood out by a different amount in every cell column ("organ pipes")
    float hw=steepB*mix(bare,1.,uMC.z), s2r=s2;   // (r13 mat) uMC.z (URL mc2): the vegetated walls too sit on the C2 bicubic surface (the bilinear 1.2 m cells read as horizontal stepped slots up the walls, film t72 / t84)
    if(hw>.01){
      float hc0=Hc(p.xz), hcx=Hc(p.xz+vec2(e,0.))-hc0, hcz=Hc(p.xz+vec2(0.,e))-hc0;
      s2r=mix(s2,(hcx*hcx+hcz*hcz)/(e*e),hw);
      d-=(hc0-h)*hw/sqrt(1.+max(s2,ms*ms));
    }
    if(rw>.01){
      float liPerpendicularOffset=rockDisp(p)*rw*.9*sqrt((1.+s2r)/(1.+max(s2,ms*ms)));
      // Include bicubic correction in the same explicit bound. A new rock
      // face cannot cross zero outside the existing 12m early-out slab.
      float liCombinedOffset=clamp(liReliefBase-d+liPerpendicularOffset,-10.,10.);
      d=(liReliefBase-liCombinedOffset)*mix(1.,.6,rw);
    }   // true perpendicular offset; steep relief -> shorter steps (no overshoot)
    float cw=smoothstep(.2,.6,vm.r)*smoothstep(.35,.0,vm.b)*(gVeg&&uDbgM!=85?1.:0.);   // (r9 side) 84 / 85: timing switches (palms / ground canopy off)
    if(cw>.01){
      vec3 sn=smoothNormal(p.xz);
      vec3 cc=canopyField(p,canopyAnchor(p,h,sn),vm.a);
      // the canopy offset is applied in true-distance units (smooth local slope); the conservative max-slope
      // factor (sc) only shortens the march steps. Otherwise crowns near cliff edges inflate into floating slabs.
      float kt=sqrt(1.+max(s2,ms*ms))*sn.y;                    // scaled -> true distance
      d*=kt;
      float sc=min(1./max(kt,1e-3),1.);
      float dc=d-(cc.x+.3)*cw;                                 // canopy surface
      float dm=dc-foliageRelief(p,1.)*cw*mix(clamp(2.2/gPix*.25-1.,0.,1.),1.,gCanW);   // fern / grass carpet: smooth from afar; tree crowns keep their leaf masses
      float lw=clamp(3.-gPix*20.,0.,1.)*cw;                   // leaves out to gPix ~.15 (the shadow pass, at gPix .32, stays cheap)
      if(uDbgM==20) lw=0.;
      if(lw>0.){ float dl=leafOct(p,.17,5.,dm+.05,2.); gCarpIn=max(smoothstep(-.03,.03,dl-dm-.6),smoothstep(.0,.5,-dm))*lw; dm=mix(dm,min(dl,dm+.6),lw); }
      d=dm*sc*(gPix<.3?.55:.72);                               // coarse LOD (incl. the shadow pass): smoother field, longer steps
    }
    steepW=rw;
  }
  return d;
}
// whole scene: distance + info (w = material: 0 ground/rock, 1 crown, 2 trunk, 3 bush, 4 frond, 5 palm trunk)
float sceneSD(vec3 p, out vec4 inf){
  float h=H(p.xz);
  float sw;
  float d=terrSD(p,h,sw);
  inf=vec4(sw,0.,0.,0.);
  if(gVeg&&p.y-h<ENV){
    vec4 ti; float dt=uDbgM==22?1e9:treesSD(p,ti,d); if(dt<d){d=dt; inf=ti;}
    vec4 bi; float db=uDbgM==23?1e9:bushSD(p,bi,d); if(db<d){d=db; inf=bi;}
  }
  return d;
}

// ---------------------------------------------------------------- terrain march / shadows
float gWhy=0., gIt=0.;
// Two-level march: cheap heightfield steps far above the vegetation envelope, sphere tracing inside it.
// Steps grow with distance and iteration count so grazing rays along steep slopes always terminate.
float pkDbg(){ return uDbgM>=100?float(uDbgM-100):1.; }   // debug only (dbgm=100+k): LOD of a k x wider view, to inspect far LOD in a zoomed probe
// Conservative high-altitude search bounds from the independent native peaks.
// Lowland forest stays on the retained source path below y=60 m.
const vec3 LI_RAY_LO[11]=vec3[11](vec3(244.4437366,60.0000000,-468.1433309),vec3(515.2195855,60.0000000,-922.8920448),vec3(466.8680175,60.0000000,-1732.9211498),vec3(858.8315849,60.0000000,-210.5557668),vec3(241.3727717,60.0000000,425.1698074),vec3(407.0128000,60.0000000,-727.9872000),vec3(656.4320000,60.0000000,-1533.5680000),vec3(407.0128000,60.0000000,-337.9872000),vec3(572.1294588,60.0000000,-480.3743949),vec3(724.4933343,60.0000000,-1211.0208763),vec3(1354.1400000,60.0000000,72.3000000));
const vec3 LI_RAY_HI[11]=vec3[11](vec3(905.5562634,545.4000000,128.1433309),vec3(1154.7804145,628.6000000,-197.1079552),vec3(1193.1319825,659.8000000,-987.0788502),vec3(1581.1684151,580.5000000,450.5557668),vec3(868.6272283,454.4000000,1124.8301926),vec3(1002.9872000,304.3132228,-2.0128000),vec3(1053.2089410,288.7712405,-386.4320000),vec3(1387.9872000,271.0153253,287.9872000),vec3(1001.9736324,176.7065112,-194.4657095),vec3(1105.4865030,194.7568811,-922.1321211),vec3(1638.1400000,95.2000000,356.3000000));
bool liNativePeakInterval(vec3 ro,vec3 rd,float tmin,float tmax,out float enter,out float leave){
  vec3 direction=mix(vec3(-1.),vec3(1.),step(vec3(0.),rd));
  vec3 inverse=direction/max(abs(rd),vec3(1e-8));
  enter=1e30;leave=-1e30;
  for(int j=uZero;j<11;j++){
    vec3 ta=(LI_RAY_LO[j]-ro)*inverse,tb=(LI_RAY_HI[j]-ro)*inverse;
    vec3 near=min(ta,tb),far=max(ta,tb);
    float a=max(tmin,max(near.x,max(near.y,near.z)));
    float b=min(tmax,min(far.x,min(far.y,far.z)));
    if(b>=a){enter=min(enter,a);leave=max(leave,b);}
  }
  return leave>=enter;
}

// native-terrain-sign-root-3
// Signed zero finding is independent of the conservative distance scale.
// The LOD footprint stays fixed throughout one local bracket, so all samples
// refer to the same scene field rather than a moving LOD surface.
bool liNativeGroundRoot(vec3 ro,vec3 rd,float start,float far,float exterior,
                       float initialD,vec4 initialInf,
                       out float hitT,out vec4 hitInf,out float resumeT){
  hitT=start;hitInf=initialInf;resumeT=start;
  float pixel=max(gPix,.005);
  float treeEps=pixel*.45;
  float tolerance=clamp(pixel*.14,.012,.12);
  float probe=clamp(pixel*.27,.04,.45);
  float stepLimit=clamp(pixel*3.,.35,3.);
  float travelLimit=min(far,start+clamp(pixel*96.,18.,96.));
  float positiveT=start,positiveD=initialD;
  float previousT=start,previousD=initialD;
  float a=start,b=start,da=initialD,db=initialD;
  float sampleT=min(start+probe,travelLimit);
  int phase=0; // 0 forward secant; 1 sign bracket; 2 final metadata refresh; 3 tree refinement
  int treeSteps=0;
  // A negative entry brackets against the last *tested exterior point*, even
  // after a long sky/terrain jump. It must not search only 36 m behind a point
  // hundreds of metres inside a narrow independent peak.
  bool needExterior=initialD<=0.;
  float backtrack=max(probe,tolerance*2.);
  if(needExterior){
    if(exterior>=0.&&exterior<start)backtrack=max(backtrack,start-exterior);
    sampleT=max(0.,start-backtrack);
  }
  for(int k=uZero;k<80;k++){
    gEpsM=0.;
    vec4 info;
    float value=sceneSD(ro+rd*sampleT,info);
    if(phase==2){hitT=sampleT;hitInf=info;return true;}
    if(phase==3){
      treeSteps--;
      if(treeSteps>0){sampleT+=value*.9;continue;}
      if(info.w>.5){
        if(value<treeEps){hitT=sampleT;hitInf=info;return true;}
        resumeT=sampleT;return false;
      }
      // A tree candidate can switch back to the conservative terrain field
      // during those corrections. It then needs the same ground sign proof;
      // accepting it as a tree would reintroduce the floating cliff shelves.
      phase=0;
    }
    if(needExterior){
      if(value>0.){
        a=sampleT;da=value;b=start;db=initialD;phase=1;needExterior=false;
      }else{
        if(sampleT==0.)return false;
        backtrack*=2.;sampleT=max(0.,start-backtrack);
        continue;
      }
    }else if(phase==1){
      if(value>0.){a=sampleT;da=value;}else{b=sampleT;db=value;}
    }else{
      if(value<=0.){
        a=positiveT;da=positiveD;b=sampleT;db=value;phase=1;
      }else{
        // Tree/branch/leaf candidates keep the retained renderer's exact
        // three corrections. A sign-changing probe instead gets the bracket.
        if(info.w>.5&&value<treeEps){
          phase=3;treeSteps=3;sampleT+=value*.9;continue;
        }
        resumeT=sampleT;positiveT=sampleT;positiveD=value;
        if(sampleT>=travelLimit)return false;
        float derivative=(value-previousD)/max(sampleT-previousT,1e-5);
        // Slight overshoot obtains a sign bracket rather than asymptotically
        // accepting a tiny positive lower bound as the visible surface.
        float advance=derivative<-.00001?value/(-derivative)*1.12:probe;
        advance=clamp(advance,probe,stepLimit);
        previousT=sampleT;previousD=value;
        sampleT=min(sampleT+advance,travelLimit);
        continue;
      }
    }
    if(phase==1){
      // Safeguarded secant: retain both signs and contract even when a noise
      // derivative or a material switch makes the local field nonlinear.
      float width=b-a;
      float zero=(a*db-b*da)/min(db-da,-1e-20);
      if(width<=tolerance){
        sampleT=clamp(zero,a,b);phase=2;continue;
      }
      sampleT=clamp(zero,a+width*.2,b-width*.2);
    }
  }
  // No sign bracket / no converged crossing means no hit. The caller resumes
  // conservative travel; a finite iteration budget is never a surface.
  return false;
}

bool march(vec3 ro,vec3 rd,float tmin,float tmax,out float tHit,out vec4 inf){
  float t=tmin;
  float pk=uTan*2./uRes.y*pkDbg();
  inf=vec4(0);
  bool inEnv=false;
  int activeIter=0;
  float lastExterior=-1.;
  float peakEnter,peakLeave;
  bool peakRay=liNativePeakInterval(ro,rd,tmin,tmax,peakEnter,peakLeave);
  float lowland=rd.y<-.00000001?(60.-ro.y)/rd.y:1e30;
  for(int i=uZero;i<3000;i++){
    gIt=float(i);
    if(t>tmax){gWhy=1.;gEpsM=0.;return false;}
    vec3 p=ro+rd*t;
    float nativeGround=H(p.xz);
    float hgt=p.y-nativeGround;
    if(hgt>ENV){
      lastExterior=t;
      float advance=max((hgt-ENV)*.5,.3+t*.0015);
      if(p.y>60.){
        // A large vertical gap does not bound distance to an isolated peak.
        // Jump across certified empty sky only; inside the possible peak
        // aggregate the cheap height samples advance at most four metres.
        if(!peakRay||t>peakLeave){
          if(rd.y>=0.||lowland>tmax){gWhy=1.;gEpsM=0.;return false;}
          t=max(t+.0001,lowland);inEnv=false;continue;
        }
        if(t<peakEnter){
          t=max(t+.0001,min(peakEnter,lowland));inEnv=false;continue;
        }
        advance=min(advance,4.);
        if(lowland>t)advance=min(advance,lowland-t);
      }
      t+=advance;inEnv=false;continue;
    }
    inEnv=true;
    gPix=t*pk;gVeg=t<uVegRange;
    // Air-only height samples must not enlarge true scene-field tolerances.
    // Keep total i/gIt for budgets and diagnostics; count only active work.
    float nativeIteration=float(activeIter);activeIter++;
    gEpsM=gPix*(.6+nativeIteration*.004);
    float d=sceneSD(p,inf);
    if(d>0.)lastExterior=t;
    float eps=gPix*(.6+nativeIteration*(inf.w>3.5&&inf.w<4.5?.0015:.004));
    if(d<eps){
      // The source treatment is already correct on gentle ground. Only the
      // large conservative slope factors of cliffs require a signed root.
      float nativeMaxSlope=textureLod(uMS,(p.xz-uRect.xy)*uRect.w,0.).r;
      if(nativeMaxSlope<1.8&&nativeGround>.25&&nativeGround<35.){
        for(int k=uZero;k<3;k++){t+=d*.9;d=sceneSD(ro+rd*t,inf);}
        tHit=t;gEpsM=0.;gCarpHit=gCarpIn;return true;
      }
      if(inf.w>.5){
        // Candidate search may be generous, but an actual crown/branch/leaf
        // hit cannot grow from subpixel to 5+ pixels with march iteration.
        float treeEps=max(gPix,.005)*.45;
        if(d>=treeEps){t+=max(d*.8,treeEps*.25);continue;}
        // Preserve the original three source corrections and tree geometry.
        for(int k=uZero;k<3;k++){t+=d*.9;d=sceneSD(ro+rd*t,inf);}
        if(inf.w>.5){
          if(d<treeEps){tHit=t;gEpsM=0.;gCarpHit=gCarpIn;return true;}
          t+=max(d*.8,treeEps*.25);continue;
        }
        // Material switched to ground: no unconditional tree-path return.
      }
      float refinedT,resumeT;vec4 refinedInf;
      if(liNativeGroundRoot(ro,rd,t,tmax,lastExterior,d,inf,refinedT,refinedInf,resumeT)){
        tHit=refinedT;inf=refinedInf;gEpsM=0.;gCarpHit=gCarpIn;return true;
      }
      t=max(t+max(gPix*.18,.025),resumeT);
      continue;
    }
    t+=max(d*.8,eps*.5);
  }
  // Removed the source's "budget exhausted inside vegetation => hit" rule.
  // In particular an unproven point above a steep wall cannot become a slab.
  gWhy=3.;gEpsM=0.;return false;
}
float shadowH(vec3 p, vec3 L){
  float res=1., t=.5;
  for(int i=uZero;i<70;i++){
    vec3 q=p+L*t;
    if(q.y>uHmax) break;
    float d=q.y-H(q.xz);
    res=min(res,10.*d/t);   // (r7 forest) crisper ridge / valley-wall shadow edges (6: very soft, smeared the lit / shaded faces)
    if(res<-.2) break;
    t+=clamp(d*.5,.8,40.);
  }
  return smoothstep(-.2,1.,res);
}
// geometry shadows near (trees, bushes, rock relief), heightfield beyond
float gShStart=.06;
float gShG=1.;   // (r7 forest) the near-geometry part (crowns, bushes, rock relief) of the last shadow() call
float shadow(vec3 p, vec3 L, float range){
  float res=1., t=gShStart;
  gShG=1.;
  if(range>0.){
    float gp=gPix; gPix=max(gPix,.32);   // shadows use the cheap crown LOD
    float kP=mix(13.,10.,smoothstep(.6,1.6,gp));   // (r7 forest) crisp crown shadows close up, a little softer where the crowns are only a few px (no crawling pixel shadows)
    for(int i=uZero;i<48;i++){
      vec3 q=p+L*t;
      vec4 inf; float d=sceneSD(q,inf);
      res=min(res,kP*d/t);   // (r7 forest) crisper crown shadows (9: soft grey penumbrae flattened the canopy)
      if(res<.01){ gPix=gp; gShG=0.; return 0.; }
      t+=clamp(d,.08,3.5);
      if(t>range) break;
    }
    gPix=gp;
  }
  gShG=clamp(res,0.,1.);
  return min(res,shadowH(p+L*t,L));
}

// ---------------------------------------------------------------- ocean surface
float oLod(float L, float pix){ return log2(max(pix*2.6/(L/${OCEAN_N}.),1.)); }
// anti-tiling: cascades 1/2 are also sampled as a shifted, rescaled copy; a slow noise mask blends the two
// (variance-preserving weights), so the 137 m / 20 m tiles never repeat visibly
const vec2 OB_OFF=vec2(.373,.618); const float OB_SC=1.1736;
vec2 oBlendW(vec2 p){ float m=smoothstep(-.32,.32,fbm(p*.0042+vec2(3.1,7.7),2)); vec2 w=vec2(1.-m,m); return w*inversesqrt(dot(w,w)); }
vec2 gSCp=vec2(0);   // position for surfChop (set by the caller)
// surf zone: broken, steep short waves (bores, reflected and refracted chop) -- more short-wave energy where waves break
float surfChop(float depth, float w){ return 1.+1.1*smoothstep(7.,2.,depth)*min(1.,depth*.6)*smoothstep(0.,8.,w)*(1.-.75*smoothstep(.05,.4,VEG(gSCp).b)); }
float shoreGain(float depth, float w){ return mix(.62,1.,smoothstep(1.,12.,depth))*smoothstep(-1.,4.,w)*min(1.,.15+.5*depth); }   // the surf zone stays choppy (but troughs never bare the bed)
// smooth distance to the shore (m) for waves and surf: the traced coast SDF has polygon corners (they showed up
// as zig-zag crests and foam bands); a 7-tap blur (~11 m) rounds them, the noise is the terrain coastline's (coastD)
float coastW(vec2 p){
  // the blur radius grows with the distance from the shore: wave crests far out are smooth arcs (refraction irons out
  // the coastline's small features); a plain distance field has ridges / cusps along its medial axis (the crest
  // lines in the cove interior drew heart-shaped loops)
  float c0=coastRaw(p), r=11.+clamp(-c0-12.,0.,110.)*.5;
  float c=c0*.28+(coastRaw(p+vec2(.955,.295)*r)+coastRaw(p+vec2(.221,.975)*r)+coastRaw(p+vec2(-.734,.68)*r)
         +coastRaw(p-vec2(.955,.295)*r)+coastRaw(p-vec2(.221,.975)*r)+coastRaw(p-vec2(-.734,.68)*r))*.12;
  return -(c+5.*vnoise(p*.035+3.7)+2.2*vnoise(p*.12-1.3));
}
float gShS=1.;   // phase behind the last breaker crest (0 at the crest), set by shoal()
float gShB=0.;   // breaking intensity of the surf zone here (0 .. 1), set by shoal()
float gShFW=0.;   // (r10w) the pixel's extent along the shore distance (m), set by shadeWater around its shoal() call (0: unfiltered)
float gShBrk=0.;   // (r11w) breaking strength of the wave here (0 .. 1), set by shoal()
float gShS0=1., gShLam=38.;   // (r12w) raw phase behind the crest (never footprint-averaged) and wave length, set by shoal()
float gShCv=0.;   // (r11w) sheltered-cove weight (x URL wk19), set by shadeWater around its shoal() call: long, unbroken crest lines
// breaking waves in the shallows: returns (height, d height / d w, foam, crest)
vec4 shoal(vec2 p, float w, float depth){
  gShS=1.; gShB=0.; gShBrk=0.; gShS0=1.;
  if(w>260.||depth<=.02||depth>17.) return vec4(0);
  float lam=34.+8.*vnoise(p*.004), c=4.2;
  float warp=.35*fbm(p*.006+3.,3)+.12*vnoise(p*.03);
  float ph=(w+c*uTime)/lam+warp;
  float s=fract(ph), id=floor(ph); gShS=s; gShS0=s; gShLam=lam;
  float set=.75+.25*sin(6.2831*(uTime/70.+id*.37))+.15*vnoise(p*.01+id);
  // crests are broken into sections along the shore (each wave peaks in a few places, not one ring)
  float sect=smoothstep(-.55,.35,vnoise(p*.022+id*7.31))*.6+.4;
  sect=mix(sect,.88+.12*vnoise(p*.006+id*3.1),gShCv);   // (r11w) in the sheltered cove each wave breaks along most of its crest (the photos' parallel white lines), not in ~45 m sections (white blobs)
  // sheltered water (cove interiors: low wave exposure) gets smaller waves -- they break only close to the shore
  float shel=mix(.6,1.,smoothstep(.4,.75,ATT(p).z));
  float A0=1.5*set*(.6+.4*vnoise(p*.008-4.))*sect*shel;
  float A=A0*clamp(pow(8./max(depth,.4),.25),1.,1.7);
  float brk=smoothstep(.2,.46,A/max(depth,.05)); gShBrk=brk;   // (r4f: softer onset: no solid slab with a cut-out outline where a reef patch crosses the threshold)
  A=min(A,.48*depth+.05);
  A*=smoothstep(260.,140.,w)*smoothstep(.0,.5,w)*smoothstep(17.,8.,depth);
  float cr=.05+.08*(1.-brk);
  float k=3.4;
  float tail=exp(-.94*k);
  float shp=smoothstep(0.,cr,s)*(exp(-(s-cr)*k)-tail)/(1.-tail);
  float dsh=s<cr?(6.*s/cr*(1.-s/cr))/cr:-k*exp(-(s-cr)*k)/(1.-tail);
  float h=A*shp;
  // whitewater: thick on the face just behind the crest, a long thinning trail of residual foam behind it
  // (a dense bore right behind the crest, decaying into lace over ~1/3 of the wave length, clear water before the next)
  gShB=smoothstep(.15,.35,1.5*shel*(.6+.4*vnoise(p*.008-4.))/max(depth,.05))*smoothstep(260.,140.,w)*smoothstep(.0,.5,w)*smoothstep(17.,8.,depth);
  // (over very shallow flats the bore keeps spilling: the whitewater stays dense across most of the wave period)
  float flt=smoothstep(4.,1.8,depth)*(1.-smoothstep(.05,.4,VEG(p).b))*smoothstep(.45,.8,ATT(p).z);   // reef flats (beaches: plunging shore break) (r4f: exposed flats only -- in the sheltered cove the small waves spill in lines, no standing slabs)
  // (r13w, URL wk46) the foam band's leading edge was one smooth isoline of the shore distance (a step from nothing to full white at the
  //  crest): seen from a boat (v3) a straight horizontal seam across the mid-distance water. The foam's phase is jittered along the crest
  //  (~17 m / ~5 m) and each wave's foam breaks into sections with clear gaps (not in the sheltered cove: its long crest lines stay)
  float sF=s, secF=1.;
  if(uWK12.z>0.){ sF=fract(s+uWK12.z*(.05*vnoise(p*.06+vec2(id*2.3,uTime*.04))+.02*vnoise(p*.21+vec2(1.7,id))));
    secF=mix(1.,.25+.75*smoothstep(-.6,.2,vnoise(p*.035+id*vec2(4.1,2.9))),uWK12.z*(1.-gShCv)); }
  float foam=brk*secF*(smoothstep(0.,.12,sF)*exp(-sF*mix(6.5,2.6,flt))*mix(1.8,1.6,flt)+mix(.32,.5,flt)*smoothstep(0.,.08,sF)*exp(-sF*mix(3.6,1.8,flt))*smoothstep(9.,2.,depth));
  float lip=brk*smoothstep(.0,cr,s)*exp(-(s-cr)*14.);

// swash on beaches: after every breaker the bore runs up the sand as a thin sheet (ballistic up-rush, back-wash)
// and drains again. gh = sand height. Returns (sheet thickness, run-up height of this wave, swash phase 0..1).
vec3 swash(vec2 p, float gh){
  if(gh>1.05||gh<-.8) return vec3(0.,0.,1.);

  // (+ ~40 m phase variation: each wave runs up in lobes at slightly different times -> curved, cuspate fronts)
  float warp=.35*fbm(p*.006+3.,3)+.12*vnoise(p*.03)+.05*vnoise(p*.11)+.2*vnoise(p*.024+7.7);

// ocean height at p (horizontal displacement ignored for the intersection)
// Native calm river: one code-defined spectrum for height and analytic slope.
// All amplitudes are metres. Small-scale slopes fade before becoming subpixel.
// No FFT ocean, shoaling, breakers, foam, beach swash or external normal map.
uniform float uLiWaveSpeed;
float liRiverFootprint(float rayDistance, vec3 rd) {
  // Project a screen pixel onto the water plane. A circular footprint leaves
  // near-horizontal views undersampled, especially in reflected bright sky.
  return max(.001,rayDistance*uTan*2./uRes.y)/max(-rd.y,.02);

vec3 liRiverSample(vec2 p, float footprint) {
  // Above the longest wave's exact filter cutoff every contribution is zero.
  if (footprint>=.48*19.) return vec3(0.);
  const float L[12] = float[12](19.,13.,8.,5.8,3.4,2.2,1.5,.9,.5,.28,.14,.07);
  const float A[12] = float[12](.008,.005,.0035,.003,.0022,.0016,.0012,.0007,.00045,.00025,.00014,.00007);
  vec3 sampleValue = vec3(0.);
  for (int i=uZero; i<12; i++) {
    float waveFilter=1.-smoothstep(.18,.48,max(footprint,.0001)/L[i]);
    if (waveFilter<=0.) continue;
    float fi=float(i);
    // Long waves retain the wind direction. Short waves cross one another
    // rather than forming an almost parallel, visibly artificial grating.
    float angle=i<3?.31+sin(fi*2.17+.8)*.84:.31+(fi-3.)*2.39996323;
    vec2 axis=vec2(sin(angle),cos(angle));
    float k=6.28318530718/L[i];
    float omega=sqrt((9.81*k+.000074*k*k*k)*tanh(k*3.5));
    float amplitude=A[i]*waveFilter*clamp(uOAmp,0.,2.)*.75;
    float phase=dot(p,axis)*k-omega*uTime*uLiWaveSpeed+fi*2.39996323;
    sampleValue.x+=amplitude*sin(phase);
    sampleValue.yz+=amplitude*k*cos(phase)*axis;
  }
  return sampleValue;
}

float oceanH(vec2 p, float pix, out vec4 sh) {
  sh=vec4(0.);
  return liRiverSample(p,pix).x;
}
float oceanH(vec2 p, float pix){ vec4 sh; return oceanH(p,pix,sh); }
bool waterHit(vec3 ro, vec3 rd, float tmax, out float tw) {
  // Above-river cameras: solve against exactly liRiverSample, not a flat plane
  // with unrelated normal noise. This conservative slab exceeds 2x sum(A).
  if (rd.y>=-.000001) return false;
  const float bound=.065;
  float lo=max(0.,(ro.y-bound)/-rd.y);
  float hi=min(tmax,(ro.y+bound)/-rd.y);
  if (lo>hi) return false;
  vec3 last=ro+rd*hi;
  if (last.y-liRiverSample(last.xz,liRiverFootprint(hi,rd)).x>0.) return false;
  float t=clamp(ro.y/-rd.y,lo,hi);
  for (int i=uZero;i<12;i++) {
    vec3 p=ro+rd*t;
    vec3 wave=liRiverSample(p.xz,liRiverFootprint(t,rd));
    float f=p.y-wave.x;
    if (abs(f)<.00015) { tw=t; return t<=tmax; }
    if (f>0.) lo=t; else hi=t;
    float derivative=rd.y-dot(wave.yz,rd.xz);
    float candidate=abs(derivative)>.000001?t-f/derivative:.5*(lo+hi);
    t=(candidate>lo&&candidate<hi)?candidate:.5*(lo+hi);
  }
  tw=.5*(lo+hi);
  return tw>=0.&&tw<=tmax;
}

// ---------------------------------------------------------------- foam texture
// Surf foam = the super-level set {S > th} of a fixed "foam potential" field S, with the threshold th chosen
// from the foam density D so that the mean coverage is exactly C(D) (th = inverse CDF of S, measured once with
// dbgm=42: FOAM_TH). S is built from
//  * A: a warped Voronoi network (~0.9 m cells, stretched along the flow): -distance to its walls, the open
//       water of each cell rounded into a blob; wall width varies along the walls (thick and thin stretches);
//  * B: a finer network (~0.28 m): threads around / holes inside the A walls (old foam: more and bigger holes);
//  * G: bubble-cluster fluff (~10 cm, ~3.5 cm): ragged, bubbly edges;
//  * M: ~15 m patches drawn out along the flow: the foam gathers into swirls and bands, clear veins between.
// Low D: only the highest ridges of S survive -> broken threads and flecks; mid D: a lace of walls; high D: a
// sheet with rounded holes. Edges are anti-aliased exactly (edge width = change of S across the pixel footprint,
// the anisotropic ellipse of grazing views included); octaves below the footprint are replaced by their mean and
// their variance widens the edge, so a fully unresolved pattern returns C(D) itself.
// Returns coverage; fo = (thickness 0..1, foam surface slope xz, brightness).
vec4 gFoamDbg=vec4(0);
// x: distance to the nearest Voronoi wall (2nd pass around the nearest site), yz: its gradient,
// w: distance to the nearest site; dir: unit vector from the site to x; id: cell hash
vec4 vorWall(vec2 x, out vec2 dir, out float id){
  vec2 n=floor(x), f=fract(x), mr=vec2(0), mg=vec2(0); float md=8.;
  for(int j=uZero-1;j<=1;j++) for(int i=uZero-1;i<=1;i++){ vec2 g=vec2(i,j), r=g+hash22(n+g)-f; float d=dot(r,r); if(d<md){ md=d; mr=r; mg=g; } }
  float ed=8.; vec2 eg=vec2(0,1);
  int R=uMG.y>.5?2:1;   // (r10m) URL mg1 = 1: the wall pass searches 5x5 cells around the nearest site (the standard border-distance search; 3x3 can miss
  //  the nearest wall when the jitter is full, a jump along a straight Voronoi edge: the v4 foam seam the water round named)
  for(int j=uZero-R;j<=R;j++) for(int i=uZero-R;i<=R;i++){ vec2 g=mg+vec2(i,j), r=g+hash22(n+g)-f, dr=r-mr;
    if(dot(dr,dr)>1e-5){ vec2 nn=normalize(dr); float e=dot(.5*(mr+r),nn); if(e<ed){ ed=e; eg=-nn; } } }
  id=hash12(n+mg+17.); dir=-mr/max(sqrt(md),1e-4);
  return vec4(ed,eg,sqrt(md));
}
// soft cell interior: min(wall distance, rr - site distance), smoothly -> rounded blobs; returns (value, gradient)
vec3 cellIn(vec4 v, vec2 dir, float rr, float k){
  float a=v.x, b=rr-v.w; vec2 gb=-dir;
  if(b<0.){ b=0.; gb=vec2(0); }                              // junctions beyond rr: foam nodes, never deeper
  // (r10w) continuous across the walls: rr is per cell, so where the blob term b came within k of a wall the two cells met with
  //  different values -- a jump of S along the straight Voronoi wall (the hard straight foam edges near the camera, e.g. the
  //  v4 seam at x ~1040). Over the last .04 before the wall b fades to 0, the value of a foam node (the smooth min is then
  //  -k/4 at the wall from both sides). Target 0, not a + k: most lace walls run between small blobs (b <= 0 there), and a + k
  //  took their thick cores away (v4 lost most of its lace). The hole shapes are unchanged away from the walls; walls between
  //  two big holes get ~.03 cell thicker. URL wk11 (1; 0 = r9f).
  float wtW=mix(1.,smoothstep(0.,.04,a),uWK3.w); b*=wtW; gb*=wtW;
  float h=clamp(.5+.5*(b-a)/k,0.,1.);

// threshold of S for coverage C = 0, 1/8, .. 1 (measured with dbgm=42), for age 0 / .5 / 1
const float FOAM_TH[27]=float[27](
  .13,.060,.018,-.007,-.032,-.061,-.101,-.170,-.756,
  .13,.054,.017,-.005,-.026,-.048,-.091,-.158,-.756,
  .13,.05,.012,-.007,-.026,-.045,-.087,-.15,-.755);
float foamTh(float C, float age){
  float x=clamp(C,0.,1.)*8., ia=clamp(age,0.,1.)*2.;
  int i=min(int(x),7), j=min(int(ia),1); float fx=x-float(i), fa=ia-float(j);
  float t0=mix(FOAM_TH[j*9+i],FOAM_TH[j*9+i+1],fx), t1=mix(FOAM_TH[j*9+9+i],FOAM_TH[j*9+10+i],fx);

float gFoamSA=0., gFoamS=0.;   // A component, full foam potential (calibration)
float gFoamSm=0.;   // mean of S (all unresolved components), set by foamS

float gFoamAK=0.;   // its edge width over one pixel

// thresholds of the large-scale part only (patches + lines), measured with dbgm=45
const float FOAM_THK[27]=float[27](
  .14,.065,.015,-.017,-.049,-.084,-.118,-.176,-.75,
  .14,.064,.015,-.016,-.048,-.083,-.118,-.177,-.75,
  .14,.063,.013,-.018,-.049,-.085,-.124,-.18,-.75);
float foamThK(float C, float age){
  float x=clamp(C,0.,1.)*8., ia=clamp(age,0.,1.)*2.;
  int i=min(int(x),7), j=min(int(ia),1); float fx=x-float(i), fa=ia-float(j);
  float t0=mix(FOAM_THK[j*9+i],FOAM_THK[j*9+i+1],fx), t1=mix(FOAM_THK[j*9+9+i],FOAM_THK[j*9+10+i],fx);

float foamS(vec2 p, vec2 gx, vec2 gy, float age, vec2 fd, out vec2 gS, out vec4 aux){

  // M: patches / bands

  float S=kM*m.x*fM*lw; vec2 g=kM*m.yz*vec2(.12,.08)*fM*lw;

  // network, each cell's open water a rounded blob -- sparse foam = arcs and filaments, dense whitewater = white

  // the shore (gFoamU), so the lace around rocks is drawn out into concentric arcs.
  const float cK=4.5;

  gFoamAK=sqrt(.002*.002+pow(.7*length(vec2(dot(gAK,fa),dot(gAK,fb))),2.)+kH*kH*.25*(1.-fH*fH)+kK*kK*.36*(1.-fK*fK));
  // A: walls; their width varies along them (S scaled by 1/vA)

    float lob=vnoise(dr*1.7+id*31.)*.55+vnoise(dr*3.9+id*17.)*.25;
    vec3 e=cellIn(v,dr,(.22+.42*id*id)*(1.+lob),.12);       // hole sizes: many small, a few large
    // shallow cells fill up first as the foam thickens: dense whitewater keeps only some (irregular) holes
    float cap=.035+.5*pow(fract(id*7.31),2.);
    float hc=clamp(.5+.5*(cap-e.x)/.04,0.,1.); e.x=mix(cap,e.x,hc)-.04*hc*(1.-hc); e.yz*=hc;
    float an=mix(2.3,1.,abs(dr.y));                           // walls across the flow are thinner: lace drawn out into streaks
    // (r10w) ... but dr belongs to this cell's site: on a wall the two cells used different an, and the wall core (e.x -k/4,
    //  equal from both sides) was scaled x1 on one side and up to x2.3 on the other -- a straight step of S along the wall,
    //  the v4 seam (x ~1042, y 845-870). Within .12 of the wall an fades to the shared 1.65.
    an=mix(an,mix(1.65,an,smoothstep(0.,.12,v.x)),uWK3.w);
    // (r9w: by the site-to-point direction dr, continuous inside the cell; the nearest wall's normal v.z switched on the
    //  bisector lines between two walls, a jump of S up to x2.3 -- the hard straight foam edges near the camera, e.g. v4 x~1038)

  float mB=.012;                                              // measured mean (dbgm=43)
  if(fB>0.){
    vec2 dr; float id; vec4 v=vorWall(af/cB+vec2(5.1,2.3),dr,id);
    float lobB=vnoise(dr*2.1+id*23.)*.5;

    float sb=kB*(wB-e.x*cB); sb=sb<0.?sb*hB:sb*.6;
    S+=mix(mB,sb,fB); g+=-kB*e.yz*fB*(sb<0.?hB:.6); gFoamDbg.y=sb;
  } else S+=mB;

  float kG=mix(.05,.035,age);
  S+=(g1.x*fG1+g2.x*.55*fG2)*kG; g+=(g1.yz*10.*fG1+g2.yz*28.*.55*fG2)*kG;
  var+=kG*kG*.2*((1.-fG1*fG1)+.3*(1.-fG2*fG2));

  float aa=length(vec2(dot(g,fa),dot(g,fb)));

  // (r8f) + a fringe of ~6 cm in world units: up close a foam edge is a gradient of thinning bubbles, not a 1-px cut-out
  //  (the cel-shaded flakes of the boat views); from ~40 m on the pixel footprint dominates again, the aerial views do not change
  aux=vec4(sqrt(.002*.002+pow(.7*aa,2.)+var*.25+pow(length(gS)*.06,2.)),fA,fK,pa);   // unresolved variance widens the edge only a little: crisp foam (small coverage bias)

float foamTex(vec2 p, vec2 gx, vec2 gy, float D, float age, vec2 fd, out vec4 fo){
