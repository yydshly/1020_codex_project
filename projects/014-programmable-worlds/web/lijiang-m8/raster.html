<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9bcc2;color:#edf2e9;font:13px/1.5 system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}button,input{font:inherit}button{border:1px solid #ffffff32;border-radius:20px;padding:7px 13px;background:#172d2bdb;color:inherit;cursor:pointer}button:disabled{opacity:.4}#toolbar{position:absolute;left:24px;right:24px;top:22px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;text-shadow:0 1px 8px #001b1e}#toolbar strong{font-size:17px;letter-spacing:.15em;margin-right:auto}#bottom{position:absolute;bottom:20px;left:24px;right:24px;padding:13px 16px;border-radius:12px;background:#122c29bb;display:flex;gap:14px;align-items:center}#seek{flex:1;accent-color:#e0d7ad}#load{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#162e31f0}#load span{opacity:.65;max-width:38em;margin-top:15px}#status{font-variant-numeric:tabular-nums}#settings{position:absolute;right:24px;top:75px;padding:18px;background:#17322fdc;border:1px solid #ffffff25;border-radius:12px;width:260px;max-height:calc(100vh - 200px);overflow:auto}#settings label{display:flex;justify-content:space-between;gap:12px;margin:12px 0}#settings input{width:120px;accent-color:#e0d7ad}body.clean .ui{display:none!important}#generator{position:absolute;width:1px;height:1px;left:-10px;top:-10px;border:0;visibility:hidden}@media(max-width:600px){#toolbar{left:16px;right:16px;top:14px;gap:6px}#toolbar strong{font-size:15px}#toolbar button{padding:7px 10px;white-space:nowrap}#bottom{display:grid;grid-template-columns:auto auto minmax(0,1fr);left:12px;right:12px;bottom:12px;gap:8px;padding:10px 12px}#play,#replay{white-space:nowrap;padding:7px 10px;grid-row:1}#seek{grid-column:1/-1;grid-row:2;width:100%;min-width:0;margin:4px 0}#time{grid-column:3;grid-row:1;justify-self:end;white-space:nowrap;font-size:12px}#settings{right:12px;top:112px;max-height:calc(100vh - 240px)}}
</style></head>
<body><canvas id="scene"></canvas><div id="toolbar" class="ui"><strong>漓江晨航</strong><span id="status">生成场景</span><button id="mode" disabled>自由驾驶 C</button><button id="settings-button" disabled>画面参数</button><button id="hide" disabled>净画面 H</button></div><div id="bottom" class="ui"><button id="play" disabled>播放航拍</button><button id="replay" disabled>重新起飞 R</button><input id="seek" type="range" min="0" max="45" step="0.01" value="0" disabled><output id="time">00.0 / 45.0</output></div><div id="settings" class="ui" hidden><label>太阳高度<input id="sun" type="range" min="2" max="60" step="0.5" value="14"></label><label>晨雾浓度<input id="fog" type="range" min="0" max="0.0008" step="0.00001" value="0.00022"></label><label>曝光<input id="exposure" type="range" min="0.5" max="1.8" step="0.01" value="1.05"></label><label>波纹强度<input id="waves" type="range" min="0" max="2" step="0.05" value="0.85"></label><label>波纹速度<input id="wave-speed" type="range" min="0" max="2" step="0.05" value="1"></label><label>倒影强度<input id="reflection" type="range" min="0.2" max="1" step="0.01" value="0.95"></label><label>雾带高度<input id="mist-height" type="range" min="15" max="140" step="1" value="70"></label><label>雾带浓度<input id="mist-density" type="range" min="0" max="4" step="0.1" value="2.3"></label></div><div id="load"><strong id="load-title">正在生成峰林、河道与生态</strong><span id="load-detail">首次进入会现场生成峰林与草木，通常需要一至三分钟。完成后即可沿江航拍或自由观察。</span></div><script type="module" src="./raster-main.js?v=20261026-m8"></script></body></html>
