<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a24">
  <title>Na Pali · 原作完整实时海岸</title>
  <link rel="stylesheet" href="source-live.css">
  <script src="source-live.js?v=20261024-inpage4-input" defer></script>
</head>
<body>
<main id="source-player" aria-label="Na Pali 原作完整实时海岸">
  <div id="source-viewport" tabindex="0" aria-label="实时海岸；自由驾驶时拖动观察，WASD 移动，Q/E 升降">
    <video id="source-video" autoplay playsinline muted aria-label="原库当前实时渲染画面"></video>
  </div>
  <header class="source-top"><div><strong>Na Pali <span>原作完整实时场景</span></strong><p>Leon Lin · 原始地形、海浪、植被与天空</p></div><a href="https://github.com/Leonxlnx/napali" target="_blank" rel="noopener">源库 GitHub ↗</a></header>
  <section id="source-loading" class="source-loading" aria-live="polite">
    <span class="loading-mark" aria-hidden="true"></span>
    <p class="loading-label">ENTERING NA PALI</p>
    <h1>海岸正在生成。</h1>
    <p id="source-progress">连接原作实时场景…</p>
    <p id="source-loading-detail">首次需要生成完整地形与侵蚀、植被和海面。</p>
    <button id="source-retry" type="button" hidden>重新连接</button>
  </section>
  <button id="source-play-video" type="button" hidden>播放实时画面</button>
  <nav class="source-controls" aria-label="原作海岸控制">
    <div class="source-timeline"><input id="source-time" type="range" min="0" max="132" step=".1" value="0" aria-label="原作航线时间" disabled><output id="source-clock" for="source-time">0.0 / 132 秒</output></div>
    <div class="control-row">
      <button id="source-pause" type="button" disabled>暂停</button><button id="source-restart" type="button" disabled>重新起飞</button>
      <label>机位<select id="source-shot" disabled><option value="0">海面接近</option><option value="35">海岬</option><option value="55">沙滩</option><option value="75">山谷</option><option value="128">高空俯瞰</option></select></label>
      <button id="source-free" type="button" aria-pressed="false" disabled>自由驾驶</button>
      <label>画质<select id="source-quality" disabled><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select></label>
      <button id="source-fullscreen" type="button">全屏 ↗</button>
      <span id="source-status" role="status">等待实时画面</span>
    </div>
    <p id="source-help">播放原作航线，或进入自由驾驶。拖动观察 · WASD 移动 · Q/E 升降 · Shift 加速 · 空格暂停</p>
    <div class="source-touch" aria-label="触屏驾驶"><button type="button" data-move="w" aria-label="前进">前进</button><button type="button" data-move="s" aria-label="后退">后退</button><button type="button" data-move="e" aria-label="上升">上升</button><button type="button" data-move="q" aria-label="下降">下降</button></div>
  </nav>
</main>
</body>
</html>
