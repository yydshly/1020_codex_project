<header class="map-toolbar" id="map-toolbar">
  <div class="map-title"><h1>一张图看懂 · 可编程世界</h1><p>源库效果与原理 → 三处探索 → 三种扩展 → 技术路线 → 下次控制经验 → 价值边界</p></div>

<main class="map-viewer" id="map-viewer" tabindex="0" aria-label="完整总览图，可缩放和滚动阅读"><div class="map-paper"><img id="project-map" src="assets/reading/programmable-worlds-map-20261026.webp" width="1800" height="7280" alt="可编程世界完整信息总览图，含7张效果图和8部分：源库原理、三处实际探索、三种待开发参考、六类扩展、技术路线、受约束制作、下次任务单及价值与证据边界。已实现、待开发、未验证分别标注。"></div></main>

<script>
(()=>{'use strict';const image=document.getElementById('project-map'),viewer=document.getElementById('map-viewer'),slider=document.getElementById('map-zoom'),output=document.getElementById('map-value');let zoom=60;
function setZoom(value){const old=zoom;zoom=Math.max(10,Math.min(140,Math.round(Number(value)/5)*5));slider.value=String(zoom);output.value=zoom+'%';output.textContent=zoom+'%';image.style.width=1800*zoom/100+'px';if(old)viewer.scrollTop*=zoom/old;return getState();}
function fit(){const css=getComputedStyle(viewer),available=viewer.clientWidth-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight);return setZoom(Math.floor(available/1800*100/5)*5);}
function jump(y){viewer.scrollTo({top:Number(y)*zoom/100,behavior:'instant'});return getState();}
function getState(){return{zoom,width:image.width,height:image.height,scrollTop:viewer.scrollTop,viewportWidth:viewer.clientWidth};}
slider.addEventListener('input',()=>setZoom(slider.value));document.getElementById('map-minus').addEventListener('click',()=>setZoom(zoom-10));document.getElementById('map-plus').addEventListener('click',()=>setZoom(zoom+10));document.getElementById('map-fit').addEventListener('click',fit);document.getElementById('map-actual').addEventListener('click',()=>setZoom(100));document.getElementById('map-section').addEventListener('change',e=>jump(e.target.value));window.projectMap=Object.freeze({getState,setZoom,jump,fit});image.addEventListener('load',fit,{once:true});fit();})();
</script>
