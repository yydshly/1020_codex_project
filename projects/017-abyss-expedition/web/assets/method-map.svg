<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title desc"><title id="title">深蓝航迹：从源库方法到完整作品的技术迁移图</title><desc id="desc">六阶段流程包含动作、产物、通过条件和个人价值；区分源库事实、独立抽象和模拟内容。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#65b8aa"/></marker></defs><rect width="1600" height="1440" fill="#06141e"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="60" y="62" fill="#7fe6d0" font-size="17" letter-spacing="4">017 / ABYSS — METHOD TRANSFER</text><text x="60" y="126" fill="#edf4f5" font-size="43">理解源码原理，做出自己的完整作品</text><text x="60" y="174" fill="#9bb6c0" font-size="22">参考：江山时序 · 固定版本 53059f1c7fed　｜　新主题：深海科考交互档案</text><rect x="60" y="215" width="1470" height="66" rx="5" fill="#12303b"/><text x="82" y="254" fill="#d4e6e9" font-size="20">用户主线：进入海底 → 旋转探索 → 搜索 / 选站 → 时间回放 → 收集样本 → 报告导出 → 切换航次</text><g transform="translate(60,320)"><rect width="450" height="350" rx="7" fill="#0b202c" stroke="#294b59"/><text x="23" y="36" fill="#ffd482" font-size="17">01 / 源库观察</text><text x="23" y="79" fill="#edf4f5" font-size="23">看见效果，找到源码证据</text><text x="23" y="129" fill="#7fe6d0" font-size="18">动作</text><text x="78" y="129" fill="#aac2cb" font-size="17">从时间、地点、事件的联动追踪调用。</text><text x="23" y="185" fill="#7fe6d0" font-size="18">产物</text><text x="78" y="185" fill="#aac2cb" font-size="17">固定版本链接 + 六个机制映射。</text><text x="23" y="241" fill="#7fe6d0" font-size="18">通过</text><text x="78" y="241" fill="#aac2cb" font-size="17">事实能落到函数，推断单独标明。</text><text x="23" y="297" fill="#7fe6d0" font-size="18">价值</text><text x="78" y="297" fill="#aac2cb" font-size="17">将视觉诉求翻译成可实现的问题。</text></g><g transform="translate(570,320)"><rect width="450" height="350" rx="7" fill="#0b202c" stroke="#294b59"/><text x="23" y="36" fill="#ffd482" font-size="17">02 / 不变量与数据契约</text><text x="23" y="79" fill="#edf4f5" font-size="23">先定义规则，再拆分模块</text><text x="23" y="129" fill="#7fe6d0" font-size="18">动作</text><text x="78" y="129" fill="#aac2cb" font-size="17">明确阶段边界、实体 ID、事件顺序。</text><text x="23" y="185" fill="#7fe6d0" font-size="18">产物</text><text x="78" y="185" fill="#aac2cb" font-size="17">独立时序、查询、插值与请求保护。</text><text x="23" y="241" fill="#7fe6d0" font-size="18">通过</text><text x="78" y="241" fill="#aac2cb" font-size="17">坏输入不污染状态；过期结果不提交。</text><text x="23" y="297" fill="#7fe6d0" font-size="18">价值</text><text x="78" y="297" fill="#aac2cb" font-size="17">以后换主题，核心规则可以继续使用。</text></g><g transform="translate(1080,320)"><rect width="450" height="350" rx="7" fill="#0b202c" stroke="#294b59"/><text x="23" y="36" fill="#ffd482" font-size="17">03 / 业务模型与场景适配</text><text x="23" y="79" fill="#edf4f5" font-size="23">为新主题建立真实可操作界面</text><text x="23" y="129" fill="#7fe6d0" font-size="18">动作</text><text x="78" y="129" fill="#aac2cb" font-size="17">建立任务、站点、观测与样本模型。</text><text x="23" y="185" fill="#7fe6d0" font-size="18">产物</text><text x="78" y="185" fill="#aac2cb" font-size="17">Three.js 海底 + 时间轴 + 观测详情。</text><text x="23" y="241" fill="#7fe6d0" font-size="18">通过</text><text x="78" y="241" fill="#aac2cb" font-size="17">点击、搜索、回放最终响应同一状态。</text><text x="23" y="297" fill="#7fe6d0" font-size="18">价值</text><text x="78" y="297" fill="#aac2cb" font-size="17">学会把领域叙事接到技术能力上。</text></g><g transform="translate(60,775)"><rect width="450" height="350" rx="7" fill="#0b202c" stroke="#294b59"/><text x="23" y="36" fill="#ffd482" font-size="17">04 / 用户流程闭环</text><text x="23" y="79" fill="#edf4f5" font-size="23">让完整任务从头走到尾</text><text x="23" y="129" fill="#7fe6d0" font-size="18">动作</text><text x="78" y="129" fill="#aac2cb" font-size="17">探索、回放、采样，再导出报告。</text><text x="23" y="185" fill="#7fe6d0" font-size="18">产物</text><text x="78" y="185" fill="#aac2cb" font-size="17">完整交互作品与必要的操作介绍。</text><text x="23" y="241" fill="#7fe6d0" font-size="18">通过</text><text x="78" y="241" fill="#aac2cb" font-size="17">能完成样本任务，重复操作无歧义。</text><text x="23" y="297" fill="#7fe6d0" font-size="18">价值</text><text x="78" y="297" fill="#aac2cb" font-size="17">用实际体验验收，避免止步于外观。</text></g><g transform="translate(570,775)"><rect width="450" height="350" rx="7" fill="#0b202c" stroke="#294b59"/><text x="23" y="36" fill="#ffd482" font-size="17">05 / 迁移证据</text><text x="23" y="79" fill="#edf4f5" font-size="23">换数据，检验是否真的复用</text><text x="23" y="129" fill="#7fe6d0" font-size="18">动作</text><text x="78" y="129" fill="#aac2cb" font-size="17">热液 / 峡谷航次共用核心与界面。</text><text x="23" y="185" fill="#7fe6d0" font-size="18">产物</text><text x="78" y="185" fill="#aac2cb" font-size="17">两条不同叙事 + 非海洋测试夹具。</text><text x="23" y="241" fill="#7fe6d0" font-size="18">通过</text><text x="78" y="241" fill="#aac2cb" font-size="17">第二份数据不复制核心选择逻辑。</text><text x="23" y="297" fill="#7fe6d0" font-size="18">价值</text><text x="78" y="297" fill="#aac2cb" font-size="17">找出共性，也识别必须另写的业务。</text></g><g transform="translate(1080,775)"><rect width="450" height="350" rx="7" fill="#0b202c" stroke="#294b59"/><text x="23" y="36" fill="#ffd482" font-size="17">06 / 技术沉淀与扩展</text><text x="23" y="79" fill="#edf4f5" font-size="23">留下可接入、可检查的资产</text><text x="23" y="129" fill="#7fe6d0" font-size="18">动作</text><text x="78" y="129" fill="#aac2cb" font-size="17">核对浏览器、模块测试和来源边界。</text><text x="23" y="185" fill="#7fe6d0" font-size="18">产物</text><text x="78" y="185" fill="#aac2cb" font-size="17">模块接口、测试、运行说明和证据。</text><text x="23" y="241" fill="#7fe6d0" font-size="18">通过</text><text x="78" y="241" fill="#aac2cb" font-size="17">他人能运行、能理解、能换数据。</text><text x="23" y="297" fill="#7fe6d0" font-size="18">价值</text><text x="78" y="297" fill="#aac2cb" font-size="17">后续项目从已有能力开始持续积累。</text></g><g stroke="#65b8aa" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M515 495 H558"/><path d="M1025 495 H1068"/><path d="M1305 680 V717 H285 V762"/><path d="M515 950 H558"/><path d="M1025 950 H1068"/></g><text x="667" y="744" fill="#7ca3af" font-size="17">实现与验证衔接；验收未通过时回到对应数据、模块或视图修正</text><rect x="60" y="1170" width="1470" height="196" rx="5" fill="#102631"/><text x="84" y="1207" fill="#ffd482" font-size="22">事实与边界必须一同保留</text><text x="84" y="1244" fill="#b1c8d0" font-size="18">来源事实：源库提供时序、实体查询、图层与联动思路；它是单体控制器，不是本作品的模块框架。</text><text x="84" y="1277" fill="#b1c8d0" font-size="18">直接复用：015 自行提炼的时序核心；第三方 Three.js。新增：海底场景、航次模型、查询与插值模块、界面。</text><text x="84" y="1310" fill="#b1c8d0" font-size="18">模拟边界：程序地形、虚构站点与教学遥测。科普来源另列；不是实测海域、数字孪生或设备操控软件。</text><text x="84" y="1343" fill="#b1c8d0" font-size="18">证据状态：此图展示实现方法与验收标准。通过情况、截图和未覆盖项，以实际验收记录为准。</text><text x="60" y="1408" fill="#6b909f" font-size="16">深蓝航迹 / 技术迁移研究　·　2026-10-24　·　SVG 可缩放与下载</text></g></svg>
