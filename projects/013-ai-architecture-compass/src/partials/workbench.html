<section id="workbench" class="section">
  <div class="section-heading"><div><p class="eyebrow">05 / MAKE THE NEXT CHANGE CONCRETE</p><h2>为下一次实现，<span class="keep-phrase">写一张约束卡。</span></h2></div><span class="section-aside">填写目标 → 明确边界 → 带走任务</span></div>
  <p class="intro">选好架构后，把一次具体改动交代清楚。下面六项能帮助 AI 定位规则、实现和验证，也帮助你审查交付结果。填写数量只提示信息是否齐全。</p>
  <div class="task-workbench">
    <div class="task-form">
      <label class="project-name" for="task-project">项目或本次任务名称<input id="task-project" maxlength="80" placeholder="例如：给笔记增加 AI 润色"></label>
      <div class="task-example"><button id="load-task-example" class="button secondary">用润色案例填充</button><small>点击会替换下方表单内容</small></div>
      <label for="task-goal"><span><b>01</b>目标与可观察的验收</span><textarea id="task-goal" data-task-field="goal" rows="3" maxlength="2500" placeholder="用户完成什么任务？什么行为算成功？本轮做多大范围？"></textarea></label>
      <label for="task-invariants"><span><b>02</b>必须始终成立的业务规则</span><textarea id="task-invariants" data-task-field="invariants" rows="3" maxlength="2500" placeholder="例如 INV-01：生成建议不会修改正式正文。每行一条。"></textarea></label>
      <label for="task-boundary"><span><b>03</b>规则所有者、入口与依赖</span><textarea id="task-boundary" data-task-field="boundary" rows="3" maxlength="2500" placeholder="谁维护规则、谁能写数据？通过什么入口？外部技术留在哪里？"></textarea></label>
      <label for="task-failures"><span><b>04</b>失败、并发与恢复场景</span><textarea id="task-failures" data-task-field="failures" rows="3" maxlength="2500" placeholder="哪些超时、竞争、中断或重试场景会打破规则？"></textarea></label>
      <label for="task-evidence"><span><b>05</b>计划执行的验证与证据</span><textarea id="task-evidence" data-task-field="evidence" rows="3" maxlength="2500" placeholder="规则 ID → 场景 → 实际命令或操作 → 将保留什么证据。尚不清楚的命令明确待核实。"></textarea></label>
      <label for="task-revisit"><span><b>06</b>重新评估架构的条件</span><textarea id="task-revisit" data-task-field="revisit" rows="3" maxlength="2500" placeholder="出现怎样的改动扩散、重复规则或运行压力，需要调整边界？"></textarea></label>
    </div>
    <div class="task-output"><div class="task-output-inner"><p class="eyebrow">IMPLEMENTATION BRIEF</p><h3>交给 AI 的实现草案</h3><p id="task-progress" class="task-progress" role="status">已填写 0 / 6 项</p><p id="task-missing" class="caption"></p><label for="task-preview" class="preview-label">完整 Markdown 预览</label><textarea id="task-preview" readonly rows="22" spellcheck="false" aria-describedby="task-draft-note"></textarea><p id="task-draft-note" class="caption">内容只在当前页面中处理，刷新后不会保留；离开前可复制或下载。实际检查结果需要在实现后记录。</p><div class="result-actions"><button class="button primary" id="copy-task">复制任务草案</button><button class="button secondary" id="download-task">下载任务卡 ↓</button></div><p id="task-status" class="status" role="status"></p><a class="text-link" href="templates/review-record.md" download>实现完成后，用交付审查记录收集证据 ↓</a></div></div>
  </div>
</section>
