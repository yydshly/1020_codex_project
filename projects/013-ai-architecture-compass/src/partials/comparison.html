<details class="comparison" id="compare">
  <summary><span><small>COMPARE / 放在同一组问题里看</small><strong>这些架构，怎样区分与组合？</strong></span><span class="comparison-action">展开对比 ＋</span></summary>
  <div class="comparison-body">
    <p class="caption">选择最多 3 种方法。相近思想可以择一表达，不同层次可以组合；每一项都要回答自己的采用理由。</p>
    <div class="compare-presets" role="group" aria-label="架构对比预设"><button data-compare-set="hexagonal,clean,onion">隔离核心的三种表达</button><button data-compare-set="event,cqrs,sourcing">事件、读写与状态</button><button data-compare-set="ddd,hexagonal,modular">一组互补组合</button><button data-compare-set="">清空对比</button></div>
    <fieldset class="compare-choices"><legend>选择需要对比的方法</legend>@@COMPARE_CHOICES@@</fieldset>
    <p id="compare-status" class="status" role="status">尚未选择方法。</p>
    <div id="comparison-result" class="comparison-scroll" tabindex="0" role="region" aria-label="架构并排对比结果"></div>
    <p class="caption">窄屏可在表格内横向滚动。取消任意已选项后可以继续选择。</p>
  </div>
</details>
