  <style>

;background:#171c19}.media .credit{position:absolute;left:14px;top:13px;padding:6px 9px;border-radius:4px;background:rgba(252,253,249,.9);font-size:10px;color:#405044;pointer-events:none}.launch{position:absolute;inset:auto 0 0;padding:55px 20px 18px;background:linear-gradient(transparent,rgba(22,36,27,.75));display:flex;justify-content:space-between;align-items:center;gap:16px}.play{border:0;border-radius:7px;background:#fff;color:#233a2b;padding:12px 18px;font-size:13px;font-weight:650;box-shadow:0 2px 8px #14271822}.play::before{content:"▶";font-size:10px;margin-right:9px}.launch span{font-size:11px;color:#f3f7ee;max-width:220px;line-height:1.6;text-align:right}.details{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:3px 0}.tag{display:inline-block;border:1px solid #becdb9;color:#50664a;background:#e5ecde;border-radius:4px;font-size:10px;letter-spacing:.2px;padding:5px 8px}.details h2{font-size:23px;line-height:1.25;margin:13px 0 6px;font-weight:650;letter-spacing:-.5px}.author{color:var(--muted);font-size:11px;margin:0}.desc{font-size:13px;line-height:1.75;margin:15px 0 14px}.facts{margin:0;width:100%;font-size:11px;line-height:1.65}.facts div{display:grid;grid-template-columns:44px 1fr;gap:9px;border-top:1px solid var(--line);padding:8px 0}.facts dt{color:#798377}.facts dd{margin:0;color:#425344}.caution{margin:12px 0 0;border-left:3px solid #b3bfa0;padding:0 0 0 10px;font-size:11px;line-height:1.7;color:#68715f}.links{margin-top:auto;padding-top:16px;display:flex;flex-wrap:wrap;gap:9px 18px;font-size:11px}.links a{text-decoration-thickness:1px;text-underline-offset:4px}.player-help{font-size:10px;line-height:1.6;color:#7b8477;margin:9px 0 0}.verdict{display:flex;gap:12px;margin:16px 0 0;padding:12px 14px;background:#e5eade;border:1px solid #d7dfce;border-radius:8px;align-items:flex-start;font-size:11px;line-height:1.65}.verdict strong{font-size:11px;white-space:nowrap;color:#3c553b}.verdict p{margin:0;color:#60705b}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:14px;color:#778171;font-size:10px;line-height:1.6}.checks b{display:inline-block;margin-right:7px;color:#465e43;font-size:10px}.error-note{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;font-size:13px;line-height:1.8;background:#e1e6dc;color:#4e6150}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}@media(min-width:1500px){.wrap{padding-top:30px}.media{height:510px}}@media(max-width:1000px){.content{grid-template-columns:minmax(0,1fr) 290px;gap:17px}.wrap{padding:20px}.details h2{font-size:21px}.media{min-height:390px}.top h1{font-size:23px}.tab{padding:10px}.tab small{font-size:10px}}@media(max-width:740px){.wrap{padding:17px 15px}.top{align-items:flex-start;gap:10px}.top h1{font-size:21px}.top p{font-size:11px;max-width:44ch}.back{padding:8px 10px;font-size:10px}.tabs{gap:6px;margin-top:16px}.tab{display:block;padding:10px 8px}.tab .letter{width:23px;height:23px;font-size:11px;margin-bottom:7px}.tab strong{font-size:11px}.tab small{font-size:9px;line-height:1.45}.content{grid-template-columns:1fr;gap:16px}.media{height:auto;min-height:0;aspect-ratio:16/11}.details h2{margin-top:10px}.desc{margin:10px 0}.facts div{padding:7px 0}.launch{padding:45px 13px 13px}.launch span{font-size:9px;max-width:155px}.play{font-size:11px;padding:11px 13px}.checks{grid-template-columns:1fr;gap:6px}.verdict{display:block}.verdict p{margin-top:4px}.links{padding-top:13px}}

<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="eyebrow">CAT ASSET REVIEW / 01</div>
        <h1>先看猫，再选路线。</h1>
        <p>免费资产候选 · 展示原作者效果，尚未接入老街；以下不是本项目渲染。</p>
      </div>
      <a class="back" href="cat-v12-gait-study.html">返回现有 V12 ↗</a>
    </header>
    <nav class="tabs" role="tablist" aria-label="猫资产候选">
      <button class="tab" id="tab-a" role="tab" aria-selected="true" aria-controls="candidate-panel" tabindex="0" data-candidate="a"><span class="letter">A</span><span><strong>Skater Cat</strong><small>优先看形体 · 毛猫</small></span></button>
      <button class="tab" id="tab-b" role="tab" aria-selected="false" aria-controls="candidate-panel" tabindex="-1" data-candidate="b"><span class="letter">B</span><span><strong>Sphynx Cat</strong><small>走跑动作对照 · 无毛猫</small></span></button>
      <button class="tab" id="tab-c" role="tab" aria-selected="false" aria-controls="candidate-panel" tabindex="-1" data-candidate="c"><span class="letter">C</span><span><strong>Animal — Cat</strong><small>游戏内表现 · 条件免费</small></span></button>
    </nav>
    <main class="content" id="candidate-panel" role="tabpanel" aria-labelledby="tab-a">
      <div class="media" id="media"></div>
      <section class="details">
        <span class="tag" id="tag"></span>
        <h2 id="name"></h2>
        <p class="author" id="author"></p>
        <p class="desc" id="description"></p>
        <dl class="facts" id="facts"></dl>
        <p class="caution" id="caution"></p>
        <div class="links"><a id="source" target="_blank" rel="noopener">资产与许可 ↗</a><a id="demo" target="_blank" rel="noopener">原站播放 ↗</a></div>
        <p class="player-help" id="player-help">点击后加载外部播放器。若嵌入播放受限，可使用「原站播放」。</p>
      </section>
    </main>
    <div class="verdict"><strong>当前结论</strong><p>A 优先看形体，B 看走跑动作，C 看游戏内表现。目前没有确认可直接替换、且形象与动作全部达标的候选。</p></div>
    <footer class="checks" aria-label="观察要点">
      <span><b>01</b>正常速度看肩背、头颈、尾巴是否协调。</span>
      <span><b>02</b>看脚掌落地、负重，是否滑步或拉扯变形。</span>
      <span><b>03</b>还需检查转身、起步、停止；循环演示不能代表全部。</span>
    </footer>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </div>
  <script>
    const candidates = {
      a: {
        name: 'Skater Cat', author: 'JonasDichelle · BlendSwap', tag: '形体优先候选',
        description: '先看脸、四足轮廓和肩背比例。作者短片呈现了完整角色形象；模型页面明确附带走路与跑步循环。',
        facts: [['费用','免费 · CC-BY，使用时需署名。'],['动作','作者标注：Walk、Run。'],['文件','Blender 2.7x · 动态毛发 · Cycles。']],
        caution: '旧版文件与动态毛发需要网页适配。作者短片的毛发和渲染质感，不能直接当作网页接入后的效果。',
        image: 'https://img.blendswap.com/archive/images/2016/09/28/Blend/86110/686c8ad19744ecd9147fd2d5ea002b57.jpg',
        source: 'https://blendswap.com/blend/18519', demo: 'https://www.youtube.com/watch?v=dsc3bmn9UdI&t=10s',
        embed: 'https://www.youtube.com/embed/dsc3bmn9UdI?start=10&autoplay=1&rel=0',
        play: '观看作者短片', hint: '从 00:10 开始 · 保持正常播放速度', credit: '原作者效果 · JonasDichelle',
        help: '点击后加载 YouTube。若嵌入播放受限，可使用「原站播放」。'
      },
      b: {
        name: 'Sphynx Cat', author: 'Animal Animator · Sketchfab', tag: '动作对照备选',
        description: '可切换慢走、小跑和奔跑，观察全身配合。已确认这些片段能播放；动作齐全仍不代表自然度通过。',
        facts: [['费用','免费 · CC BY 4.0，需署名并链接作者文章。'],['动作','实查 12 段，含 Idle、Walk、Trot、Gallop_Run。'],['文件','作者说明为 GLB；无毛猫，标记使用 AI 生成。']],
        caution: '爪趾偏夸张，无毛外观与原目标不同。2026 年 10 月新发布，自然度待验收，暂不视为成熟的最终替换。',
        image: 'https://media.sketchfab.com/models/0b86bde7a8b64fd7a459035b339a790f/thumbnails/b9e83c7553044536b3b6c95419c9f26f/41024a1015394763a862a5c3ceb0978a.jpeg',
        source: 'https://animalanimator.com/the-ultimate-sphinx-cat-reference-for-animal-animators/', sourceLabel: '作者与制作说明 ↗',
        demo: 'https://sketchfab.com/3d-models/sphynx-cat-rigged-animated-10-anims-0b86bde7a8b64fd7a459035b339a790f',
        embed: 'https://sketchfab.com/models/0b86bde7a8b64fd7a459035b339a790f/embed?autostart=1',
        play: '打开可旋转 3D 预览', hint: '动作菜单：Cat_Walk / Cat_Trot / Cat_Gallop_Run', credit: '原作者预览 · Animal Animator',
        help: '在播放器动作菜单切换 Walk、Trot、Gallop_Run；可拖动观察侧面。若看不到动作菜单，先点播放器全屏。若加载失败，打开「原站播放」。'
      },
      c: {
        name: 'Animal — Cat', author: 'CocainClub · Fab / Free Bundle', tag: '游戏内表现备选 · 条件免费',
        description: '看成品猫在游戏环境里的体积、步态和材质。当前演示体形偏厚，游戏感较强，作为另一种效果对照。',
        facts: [['费用','个人档免费：过去 12 个月收入／融资合计不超过 10 万美元；专业档 $5.99。'],['动作','作者标注 10 个动画，完整片段名称尚待核实。'],['文件','仅列 UE 5.6–5.7 · Fab 标准许可 · AI 生成标记。']],
        caution: '不是可直接导入网页的 GLB 包。走跑自然度、动画导出和材质兼容仍需验证；免费档有适用条件。',
        image: 'https://media.fab.com/image_previews/gallery_images/e63842cd-4964-4c7c-bf73-b727923ff889/2e418122-2385-4e0b-8d3c-ea5f084abcaa.jpg',
        source: 'https://www.fab.com/listings/bb864687-9852-4c54-a160-4cb28ce3e2ea', demo: 'https://www.youtube.com/watch?v=ePYUOUv1pEc',
        embed: 'https://www.youtube.com/embed/ePYUOUv1pEc?autoplay=1&rel=0',
        play: '观看游戏内演示', hint: '原作者实机演示 · 保持正常播放速度', credit: '原作者效果 · CocainClub',
        help: '点击后加载 YouTube。若嵌入播放受限，可使用「原站播放」。'
      }
    };
    const $ = id => document.getElementById(id);
    const tabs = Array.from(document.querySelectorAll('[data-candidate]'));
    function showCandidate(key) {
      const item = candidates[key];
      tabs.forEach(tab => { const active = tab.dataset.candidate === key; tab.setAttribute('aria-selected', String(active)); tab.tabIndex = active ? 0 : -1; });
      $('candidate-panel').setAttribute('aria-labelledby', 'tab-' + key);
      $('tag').textContent = item.tag; $('name').textContent = item.name; $('author').textContent = item.author;
      $('description').textContent = item.description; $('caution').textContent = item.caution;
      $('source').href = item.source; $('source').textContent = item.sourceLabel || '资产与许可 ↗'; $('demo').href = item.demo; $('player-help').textContent = item.help;
      $('facts').replaceChildren(...item.facts.map(([label,value]) => {
        const row = document.createElement('div'), term = document.createElement('dt'), detail = document.createElement('dd');
        term.textContent = label; detail.textContent = value; row.append(term,detail); return row;
      }));
      const picture = document.createElement('img'); picture.src = item.image; picture.alt = item.name + ' 原作者效果预览'; picture.decoding = 'async';
      picture.addEventListener('error', () => {
        if (!picture.isConnected) return;
        picture.hidden = true;
        const note = document.createElement('div'); note.className = 'error-note'; note.textContent = '原站封面暂未加载，可直接播放演示，或打开原站查看。';
        $('media').prepend(note);
      }, {once:true});
      const credit = document.createElement('div'); credit.className = 'credit'; credit.textContent = item.credit;
      const launch = document.createElement('div'); launch.className = 'launch';
      const play = document.createElement('button'); play.className = 'play'; play.textContent = item.play;
      const hint = document.createElement('span'); hint.textContent = item.hint; launch.append(play,hint);
      play.addEventListener('click', () => {
        const frame = document.createElement('iframe'); frame.src = item.embed; frame.title = item.name + ' 原作者动画演示';
        frame.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture; xr-spatial-tracking'; frame.allowFullscreen = true;
        frame.referrerPolicy = 'strict-origin-when-cross-origin'; $('media').replaceChildren(frame);
        $('announcement').textContent = '已打开 ' + item.name + ' 外部播放器。';
      });
      $('media').replaceChildren(picture,credit,launch);
      $('announcement').textContent = '当前候选：' + item.name + '。' + item.tag;
    }
    tabs.forEach((tab,index) => {
      tab.addEventListener('click', () => showCandidate(tab.dataset.candidate));
      tab.addEventListener('keydown', event => {
        let next;
        if(event.key === 'ArrowRight') next = (index + 1) % tabs.length;
        if(event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
        if(event.key === 'Home') next = 0;
        if(event.key === 'End') next = tabs.length - 1;
        if(next !== undefined) { event.preventDefault(); tabs[next].focus(); showCandidate(tabs[next].dataset.candidate); }
      });
    });
    showCandidate('a');
  </script>
</body>
</html>
