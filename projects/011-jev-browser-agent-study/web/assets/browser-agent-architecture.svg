<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Jev Ultrafast：核心架构与执行循环</title><desc id="description">程序提取网页候选，Jev选择操作和目标；需要填字时由独立文字模型生成内容，程序检查后通过浏览器执行。读取新页面并更新历史后再次循环；DONE后由业务独立验收。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7551bf"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14867d"/></marker><marker id="slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526b83"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f7f9fc" stroke="#f7f9fc"/><text x="60" y="57" font-size="22" fill="#2457d6" font-weight="650" text-anchor="start">011 / JEV-ULTRAFAST · 核心架构</text><text x="1860" y="57" font-size="22" fill="#54677d" font-weight="400" text-anchor="end">四方分工 · 每轮执行一步</text><text x="60" y="128" font-size="54" fill="#14283f" font-weight="750" text-anchor="start">程序负责循环，Jev 负责选择</text><text x="60" y="178" font-size="29" fill="#54677d" font-weight="400" text-anchor="start">程序从网页提取可操作选项；执行后再看新页面，直到目标完成并独立验收。</text><rect x="60" y="218" width="810" height="88" rx="14" fill="#ffffff" stroke="#dce3ed"/><text x="84" y="252" font-size="27" fill="#14283f" font-weight="650" text-anchor="start">你提供网址 + 目标</text><text x="84" y="286" font-size="25" fill="#54677d" font-weight="400" text-anchor="start">例如：查杭州酒店，指定日期，筛选免费取消</text><path d="M 260 306 L 260 410" stroke="#2457d6" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#blue)"/><text x="277" y="367" font-size="23" fill="#2457d6" font-weight="400" text-anchor="start">启动任务</text><rect x="1000" y="218" width="400" height="134" rx="14" fill="#e8f5f1" stroke="#14867d"/><text x="1025" y="258" font-size="28" fill="#14867d" font-weight="650" text-anchor="start">文字模型 · 独立助手</text><text x="1025" y="298" font-size="25" fill="#54677d" font-weight="400" text-anchor="start">仅需填字时，生成字段内容</text><text x="1025" y="332" font-size="25" fill="#54677d" font-weight="400" text-anchor="start">例如：为城市框生成“杭州”</text><rect x="1480" y="218" width="380" height="134" rx="14" fill="#ffffff" stroke="#dce3ed"/><text x="1505" y="257" font-size="26" fill="#14283f" font-weight="650" text-anchor="start">先记住这四个角色</text><text x="1505" y="296" font-size="23" fill="#54677d" font-weight="400" text-anchor="start">程序组织与执行 · Jev 抉择</text><text x="1505" y="330" font-size="23" fill="#54677d" font-weight="400" text-anchor="start">文字模型写内容 · 浏览器操作</text><rect x="60" y="410" width="400" height="300" rx="18" fill="#edf2ff" stroke="#2457d6"/><text x="85" y="454" font-size="24" fill="#2457d6" font-weight="650" text-anchor="start">① 程序 / 这个库</text><text x="85" y="506" font-size="34" fill="#14283f" font-weight="700" text-anchor="start">读网页，整理选项</text><text x="85" y="558" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">从 DOM / ARIA 读取控件</text><text x="85" y="597" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">按规则列出能点、能填的操作</text><text x="85" y="636" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">附上目标、页面状态和历史</text><rect x="82" y="653" width="356" height="38" rx="7" fill="#ffffff" stroke="#ffffff"/><text x="96" y="680" font-size="21" fill="#2457d6" font-weight="600" text-anchor="start">产物：当前可执行的候选操作</text><rect x="540" y="410" width="330" height="300" rx="18" fill="#f2edfb" stroke="#7551bf"/><text x="565" y="454" font-size="24" fill="#7551bf" font-weight="650" text-anchor="start">② Jev / 决策模型</text><text x="565" y="506" font-size="34" fill="#14283f" font-weight="700" text-anchor="start">选下一步</text><text x="565" y="558" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">选择“做什么”</text><text x="565" y="597" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">同时选择目标元素</text><text x="565" y="636" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">如：填字 → 城市框</text><rect x="562" y="653" width="286" height="38" rx="7" fill="#ffffff" stroke="#ffffff"/><text x="576" y="680" font-size="21" fill="#7551bf" font-weight="600" text-anchor="start">返回：操作 + 对应目标</text><rect x="1000" y="410" width="400" height="300" rx="18" fill="#edf2ff" stroke="#2457d6"/><text x="1025" y="454" font-size="24" fill="#2457d6" font-weight="650" text-anchor="start">③ 程序 / 还是这个库</text><text x="1025" y="506" font-size="34" fill="#14283f" font-weight="700" text-anchor="start">检查，然后执行</text><text x="1025" y="558" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">核对页面与目标仍然有效</text><text x="1025" y="597" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">检查可见、禁用与遮挡等状态</text><text x="1025" y="636" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">通过后发送点击或输入指令</text><rect x="1022" y="653" width="356" height="38" rx="7" fill="#ffffff" stroke="#ffffff"/><text x="1036" y="680" font-size="21" fill="#2457d6" font-weight="600" text-anchor="start">需要填字时，先取文字模型结果</text><rect x="1480" y="410" width="380" height="300" rx="18" fill="#eef2f6" stroke="#526b83"/><text x="1505" y="454" font-size="24" fill="#526b83" font-weight="650" text-anchor="start">④ 浏览器 / Chrome</text><text x="1505" y="506" font-size="34" fill="#14283f" font-weight="700" text-anchor="start">网页真正发生变化</text><text x="1505" y="558" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">实际点击、填字或选择</text><text x="1505" y="597" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">触发导航、弹层或加载</text><text x="1505" y="636" font-size="26" fill="#54677d" font-weight="400" text-anchor="start">提供操作后的新页面状态</text><rect x="1502" y="653" width="336" height="38" rx="7" fill="#ffffff" stroke="#ffffff"/><text x="1516" y="680" font-size="21" fill="#526b83" font-weight="600" text-anchor="start">底层连接：Browser Harness</text><path d="M 460 568 L 540 568" stroke="#2457d6" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 870 568 L 1000 568" stroke="#7551bf" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#purple)"/><path d="M 1400 568 L 1480 568" stroke="#2457d6" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1080 410 L 1080 352" stroke="#14867d" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#teal)"/><text x="940" y="375" font-size="22" fill="#14867d" font-weight="400" text-anchor="start">需填字时</text><text x="940" y="403" font-size="22" fill="#14867d" font-weight="400" text-anchor="start">程序调用</text><path d="M 1320 352 L 1320 410" stroke="#14867d" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#teal)"/><text x="1336" y="390" font-size="23" fill="#14867d" font-weight="400" text-anchor="start">字段文字</text><path d="M 1670 710 L 1670 812 L 260 812 L 260 710" stroke="#2457d6" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="475" y="777" width="985" height="70" rx="12" fill="#f7f9fc" stroke="#f7f9fc"/><text x="968" y="822" font-size="29" fill="#2457d6" font-weight="650" text-anchor="middle">新页面 + 执行记录 → 重新提取选项 → 再问 Jev</text><text x="968" y="873" font-size="25" fill="#54677d" font-weight="400" text-anchor="middle">每轮都使用更新后的页面与历史；不是一次推理就做完整个任务。</text><rect x="60" y="915" width="1800" height="89" rx="14" fill="#e7f3ef" stroke="#d1e9df"/><text x="88" y="952" font-size="24" fill="#14867d" font-weight="650" text-anchor="start">完成出口</text><text x="256" y="952" font-size="30" fill="#14283f" font-weight="650" text-anchor="start">Jev 返回 DONE → 业务程序独立核验 → 确认实际结果满足目标</text><text x="256" y="986" font-size="24" fill="#54677d" font-weight="400" text-anchor="start">DONE 是模型的停止判断；是否真正成功，由业务规则验证。</text><a href="https://github.com/browser-use/jev-ultrafast/tree/1231850a0bf1a0c0341fe408ef1668dbbfdfac46" target="_blank"><text x="60" y="1049" font-size="21" fill="#54677d" font-weight="400" text-anchor="start">依据上游 v0.1.0 源码整理 · 2026-10-23 · 简化架构示意（非真实运行轨迹）</text></a><text x="1860" y="1049" font-size="21" fill="#2457d6" font-weight="400" text-anchor="end">详细原理、训练与速度证据见研究网页 →</text></g></svg>