<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f2f3e9"/><path d="M55 106H1145" stroke="#c8d2bf"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#244b38"><text x="55" y="72" font-size="18" letter-spacing="4">RESEARCH ATLAS / 004</text><text x="55" y="195" font-size="53" font-weight="bold">数字人技术图谱</text><text x="55" y="247" font-size="23" fill="#61716b">从素材口型，到三维驱动与实时生成</text><g transform="translate(55 305)"><rect width="340" height="245" rx="9" fill="#e0e8d5"/><text x="25" y="45" font-size="14">01 / VIDEO + LIP SYNC</text><text x="25" y="111" font-size="27">动作在素材里</text><text x="25" y="157" font-size="17">图片 → 动作视频 → 实时口型</text><text x="25" y="215" font-size="14">稳定的底片 · 灵活的声音</text></g><g transform="translate(430 305)"><rect width="340" height="245" rx="9" fill="#dde7eb"/><text x="25" y="45" font-size="14">02 / 3D + ANIMATION</text><text x="25" y="111" font-size="27">角色可以被操控</text><text x="25" y="157" font-size="17">面部曲线＋身体骨骼 → 渲染</text><text x="25" y="215" font-size="14">空间与姿态 · 独立动作系统</text></g><g transform="translate(805 305)"><rect width="340" height="245" rx="9" fill="#eae4d4"/><text x="25" y="45" font-size="14">03 / STREAMING GENERATION</text><text x="25" y="111" font-size="27">画面持续生成</text><text x="25" y="157" font-size="17">参考＋音频＋历史 → 新画面</text><text x="25" y="215" font-size="14">表现空间 · 算力与一致性</text></g><text x="55" y="616" font-size="17">8 类路线 / 31 个模型与工具 / 来源、成本与测试方法</text><text x="1000" y="616" font-size="15">2026.10.23</text></g></svg>
