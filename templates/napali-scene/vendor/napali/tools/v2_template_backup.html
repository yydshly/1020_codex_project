<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Na Pali FPV</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,monospace}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#cfe6ff;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:#030a14;transition:opacity .6s}
  #load .bar{width:260px;height:2px;background:#17324f;overflow:hidden}
  #load .bar i{display:block;height:100%;width:0;background:#7fc4ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><div id="loadtxt">Generating terrain</div><div class="bar"><i id="loadbar"></i></div></div>
<script>
'use strict';
// ============================================================================
//  Na Pali coast — 100% procedural. No textures, images, models or samples.
//  The only data is a traced waterline (a vector path, like an artist's sketch)
//  plus a few art-direction control points. Everything else is generated:
//  stream-power erosion on the GPU, an FFT ocean, layered basalt, rainforest
//  canopy, breaking surf, sky and a physically-driven FPV drone flight.
// ============================================================================
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'drone';
const DEG = Math.PI / 180;
const num = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);

// Reference camera (the still frame) -----------------------------------------
const REF_W = 1672, REF_H = 941;
const STILL = { h: num('camH', 1000), pitch: num('pitch', 50) * DEG, vfov: num('vfov', 38) * DEG, aspect: REF_W / REF_H };

function camBasis(yaw, pitch) {
  // yaw around +y (0 = looking toward +z), pitch = down angle
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const f = [sy * cp, -sp, cy * cp];
  const r = [cy, 0, -sy];
  const u = [sy * sp, cp, cy * sp];
  return { r, u, f };
}
function unproject(px, py, planeY = 0) {
  const t = Math.tan(STILL.vfov / 2);
  const sx = (2 * px / REF_W - 1) * STILL.aspect * t, sy = (1 - 2 * py / REF_H) * t;
  const { r, u, f } = camBasis(0, STILL.pitch);
  const d = [f[0] + sx * r[0] + sy * u[0], f[1] + sx * r[1] + sy * u[1], f[2] + sx * r[2] + sy * u[2]];
  const k = (STILL.h - planeY) / -d[1];
  return [d[0] * k, d[2] * k];
}

// Traced waterline (image space, px). Loop 0 = mainland, rest = sea stacks.
//@@COAST@@

// Valley axes [x px, y px, floor height m, half-width m]
const VALLEYS_IMG = [
  [[1190, 488, 0.8, 75], [1212, 425, 8, 45], [1245, 335, 24, 30], [1295, 240, 48, 22], [1375, 125, 90, 18], [1460, 20, 140, 15]],
  [[338, 184, 1.2, 42], [378, 150, 12, 30], [440, 98, 40, 22], [520, 30, 80, 18]],
];
// Sea-cliff heights along the coast [x px, y px, height m, rise width m]
const CLIFFS_IMG = [[80, 60, 60, 45], [150, 150, 45, 40], [280, 300, 85, 40], [380, 250, 75, 45], [550, 360, 70, 45], [650, 420, 65, 45],
  [830, 560, 95, 35], [890, 680, 80, 32], [985, 540, 35, 40], [1360, 620, 95, 22], [1450, 700, 120, 20], [1600, 800, 110, 22], [1660, 870, 100, 24]];
// Massif bumps [x px, y px, peak height m, radius m]
const MASSIF_IMG = [[1500, 320, 210, 330], [1650, 110, 300, 400], [1420, 540, 90, 180]];
// Beach aprons [x px, y px, radius m, beach slope]
const BEACHES_IMG = [[1185, 505, 175, 0.065], [338, 186, 55, 0.08]];
// Shallow sandy shelves [x px, y px, radius m, strength]
const SHELVES_IMG = [[1160, 640, 230, 1.0], [1300, 760, 120, 0.7], [270, 215, 90, 0.9], [490, 410, 110, 0.6], [1480, 800, 110, 0.5], [760, 610, 70, 0.4]];

// ---------------------------------------------------------------------------
//@@BUILD@@
// ============================================================================
//  GLSL
// ============================================================================
const GLSL_COMMON = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
#define PI 3.14159265359
uniform int uZero; // always 0: keeps D3D/fxc from unrolling loops (huge compile-time win)
float hash11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float hash13(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
vec3 hash33(vec3 p3){p3=fract(p3*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yxz+33.33);return fract((p3.xxy+p3.yxx)*p3.zyx);}
float vnoise(vec2 x){vec2 i=floor(x),f=fract(x);vec2 u=f*f*(3.-2.*f);
  float a=hash12(i),b=hash12(i+vec2(1,0)),c=hash12(i+vec2(0,1)),d=hash12(i+vec2(1,1));
  return -1.+2.*(a+(b-a)*u.x+(c-a)*u.y+(a-b-c+d)*u.x*u.y);}
vec3 vnoised(vec2 x){vec2 i=floor(x),f=fract(x);vec2 u=f*f*(3.-2.*f);vec2 du=6.*f*(1.-f);
  float a=hash12(i),b=hash12(i+vec2(1,0)),c=hash12(i+vec2(0,1)),d=hash12(i+vec2(1,1));
  float k1=b-a,k2=c-a,k4=a-b-c+d;
  return vec3(-1.+2.*(a+k1*u.x+k2*u.y+k4*u.x*u.y),2.*du*vec2(k1+k4*u.y,k2+k4*u.x));}
float noise3(vec3 x){vec3 i=floor(x),f=fract(x);vec3 u=f*f*(3.-2.*f);
  float a=hash13(i),b=hash13(i+vec3(1,0,0)),c=hash13(i+vec3(0,1,0)),d=hash13(i+vec3(1,1,0)),
        e=hash13(i+vec3(0,0,1)),f1=hash13(i+vec3(1,0,1)),g=hash13(i+vec3(0,1,1)),h=hash13(i+vec3(1,1,1));
  return -1.+2.*mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y),mix(mix(e,f1,u.x),mix(g,h,u.x),u.y),u.z);}
vec4 noised3(vec3 x){vec3 i=floor(x),f=fract(x);vec3 u=f*f*(3.-2.*f),du=6.*f*(1.-f);
  float a=hash13(i),b=hash13(i+vec3(1,0,0)),c=hash13(i+vec3(0,1,0)),d=hash13(i+vec3(1,1,0)),
        e=hash13(i+vec3(0,0,1)),f1=hash13(i+vec3(1,0,1)),g=hash13(i+vec3(0,1,1)),h=hash13(i+vec3(1,1,1));
  float k1=b-a,k2=c-a,k3=e-a,k4=a-b-c+d,k5=a-c-e+g,k6=a-b-e+f1,k7=-a+b+c-d+e-f1-g+h;
  return vec4(-1.+2.*(a+k1*u.x+k2*u.y+k3*u.z+k4*u.x*u.y+k5*u.y*u.z+k6*u.z*u.x+k7*u.x*u.y*u.z),
    2.*du*vec3(k1+k4*u.y+k6*u.z+k7*u.y*u.z,k2+k5*u.z+k4*u.x+k7*u.z*u.x,k3+k6*u.x+k5*u.y+k7*u.x*u.y));}
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
const mat3 M3=mat3(0.00,1.60,1.20,-1.60,0.72,-0.96,-1.20,-0.96,1.28);
float fbm(vec2 p,int o){float s=0.,a=.5;for(int i=uZero;i<o;i++){s+=a*vnoise(p);p=M2*p;a*=.5;}return s;}
vec3 fbmd(vec2 p,int o){vec3 s=vec3(0);float a=.5;mat2 m=mat2(1,0,0,1);
  for(int i=uZero;i<o;i++){vec3 n=vnoised(p);s.x+=a*n.x;s.yz+=a*(n.yz*m);p=M2*p;m=M2*m;a*=.5;}return s;}
float fbm3(vec3 p,int o){float s=0.,a=.5;for(int i=uZero;i<o;i++){s+=a*noise3(p);p=M3*p;a*=.5;}return s;}
vec4 fbm3d(vec3 p,int o){vec4 s=vec4(0);float a=.5;mat3 m=mat3(1.);
  for(int i=uZero;i<o;i++){vec4 n=noised3(p);s.x+=a*n.x;s.yzw+=a*(n.yzw*m);p=M3*p;m=M3*m;a*=.5;}return s;}
float ridged(vec2 p,int o){float s=0.,a=.5;for(int i=uZero;i<o;i++){float n=1.-abs(vnoise(p));s+=a*n*n;p=M2*p;a*=.5;}return s;}
vec3 voronoi(vec2 x){vec2 n=floor(x),f=fract(x);float d1=8.,d2=8.,id=0.;
  for(int j=uZero-1;j<=1;j++)for(int i=uZero-1;i<=1;i++){vec2 g=vec2(i,j);vec2 o=hash22(n+g);vec2 r=g+o-f;float d=dot(r,r);
    if(d<d1){d2=d1;d1=d;id=hash12(n+g+17.);}else if(d<d2)d2=d;}
  return vec3(sqrt(d1),sqrt(d2),id);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec4 cubicW(float v){vec4 n=vec4(1,2,3,4)-v;vec4 s=n*n*n;float x=s.x,y=s.y-4.*s.x,z=s.z-4.*s.y+6.*s.x,w=6.-x-y-z;return vec4(x,y,z,w)/6.;}
vec4 texBicubic(sampler2D t,vec2 uv){vec2 res=vec2(textureSize(t,0));uv=uv*res-.5;vec2 f=fract(uv);uv-=f;
  vec4 xc=cubicW(f.x),yc=cubicW(f.y);vec4 c=uv.xxyy+vec2(-.5,1.5).xyxy;vec4 s=vec4(xc.xz+xc.yw,yc.xz+yc.yw);
  vec4 off=(c+vec4(xc.yw,yc.yw)/s)/res.xxyy;
  vec4 s0=textureLod(t,off.xz,0.),s1=textureLod(t,off.yz,0.),s2=textureLod(t,off.xw,0.),s3=textureLod(t,off.yw,0.);
  float sx=s.x/(s.x+s.y),sy=s.z/(s.z+s.w);return mix(mix(s3,s2,sx),mix(s1,s0,sx),sy);}
`;

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv; void main(){ vUv=aPos*.5+.5; gl_Position=vec4(aPos,0,1); }`;

// ---- terrain generation ------------------------------------------------------
const TERRAIN_FUNCS = `
uniform sampler2D uCoast; uniform vec4 uCR;
float coastRaw(vec2 p){ return textureLod(uCoast,(p-uCR.xy)*uCR.w,0.).r; }
float coastD(vec2 p){ return coastRaw(p) + 5.*vnoise(p*.035+3.7) + 2.2*vnoise(p*.12-1.3) + 0.8*vnoise(p*.4); }
// (r13 fix) west bay reef terrace mask (world space): full inside ~half the ellipse, ragged edge (FS_HEIGHT floor + FS_RENDER water colour)
float wBayM(vec2 p){ return smoothstep(1.,.5,length((p-vec2(-290.,860.))/vec2(230.,175.))+.25*fbm(p*.007+vec2(7.1,2.3),2)); }
`;
const BASE_FUNCS = TERRAIN_FUNCS + `
uniform vec4 uRect; uniform vec2 uRes;
uniform vec4 uVS[24]; uniform vec4 uVP[24]; uniform int uNV; uniform vec4 uSH[8]; uniform int uNSH;
uniform float uMtnH, uMtnL, uVW; uniform vec4 uBZ[4]; uniform int uNBZ; uniform vec4 uCH[16]; uniform int uNCH; uniform vec4 uMS[4]; uniform int uNMS;
float baseLand(vec2 p){
  float d=coastD(p);
  float L=max(d,0.);
  float n1=vnoise(p*.0016+vec2(7.3,1.1))*.5+.5;
  float n2=vnoise(p*.0055-vec2(3.1,8.2))*.5+.5;
  float cw=.15, chs=mix(30.,80.,n2)*.15, crw=mix(28.,55.,n1)*.15;
  for(int i=uZero;i<uNCH;i++){ vec2 dd=p-uCH[i].xy; float wi=1./(1.+dot(dd,dd)/(140.*140.)); wi*=wi; cw+=wi; chs+=wi*uCH[i].z*(.8+.4*n2); crw+=wi*uCH[i].w; }
  float cliffH=chs/cw;
  float hc=cliffH*smoothstep(0.,crw/cw*(.85+.3*n1),L);
  float hm=uMtnH*mix(.72,1.12,n1)*(1.-exp(-L/uMtnL));
  for(int i=uZero;i<uNMS;i++){ vec2 dd=p-uMS[i].xy; hm+=uMS[i].z*exp(-dot(dd,dd)/(uMS[i].w*uMS[i].w))*smoothstep(0.,80.,L); }
  float vmin=1e9; float carve=1e9;
  for(int i=uZero;i<uNV;i++){
    vec4 s=uVS[i]; vec4 vp=uVP[i];
    vec2 a=s.xy,b=s.zw,pa=p-a,ba=b-a;
    float t=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
    float dist=length(pa-ba*t);
    float fl=mix(vp.x,vp.y,t), hw=mix(vp.z,vp.w,t);
    carve=min(carve,fl+.06*min(dist,hw)+.62*max(dist-hw,0.));
    vmin=min(vmin,max(dist-hw,0.)/uVW);
  }
  float broad=1.-exp(-vmin*vmin);
  float h=hc+hm*mix(.55,1.,broad);
  h=smin(h,carve,28.);
  for(int i=uZero;i<uNBZ;i++){ vec4 z=uBZ[i]; float m=smoothstep(z.z,z.z*.6,length(p-z.xy)); h=mix(h,min(h,.35+L*z.w),m*(1.-smoothstep(40.,90.,L))); }
  return h;
}
`;
const FS_BASE = GLSL_COMMON + BASE_FUNCS + `
out vec4 o;
void main(){ vec2 p=uRect.xy+gl_FragCoord.xy/uRes*uRect.z; o=vec4(baseLand(p),0,0,1); }`;

// GPU fluvial erosion: stream power law with multiple-flow-direction drainage + talus slumping.
// state: r = height, g = drainage area (m^2), b = area / sum(slope^p) (outflow share), a = fixed (sea / border)
const FS_EINIT = GLSL_COMMON + TERRAIN_FUNCS + `
uniform sampler2D uBase; uniform vec4 uDom; uniform vec2 uRes; uniform float uRough, uRoughScale;
out vec4 o;
void main(){
  ivec2 ic=ivec2(gl_FragCoord.xy); vec2 p=uDom.xy+(vec2(ic)+.5)*uDom.w;
  float h=texelFetch(uBase,ic,0).r, cd=coastRaw(p);
  bool border=ic.x==0||ic.y==0||ic.x==int(uRes.x)-1||ic.y==int(uRes.y)-1;
  if(cd<0.){ o=vec4(min(h,0.),uDom.w*uDom.w,0.,1.); return; }
  float land=clamp(cd/40.,0.,1.)*clamp(h/120.,0.,1.);
  h+=uRough*fbm(p/uRoughScale,6)*land;
  o=vec4(h,uDom.w*uDom.w,0.,border?1.:0.);
}`;
const FS_ERODE = GLSL_COMMON + TERRAIN_FUNCS + `
uniform sampler2D uS; uniform vec4 uDom; uniform float uDt, uK, uP, uTalus, uThermal, uKvalley, uCoastHard;
uniform vec4 uVS[24]; uniform vec4 uVP[24]; uniform int uNV;
out vec4 o;
const ivec2 OFF[8]=ivec2[8](ivec2(1,0),ivec2(-1,0),ivec2(0,1),ivec2(0,-1),ivec2(1,1),ivec2(-1,1),ivec2(1,-1),ivec2(-1,-1));
void main(){
  ivec2 ic=ivec2(gl_FragCoord.xy);
  vec4 c=texelFetch(uS,ic,0);
  if(c.a>.5){ o=c; return; }
  float cell=uDom.w, h=c.r;
  float Ain=cell*cell, sumS=0., Smax=0., hmin=1e9, th=0.;
  for(int k=uZero;k<8;k++){
    float d=(k<4?1.:1.41421356)*cell;
    vec4 n=texelFetch(uS,ic+OFF[k],0);
    float s=(h-n.r)/d;
    if(s>0.){ float w=pow(s,uP); sumS+=w; Smax=max(Smax,s); }
    else Ain+=n.b*pow(-s,uP);
    hmin=min(hmin,n.r);
    float lim=uTalus*d;
    th+=max(n.r-h-lim,0.)-max(h-n.r-lim,0.);
  }
  vec2 p=uDom.xy+(vec2(ic)+.5)*cell;
  float vw=0.;
  for(int i=uZero;i<uNV;i++){ vec4 sg=uVS[i]; vec2 a=sg.xy,ba=sg.zw-sg.xy,pa=p-a; float t=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
    float dd=length(pa-ba*t), w=mix(uVP[i].z,uVP[i].w,t)*1.1; vw=max(vw,exp(-dd*dd/(w*w))); }
  float cd=max(coastRaw(p),0.);
  float hard=mix(uCoastHard,1.,smoothstep(25.,320.,cd));
  float K=uK*(1.+.4*vnoise(p/650.+5.))*mix(hard,1.+uKvalley,vw);
  float hn=h-uDt*K*sqrt(Ain)*Smax;
  hn=max(hn,min(h,hmin+.001));
  if(Smax<=0.) hn=hmin+.02;
  hn+=uThermal*th;
  hn=max(hn,.6+.04*cd);
  o=vec4(hn,Ain,sumS>0.?Ain/sumS:0.,0.);
}`;

// (r9 terrain) inland valley: knife-edge fins and a narrow V instead of the flat alluvial plain.
// The stream-power pass floors the cove valley at its deposition level (.6 + .04 x coast distance), a ~450 m wide sunlit
// plain from the beach to ~1.3 km inland; ref.png / r9 show a shaded V gorge between steep fins. After the erosion, this
// pass raises the plain (never lowers anything) into spurs that run down from both walls to a narrow channel on the
// valley axis: the gully lines climb the walls and point downstream (u = s - k |d|), knife-edge crests, rounded gully
// floors, crest heights that vary from fin to fin. The fill rises steeply from the channel and saturates (inner gorge),
// fades out ~260-360 m from the axis and after 480 m along it (the natural gorge takes over); the floor is a triangle
// like r9 / ref.png: ~220 m wide behind the beach (s 40-180), ~110 m from s 330 (the view 5 camera keeps its view up the
// valley). All parameters are URL-tunable (vf*); vfill=0 switches the pass off.
// It works on the eroded field, so landH's crest sharpening, flutes and the vegetation masks all follow the new shape.
const FS_VFILL = GLSL_COMMON + TERRAIN_FUNCS + `
uniform sampler2D uS; uniform vec4 uDom; uniform vec4 uVF0, uVF1, uVF2, uVF3, uVF4, uVF5, uVF6, uVF7, uVF8, uVF9, uVSA, uVSB, uVSC;
out vec4 o;
const vec2 VAX[9]=vec2[9](vec2(335.,820.),vec2(360.,900.),vec2(405.,1000.),vec2(445.,1100.),vec2(480.,1180.),vec2(550.,1260.),vec2(640.,1350.),vec2(720.,1440.),vec2(790.,1540.));
float gS(vec2 q){ return textureLod(uS,(q-uDom.xy)/uDom.z,0.).r; }
vec2 axP(float s){ float sc=0.; for(int i=uZero;i<8;i++){ vec2 a=VAX[i], ba=VAX[i+1]-a; float L=length(ba); if(s<=sc+L||i==7) return a+ba*clamp((s-sc)/L,0.,1.); sc+=L; } return VAX[8]; }
void vframe(vec2 p, out float s, out float d){   // the valley frame of vfill() (s along the axis, d across it, + = east)
  float dist[8], sa[8], pd[8]; float dmin=1e9, s0=0.;
  for(int i=uZero;i<8;i++){
    vec2 a=VAX[i], ba=VAX[i+1]-a; float L=length(ba); vec2 tg=ba/L, pa=p-a;
    float al=dot(pa,tg);
    dist[i]=length(pa-tg*clamp(al,0.,L)); sa[i]=s0+al; pd[i]=pa.x*tg.y-pa.y*tg.x;
    dmin=min(dmin,dist[i]); s0+=L;
  }
  float W=0.; s=0.; d=0.;
  for(int i=uZero;i<8;i++){ float w=exp(-(dist[i]-dmin)/30.); W+=w; s+=w*sa[i]; d+=w*pd[i]; }
  s/=W; d/=W;
}
void vfill(vec4 c, vec2 p){
  if(p.x<-50.||p.x>1250.||p.y<760.||p.y>1800.) return;
  // smooth valley frame (s along the axis, d across it, + = east side): soft-min blend of the segment projections
  float dist[8], sa[8], pd[8]; float dmin=1e9, s0=0.;
  for(int i=uZero;i<8;i++){
    vec2 a=VAX[i], ba=VAX[i+1]-a; float L=length(ba); vec2 tg=ba/L, pa=p-a;
    float al=dot(pa,tg);
    dist[i]=length(pa-tg*clamp(al,0.,L)); sa[i]=s0+al; pd[i]=pa.x*tg.y-pa.y*tg.x;
    dmin=min(dmin,dist[i]); s0+=L;
  }
  float W=0., s=0., d=0.;
  for(int i=uZero;i<8;i++){ float w=exp(-(dist[i]-dmin)/30.); W+=w; s+=w*sa[i]; d+=w*pd[i]; }
  s/=W; d/=W;
  float ad=abs(d);
  float sw=smoothstep(uVF0.x,uVF0.y,s+uVF4.w*max(ad-120.,0.))*(1.-smoothstep(uVF0.z,uVF0.w,s));   // beside the beach flat the fill starts earlier
  if(sw<=0.||ad>380.) return;
  // channel floor: the eroded height on the axis
  vec2 ap=VAX[0]; float sc=0.;
  for(int i=uZero;i<8;i++){ vec2 a=VAX[i], ba=VAX[i+1]-a; float L=length(ba); if(s<=sc+L||i==7){ ap=a+ba*clamp((s-sc)/L,0.,1.); break; } sc+=L; }
  float fl=gS(ap);
  float hw=mix(uVF1.x,uVF1.y,smoothstep(uVF1.z,uVF1.w,s));
  float e=max(ad-hw,0.);
  // inner gorge: steep rise from the channel, saturating (optional second stage uVF5 for tall outer fins; off)
  float env=(uVF2.x*(1.-exp(-e/uVF2.y))+uVF5.x*smoothstep(uVF5.y,uVF5.z,e))*(1.-smoothstep(uVF2.z,uVF2.z+100.,ad))*sw;
  // fins

// ---- FFT ocean -----------------------------------------------------------------
// Directional JONSWAP spectrum, band-limited per cascade, evolved in time and inverse
// transformed with a Stockham radix-2 FFT. Outputs height, choppy displacement, slopes
// and the Jacobian (for whitecaps). Two real fields are packed per complex channel.
const OCEAN_N = 256;
const FS_OSPEC = GLSL_COMMON + `
uniform float uL, uKmin, uKmax, uWind, uWindAng, uGamma, uScale, uSeed;
uniform vec4 uSwell; // angle, wavelength, height scale, angular width
out vec4 o;
const float G=9.81;
vec2 gauss(vec2 s){ float u1=max(hash12(s*1.31+uSeed),1e-6), u2=hash12(s*2.77+uSeed*1.7+13.1); float r=sqrt(-2.*log(u1)); return r*vec2(cos(6.2831853*u2),sin(6.2831853*u2)); }
float psi(vec2 k){
  float kl=length(k); if(kl<uKmin||kl>=uKmax||kl<1e-5) return 0.;
  float w=sqrt(G*kl), wp=.877*G/uWind;

  float S=.0081*G*G*pow(w,-5.)*exp(-1.25*pow(wp/w,4.))*pow(uGamma,exp(-(w-wp)*(w-wp)/(2.*sig*sig*wp*wp)));

  float c2=cos(th)*cos(th), nar=smoothstep(14.,.6,kl);
  float D=abs(th)<1.5707963?.92*mix((2./PI)*c2,(8./(3.*PI))*c2*c2,nar):0.; D+=.08/(2.*PI);

  ps+=uSwell.z*exp(-pow((kl-ks)/(.12*ks),2.))*exp(-pow(ths/uSwell.w,2.))/kl;
  // damp tiny capillary scales
  ps*=exp(-pow(kl/60.,2.));
  return ps*uScale;

void main(){
  vec2 c=gl_FragCoord.xy-.5;
  float N=${OCEAN_N}.;
  vec2 nm=vec2(c.x<N*.5?c.x:c.x-N, c.y<N*.5?c.y:c.y-N);
  vec2 k=6.2831853*nm/uL;
  float dk=6.2831853/uL;

const FS_OEVOLVE = GLSL_COMMON + `
uniform sampler2D uH0; uniform float uL, uT;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
vec2 cmul(vec2 a,vec2 b){return vec2(a.x*b.x-a.y*b.y,a.x*b.y+a.y*b.x);}
vec2 pk(vec2 a,vec2 b){return vec2(a.x-b.y,a.y+b.x);} // a + i*b
void main(){
  ivec2 ic=ivec2(gl_FragCoord.xy);
  float N=${OCEAN_N}.;
  vec2 nm=vec2(float(ic.x)<N*.5?float(ic.x):float(ic.x)-N, float(ic.y)<N*.5?float(ic.y):float(ic.y)-N);
  vec2 k=6.2831853*nm/uL; float kl=length(k);

  vec2 e=vec2(cos(w*uT),sin(w*uT));
  vec2 h=cmul(h0.xy,e)+cmul(h0.zw,vec2(e.x,-e.y));
  vec2 ih=vec2(-h.y,h.x);

const FS_OFFT = GLSL_COMMON + `
uniform sampler2D uA, uB; uniform float uSub; uniform int uDir;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;

const FS_OFINAL = GLSL_COMMON + `
uniform sampler2D uA, uB; uniform float uChop;
layout(location=0) out vec4 oD; layout(location=1) out vec4 oS;

// ---------------------------------------------------------------- sky
vec3 skyCol(vec3 rd){

}
vec3 skyIrr(vec3 N){

}

// ---------------------------------------------------------------- canopy
vec4 crowns(vec2 p, float cell, float seed){
  vec2 q=p/cell; vec2 n=floor(q), f=fract(q);
  float best=0., id=0.; vec2 g=vec2(0);
  for(int j=uZero-1;j<=1;j++)for(int i=uZero-1;i<=1;i++){
    vec2 c=vec2(i,j); vec2 h=hash22(n+c+seed);
    vec2 r=c+.1+.8*h-f;
    float rad=.45+.55*hash12(n+c+seed+3.1);
    float d2=dot(r,r)/(rad*rad);
    if(d2<1.){ float s=max(1.-d2,.02); float A=rad*(.55+.9*h.x); float hh=A*pow(s,.7);
      if(hh>best){ best=hh; g=A*1.4*r/(rad*rad)*pow(s,-.3); id=hash12(n+c+seed+9.7); } }
  }
  return vec4(best,g/cell,id);
}
float palmH(vec2 p){
  vec2 q=p/10.; vec2 n=floor(q), f=fract(q); float best=0.;
  for(int j=uZero-1;j<=1;j++)for(int i=uZero-1;i<=1;i++){
    vec2 c=vec2(i,j);
    if(hash12(n+c+77.)>.8) continue;
    vec2 h=hash22(n+c+41.);
    vec2 r=(c+.15+.7*h-f)*10.;
    float rad=4.6+2.4*hash12(n+c+9.);
    float d=length(r)/rad;
    if(d<1.){
      float k=floor(8.+4.*h.y);
      float fa=atan(r.y,r.x)/6.2832*k+h.x*7.;
      float fi=abs(fract(fa)-.5);
      float wdt=.34*(1.-.55*d);
      float frond=1.-smoothstep(wdt*.55,wdt,fi);
      frond*=.8+.2*step(.45,fract(d*rad*2.6+fa));
      frond=max(frond,1.-smoothstep(.0,.16,d));
      best=max(best,(4.6+2.2*h.y)*(1.-.6*d*d)*frond*(1.-smoothstep(.88,1.,d)));

const float CMAX=10.;
float uLeafNear=1.;
float leafBumps(vec2 p){
  vec3 v=voronoi(p*.8); vec3 v2=voronoi(p*2.3+7.);
  return sqrt(max(1.-v.x*1.15,0.))*1.25+sqrt(max(1.-v2.x*1.2,0.))*.4;
}
float roundH(vec2 p){
  vec4 a=crowns(p,13.,0.), b=crowns(p,5.8,7.);

float canopyH(vec2 p, vec4 vm){
  if(vm.a<=.01) return 0.;

  float dens=smoothstep(-.35,.25,fbm(p*.02+9.,3)+vm.a*.6-.2);
  float leaf=uLeafNear>0.?(leafBumps(p)-.75)*uLeafNear*smoothstep(.4,2.,r):0.;
  leaf+=fbm(p*.6,2)*.5*smoothstep(.5,2.5,r);

float detailAt(float t){ return 1.-smoothstep(2200.,3200.,t); }
float Hd(vec2 p, float det){ float h=H(p); return det>0.?h+canopyH(p,VEG(p))*det:h; }

// ---------------------------------------------------------------- terrain march / shadows
bool march(vec3 ro, vec3 rd, float tmin, float tmax, out float tHit){
  float t=tmin, lt=tmin;
  bool near=false;
  for(int i=uZero;i<400;i++){
    if(t>tmax) return false;
    vec3 p=ro+rd*t;
    float d=p.y-H(p.xz)-CMAX;
    if(d<0.){ near=true; break; }
    lt=t;
    t+=max(d*.45,.1+t*.001);
  }
  if(!near){ tHit=t; return true; }
  t=lt;
  for(int i=uZero;i<220;i++){
    if(t>tmax) return false;
    vec3 p=ro+rd*t;
    float det=detailAt(t);
    uLeafNear=1.-smoothstep(250.,600.,t);
    float d=p.y-Hd(p.xz,det);
    if(d<0.){
      float a=lt,b=t;
      for(int k=uZero;k<7;k++){ float m=.5*(a+b); vec3 q=ro+rd*m; if(q.y-Hd(q.xz,det)<0.) b=m; else a=m; }
      tHit=.5*(a+b); return true;
    }
    lt=t;
    t+=max(d*.4,.03+t*.0007);
    if(d>CMAX*1.5){ // climbed back out of the canopy band: return to the coarse march
      for(int j=uZero;j<200;j++){ if(t>tmax) return false; p=ro+rd*t; float dd=p.y-H(p.xz)-CMAX; if(dd<0.) break; lt=t; t+=max(dd*.45,.1+t*.001); }
      t=lt;
    }
  }
  tHit=t; return true;
}
float shadow(vec3 p, vec3 L, float near){
  float res=1., t=.3;
  for(int i=uZero;i<80;i++){
    vec3 q=p+L*t;
    if(q.y>uHmax) break;
    float d=q.y-(t<near?Hd(q.xz,1.):H(q.xz));
    res=min(res,7.*d/t);
    if(res<-.2) break;
    t+=clamp(d*.5,t<near?.25:.8,40.);
  }
  return smoothstep(-.2,1.,res);
}

// ---------------------------------------------------------------- ocean surface
float oLod(float L, float pix){ return log2(max(pix*2.6/(L/${OCEAN_N}.),1.)); }

float coastW(vec2 p){

float gShS=1.;   // phase behind the last breaker crest (0 at the crest), set by shoal()

float gShFW=0.;   // (r10w) the pixel's extent along the shore distance (m), set by shadeWater around its shoal() call (0: unfiltered)
float gShBrk=0.;   // (r11w) breaking strength of the wave here (0 .. 1), set by shoal()

vec4 shoal(vec2 p, float w, float depth){

  // sheltered water (cove interiors: low wave exposure) gets smaller waves -- they break only close to the shore
  float shel=mix(.6,1.,smoothstep(.4,.75,ATT(p).z));

  float tail=exp(-.94*k);

  float dsh=s<cr?(6.*s/cr*(1.-s/cr))/cr:-k*exp(-(s-cr)*k)/(1.-tail);
  float h=A*shp;

  // (a dense bore right behind the crest, decaying into lace over ~1/3 of the wave length, clear water before the next)
  gShB=smoothstep(.15,.35,1.5*shel*(.6+.4*vnoise(p*.008-4.))/max(depth,.05))*smoothstep(260.,140.,w)*smoothstep(.0,.5,w)*smoothstep(17.,8.,depth);

  float flt=smoothstep(4.,1.8,depth)*(1.-smoothstep(.05,.4,VEG(p).b))*smoothstep(.45,.8,ATT(p).z);   // reef flats (beaches: plunging shore break) (r4f: exposed flats only -- in the sheltered cove the small waves spill in lines, no standing slabs)
  // (r13w, URL wk46) the foam band's leading edge was one smooth isoline of the shore distance (a step from nothing to full white at the
  //  crest): seen from a boat (v3) a straight horizontal seam across the mid-distance water. The foam's phase is jittered along the crest
  //  (~17 m / ~5 m) and each wave's foam breaks into sections with clear gaps (not in the sheltered cove: its long crest lines stay)
  float sF=s, secF=1.;

  float foam=brk*secF*(smoothstep(0.,.12,sF)*exp(-sF*mix(6.5,2.6,flt))*mix(1.8,1.6,flt)+mix(.32,.5,flt)*smoothstep(0.,.08,sF)*exp(-sF*mix(3.6,1.8,flt))*smoothstep(9.,2.,depth));

  //  spans 30-130 m) point-sampled the crest lines -- some rows hit a white crest, the next did not: grey-white dashes. There
  //  the profiles go to their mean over one wave period (exact for the exp profiles), the slope to 0, the phase to .35
  //  (exp(-4 s) of the bores then equals its period mean)
  float fsh=smoothstep(.15,.6,gShFW/lam);
  if(fsh>0.){ float a1=mix(6.5,2.6,flt), a2=mix(3.6,1.8,flt);
    float fm=brk*((1.-exp(-a1))/a1*exp(-.06*a1)*mix(1.8,1.6,flt)+mix(.32,.5,flt)*(1.-exp(-a2))/a2*exp(-.04*a2)*smoothstep(9.,2.,depth));
    foam=mix(foam,fm*mix(1.,.79,uWK12.z*(1.-gShCv)),fsh); lip=mix(lip,brk*.07,fsh); h=mix(h,A*.25,fsh); dsh*=1.-fsh; gShS=mix(s,.35,fsh); }
  return vec4(h,A*dsh/lam,foam,lip);
}
// swash on beaches: after every breaker the bore runs up the sand as a thin sheet (ballistic up-rush, back-wash)
// and drains again. gh = sand height. Returns (sheet thickness, run-up height of this wave, swash phase 0..1).
vec3 swash(vec2 p, float gh){
  if(gh>1.05||gh<-.8) return vec3(0.,0.,1.);
  float bz=VEG(p).b;
  if(bz<.05) return vec3(0.,0.,1.);
  float lam=34.+8.*vnoise(p*.004), c=4.2;                 // same wave train as shoal()
  // (+ ~40 m phase variation: each wave runs up in lobes at slightly different times -> curved, cuspate fronts)
  float warp=.35*fbm(p*.006+3.,3)+.12*vnoise(p*.03)+.05*vnoise(p*.11)+.2*vnoise(p*.024+7.7);
  float ph=c*uTime/lam+warp+.2;
  float s=fract(ph), id=floor(ph);
  float set=.75+.25*sin(6.2831*(uTime/70.+id*.37))+.15*vnoise(p*.01+id);
  // every bore runs up in lobes (each wave its own): the front is a scalloped line, never straight
  float lobe=max(.72+.5*vnoise(p*.045+vec2(id*1.7,id*3.1))+.16*vnoise(p*.16+id*2.3),.15);
  // fast up-rush, slower back-wash (the sheet decelerates uphill, then drains)
  float sr=s<.38?s/.38*.5:.5+(s-.38)/.62*.5;
  float Zr=(.12+.36*set)*lobe*4.*sr*(1.-sr)*(.8+.2*smoothstep(.2,.8,bz));
  float th=clamp((Zr-gh)*.3,0.,.08)*smoothstep(.05,.4,bz);
  return vec3(th,Zr,sr);
}
// ocean height at p (horizontal displacement ignored for the intersection)
float oceanH(vec2 p, float pix, out vec4 sh){
  float bedH=H(p), depth=max(-bedH,0.), w=max(coastW(p),0.);
  float g=shoreGain(depth,w)*uOAmp;
  float gust=.8+.4*fbm(p*.0011+vec2(uTime*.004,0.),3);
  gSCp=p; float g2=smoothstep(-1.,4.,w)*uOAmp*surfChop(depth,w);
  vec2 bw=oBlendW(p);

  // choppy waves: the surface seen at p belongs to the water column that started at p - D(p)
  vec2 pl=p-(textureLod(uOD0,p/uOL.x,l0).xz+(textureLod(uOD1,p/uOL.y,l1).xz*bw.x+textureLod(uOD1,p*OB_SC/uOL.y+OB_OFF,l1+.23).xz*bw.y)*gust)*g;
  float h1=textureLod(uOD1,pl/uOL.y,l1).y*bw.x+textureLod(uOD1,pl*OB_SC/uOL.y+OB_OFF,l1+.23).y*bw.y;
  float h=(textureLod(uOD0,pl/uOL.x,l0).y+h1*gust)*g

  sh=shoal(p,w,depth);
  float sea=h+sh.x;
  vec3 sw=swash(p,bedH);
  return sw.x>0.?max(sea,bedH+sw.x):sea;
}
float oceanH(vec2 p, float pix){ vec4 sh; return oceanH(p,pix,sh); }
bool waterHit(vec3 ro, vec3 rd, float tmax, out float tw){
  const float MH=4.;   // bound of the surface height: deep troughs of big swell + choppy wind sea reach below -2.6 m
  if(rd.y>=0.&&ro.y>MH) return false;
  float pix0=uTan*2./uRes.y;
  float t0=rd.y<0.?max((ro.y-MH)/-rd.y,0.):0.;
  float t1=rd.y<0.?(ro.y+MH)/-rd.y:tmax;
  t1=min(t1,tmax);
  if(t0>t1) return false;
  if(t0*pix0>1.5){ // far: iterate on the plane
    float t=ro.y/-rd.y;
    for(int i=uZero;i<3;i++){ vec3 p=ro+rd*t; t=(ro.y-oceanH(p.xz,t*pix0))/-rd.y; }
    if(t>tmax) return false;
    tw=t; return true;
  }
  float steps=24., dt=(t1-t0)/steps, t=t0, lf=1.;
  for(int i=uZero;i<24;i++){
    t+=dt;                                    // last sample lands exactly on t1 (thin swash sheets over the sand)
    vec3 p=ro+rd*t;
    float f=p.y-oceanH(p.xz,t*pix0);
    if(f<0.){
      float a=t-dt,b=t;
      for(int k=uZero;k<6;k++){ float m=.5*(a+b); vec3 q=ro+rd*m; if(q.y-oceanH(q.xz,m*pix0)<0.) b=m; else a=m; }
      tw=.5*(a+b); return tw<=tmax;
    }
  }
  // no crossing found inside the slab (only possible for extreme troughs): fall back to the plane iteration -- the
  // sea never has holes (they showed the deep sea floor as grey blobs)
  if(rd.y<0.&&ro.y>0.){
    float t=ro.y/-rd.y;
    for(int i=uZero;i<3;i++){ vec3 p=ro+rd*t; t=(ro.y-oceanH(p.xz,t*pix0))/-rd.y; }
    if(t<=tmax){ tw=t; return true; }
  }
  return false;
}

// ---------------------------------------------------------------- foam texture
// Surf foam = the super-level set {S > th} of a fixed "foam potential" field S, with the threshold th chosen
// from the foam density D so that the mean coverage is exactly C(D) (th = inverse CDF of S, measured once with
// dbgm=42: FOAM_TH). S is built from
//  * A: a warped Voronoi network (~0.9 m cells, stretched along the flow): -distance to its walls, the open
//       water of each cell rounded into a blob; wall width varies along the walls (thick and thin stretches);
//  * B: a finer network (~0.28 m): threads around / holes inside the A walls (old foam: more and bigger holes);
//  * G: bubble-cluster fluff (~10 cm, ~3.5 cm): ragged, bubbly edges;
//  * M: ~15 m patches drawn out along the flow: the foam gathers into swirls and bands, clear veins between.
// Low D: only the highest ridges of S survive -> broken threads and flecks; mid D: a lace of walls; high D: a
// sheet with rounded holes. Edges are anti-aliased exactly (edge width = change of S across the pixel footprint,
// the anisotropic ellipse of grazing views included); octaves below the footprint are replaced by their mean and
// their variance widens the edge, so a fully unresolved pattern returns C(D) itself.
// Returns coverage; fo = (thickness 0..1, foam surface slope xz, brightness).
vec4 gFoamDbg=vec4(0);
// x: distance to the nearest Voronoi wall (2nd pass around the nearest site), yz: its gradient,
// w: distance to the nearest site; dir: unit vector from the site to x; id: cell hash
vec4 vorWall(vec2 x, out vec2 dir, out float id){
  vec2 n=floor(x), f=fract(x), mr=vec2(0), mg=vec2(0); float md=8.;
  for(int j=uZero-1;j<=1;j++) for(int i=uZero-1;i<=1;i++){ vec2 g=vec2(i,j), r=g+hash22(n+g)-f; float d=dot(r,r); if(d<md){ md=d; mr=r; mg=g; } }
  float ed=8.; vec2 eg=vec2(0,1);
  int R=uMG.y>.5?2:1;   // (r10m) URL mg1 = 1: the wall pass searches 5x5 cells around the nearest site (the standard border-distance search; 3x3 can miss
  //  the nearest wall when the jitter is full, a jump along a straight Voronoi edge: the v4 foam seam the water round named)
  for(int j=uZero-R;j<=R;j++) for(int i=uZero-R;i<=R;i++){ vec2 g=mg+vec2(i,j), r=g+hash22(n+g)-f, dr=r-mr;
    if(dot(dr,dr)>1e-5){ vec2 nn=normalize(dr); float e=dot(.5*(mr+r),nn); if(e<ed){ ed=e; eg=-nn; } } }
  id=hash12(n+mg+17.); dir=-mr/max(sqrt(md),1e-4);
  return vec4(ed,eg,sqrt(md));
}
// soft cell interior: min(wall distance, rr - site distance), smoothly -> rounded blobs; returns (value, gradient)
vec3 cellIn(vec4 v, vec2 dir, float rr, float k){
  float a=v.x, b=rr-v.w; vec2 gb=-dir;
  if(b<0.){ b=0.; gb=vec2(0); }                              // junctions beyond rr: foam nodes, never deeper
  // (r10w) continuous across the walls: rr is per cell, so where the blob term b came within k of a wall the two cells met with
  //  different values -- a jump of S along the straight Voronoi wall (the hard straight foam edges near the camera, e.g. the
  //  v4 seam at x ~1040). Over the last .04 before the wall b fades to 0, the value of a foam node (the smooth min is then
  //  -k/4 at the wall from both sides). Target 0, not a + k: most lace walls run between small blobs (b <= 0 there), and a + k
  //  took their thick cores away (v4 lost most of its lace). The hole shapes are unchanged away from the walls; walls between
  //  two big holes get ~.03 cell thicker. URL wk11 (1; 0 = r9f).
  float wtW=mix(1.,smoothstep(0.,.04,a),uWK3.w); b*=wtW; gb*=wtW;
  float h=clamp(.5+.5*(b-a)/k,0.,1.);
  return vec3(mix(b,a,h)-k*h*(1.-h), mix(gb,v.yz,h));
}
// threshold of S for coverage C = 0, 1/8, .. 1 (measured with dbgm=42), for age 0 / .5 / 1
const float FOAM_TH[27]=float[27](
  .13,.060,.018,-.007,-.032,-.061,-.101,-.170,-.756,
  .13,.054,.017,-.005,-.026,-.048,-.091,-.158,-.756,
  .13,.05,.012,-.007,-.026,-.045,-.087,-.15,-.755);
float foamTh(float C, float age){
  float x=clamp(C,0.,1.)*8., ia=clamp(age,0.,1.)*2.;
  int i=min(int(x),7), j=min(int(ia),1); float fx=x-float(i), fa=ia-float(j);
  float t0=mix(FOAM_TH[j*9+i],FOAM_TH[j*9+i+1],fx), t1=mix(FOAM_TH[j*9+9+i],FOAM_TH[j*9+10+i],fx);

}
float gFoamSA=0., gFoamS=0.;   // A component, full foam potential (calibration)
float gFoamSm=0.;   // mean of S (all unresolved components), set by foamS
vec3 gFoamF2=vec3(0);   // optional second pattern frame (direction xy, weight z) for foamTex
float gFoamST=2.3, gFoamST2=2.3;   // stretch of the pattern along the flow (main / second frame)
float gFoamSoft=0.;   // (r10w) extra edge width of the lace threshold (churned surf seen from a boat: soft, bubbly edges)
float gFoamBig=0.;   // (r12w) churned surf seen from a boat: the large-scale patches / coarse lace keep their weight close up (big foam sheets and big clear holes, not a field of 1 m blobs); set by shadeWater
float gFoamCore=0.;   // (r11w) solid whitewater core (the rock collar): no sub-pixel lace holes, full cover, full brightness (set by shadeWater)
float gFoamSK=0.;   // the large-scale part of S (patches M + filaments K), set by foamS
float gFoamAK=0.;   // its edge width over one pixel
vec3 gFoamU=vec3(0);   // optional flow coordinate for the filaments (u, du/dx, du/dz): foam lines follow its isolines
// thresholds of the large-scale part only (patches + lines), measured with dbgm=45
const float FOAM_THK[27]=float[27](
  .14,.065,.015,-.017,-.049,-.084,-.118,-.176,-.75,
  .14,.064,.015,-.016,-.048,-.083,-.118,-.177,-.75,
  .14,.063,.013,-.018,-.049,-.085,-.124,-.18,-.75);
float foamThK(float C, float age){
  float x=clamp(C,0.,1.)*8., ia=clamp(age,0.,1.)*2.;
  int i=min(int(x),7), j=min(int(ia),1); float fx=x-float(i), fa=ia-float(j);
  float t0=mix(FOAM_THK[j*9+i],FOAM_THK[j*9+i+1],fx), t1=mix(FOAM_THK[j*9+9+i],FOAM_THK[j*9+10+i],fx);

float foamS(vec2 p, vec2 gx, vec2 gy, float age, vec2 fd, out vec2 gS, out vec4 aux){

  vec2 fa=vec2(dot(gx,fd)/ST,dot(gx,fn)), fb=vec2(dot(gy,fd)/ST,dot(gy,fn));   // pixel footprint in pattern space
  // octave fade-out: geometric mean of the footprint axes (anisotropic filtering, ratio <= 4), not the major
  // axis -- at grazing views the fine lace stays (compressed, exactly anti-aliased per pixel) instead of vanishing

    // (r10w) ... but dr belongs to this cell's site: on a wall the two cells used different an, and the wall core (e.x -k/4,

    an=mix(an,mix(1.65,an,smoothstep(0.,.12,v.x)),uWK3.w);

  vec3 g1=fG1>0.?vnoised(af*10.+vec2(1.3,9.1)):vec3(0), g2=fG2>0.?vnoised(af*28.+vec2(4.7,2.9)):vec3(0);
  float kG=mix(.05,.035,age);
  S+=(g1.x*fG1+g2.x*.55*fG2)*kG; g+=(g1.yz*10.*fG1+g2.yz*28.*.55*fG2)*kG;
  var+=kG*kG*.2*((1.-fG1*fG1)+.3*(1.-fG2*fG2));
  // aux: (edge width of the threshold transition, resolved fractions of the lace (A) and the lines (K), footprint)
  float aa=length(vec2(dot(g,fa),dot(g,fb)));
  gS=fd*(g.x/ST)+fn*g.y;                                      // pattern-space gradient back to world space
  // (r8f) + a fringe of ~6 cm in world units: up close a foam edge is a gradient of thinning bubbles, not a 1-px cut-out
  //  (the cel-shaded flakes of the boat views); from ~40 m on the pixel footprint dominates again, the aerial views do not change
  aux=vec4(sqrt(.002*.002+pow(.7*aa,2.)+var*.25+pow(length(gS)*.06,2.)),fA,fK,pa);   // unresolved variance widens the edge only a little: crisp foam (small coverage bias)
  gFoamDbg.w=g1.x*fG1;
  gFoamSm=mA+mB+(mK+mH)*lw;

}
float foamTex(vec2 p, vec2 gx, vec2 gy, float D, float age, vec2 fd, out vec4 fo){
  fo=vec4(0.,0.,0.,1.);
  if(D<=.004) return 0.;
  vec2 gS; vec4 aux;
  float S=foamS(p,gx,gy,age,fd,gS,aux);
  // second pattern frame (e.g. aligned with a beach): blended in where gFoamF2.z > 0 (fixed frames never shear)
  if(gFoamF2.z>.001){
    float sk=gFoamSK, ak=gFoamAK, sm=gFoamSm;
    float st0=gFoamST; gFoamST=gFoamST2;
    vec2 gS2; vec4 aux2; float S2=foamS(p,gx,gy,age,gFoamF2.xy,gS2,aux2);
    gFoamST=st0;
    float wf=gFoamF2.z;
    S=mix(S,S2,wf); gS=mix(gS,gS2,wf); aux=mix(aux,aux2,wf);
    gFoamSK=mix(sk,gFoamSK,wf); gFoamAK=mix(ak,gFoamAK,wf); gFoamSm=mix(sm,gFoamSm,wf);
  }
  gFoamS=S;
  // target coverage from the density: D .1 -> ~5 %, .3 -> 18 %, .6 -> 45 %, 1 -> 75 %, 1.4 -> 92 %
  // (seen from the air even the densest whitewater keeps some dark holes / gaps: max coverage lower there)
  float C=clamp(1.-exp(-D*D*1.3-D*.35),0.,mix(mix(.78,.95,aux.y),.985,gFoamCore))*mix(1.,.9,age);   // (r11w: the rock collar core is solid white from the air too)   // (r9w: aerial max .86 -> .78: dense foam keeps more dark holes from the air -- lace, not flat white blobs)
  float Cv=C;                                                  // mean coverage wanted
  // three levels of detail, each with its own measured threshold: all octaves (lace), lines + patches only
  // (seen from the air), patches only (far: the exact mean coverage C, modulated by the large patches)
  float fr=1.-age;
  float th=foamTh(C,age), s=aux.x;
  float thK=foamThK(C,age);
  // the two resolved levels are blended as signed distances to their thresholds, then thresholded once:
  // one crisp edge through the LOD transition (blending two coverages would give grey double images)
  float dS=mix(gFoamSK-thK,S-th,aux.y), sS=mix(gFoamAK*2.1,s,aux.y)+gFoamSoft;   // (r8w: K edge 1.5 -> 2.1 x its footprint change: soft outlines from the air, no paper cut-out edges)
  float cov=smoothstep(-sS,sS,dS);
  // lace below the pixel (aerial views): inside the outline the foam is a sub-pixel lace -- partial cover that
  // thickens into solid white toward the core of each foam patch
  cov*=mix(mix(.55,.65,fr)+mix(.45,.35,fr)*smoothstep(0.,.14+.12*age,dS),1.,max(aux.y,gFoamCore));   // (r8w: ramp .07+.05age -> .14+.12age, .6/.7 -> .55/.65: only the cores of the patches are solid white, the rest a lace veil -- no flat paper cut-outs from the air)
  // lace below the pixel (aerial views): a crisp outline, but inside it the foam is a sub-pixel lace -- partial
  // cover that thickens into solid white toward the core of each foam patch / line
  float x0=.5-sin(asin(1.-2.*C)/3.);                          // inverse smoothstep
  float covU=smoothstep(0.,1.,x0+(S-gFoamSm)*2.5);
  cov=mix(covU,cov,aux.z);
  // (r8w) ageing foam seen from the air (its lace below the pixel): a veil with blue holes and threads (~2-5 m) inside
  // the outline instead of a flat white paper cut-out; gone once the lace itself is resolved (aux.y) or beyond ~2 m pixels
  { float lf=clamp(2.2-aux.w*1.1,0.,1.)*(1.-aux.y)*smoothstep(.25,.75,age)*(1.-gFoamCore);
    if(lf>0.){ vec2 pq=p+vec2(uTime*.11,uTime*.04);
      float ln=vnoise(pq*.33+vec2(4.1,7.3))*.65+vnoise(pq*.6+1.7)*.35*clamp(2.-aux.w*2.,0.,1.);
      cov*=1.-lf*.5*smoothstep(-.1,.5,ln); } }
  // loose bubbles / tiny clumps (~3-8 cm) scattered around the foam (fresh foam sheds more)
  float fD=clamp(2.5-aux.w*40.,0.,1.);
  if(fD>0.){
    vec2 dr; float id; vec4 v=vorWall(p/.1+vec2(7.3,1.1),dr,id);
    float r=.07+.16*hash11(id*41.3)*hash11(id*7.9), aD=aux.w/.1*1.2+.02;   // mostly tiny, a few bigger
    float pr=smoothstep(-.12,-.01,dS)*(.1+.25*fr)*smoothstep(.05,.3,C);
    float bub=(1.-smoothstep(r-aD,r+aD,v.w))*step(hash11(id*17.9),pr)*fD;
    cov=max(cov,bub*.95);
  }
  // thickness: how far above the threshold (thin lace / film edges are translucent)
  float tkF=smoothstep(th,th+.02+.05*fr*smoothstep(.4,1.,C)+s*1.5,S), tkK=smoothstep(thK,thK+.08+.08*fr+gFoamAK,gFoamSK);
  fo.x=mix(1.,tkF,aux.y);
  // relief: rounded foam edges (S near th) and bubble lumps on top
  float rim=smoothstep(th-s,th+s+.08,S)*(1.-smoothstep(th+s,th+s+.1,S));
  fo.yz=gS*(rim*.35+.15*(.4+.6*fr))*clamp(1.5-aux.w*2.,0.,1.);
  // brightness: fresh foam bright white, old foam a little greyer; bubble-scale shading in the mass
  fo.w=(.85+.15*fr)*(1.-.1*(.5-.5*gFoamDbg.w)*fo.x)*mix(.72,1.,smoothstep(thK,thK+.18,gFoamSK));   // thin / edge foam greyer, thick cores bright (tonal texture from the air)
  fo.w=mix(fo.w,1.,gFoamCore*.85);   // (r11w) the collar core: brilliant white, no grey edge tone
  return cov*smoothstep(0.,.05,D);
}
float foamPattern(vec2 p, float pix, float D){ vec4 fo; return foamTex(p,vec2(pix,0.),vec2(0.,pix),D,.5,normalize(uShore+vec2(1e-4)),fo); }

// ---------------------------------------------------------------- rock
// joint-block pattern on one projection plane: x = crack mask, y = block id, z,w = facet tilt
vec4 rockBlocks(vec2 wc, float li, float bf, float bf2){
  vec2 bq=vec2(wc.x*.38+hash11(li)*7., wc.y*.22)+.35*vec2(fbm(wc*.08,2),fbm(wc*.08+4.,2));
  vec3 vb=voronoi(bq);
  float crack=(1.-smoothstep(.0,.035,vb.y-vb.x))*bf*.7;
  vec3 vb2=voronoi(bq*3.1+5.);
  crack=max(crack,(1.-smoothstep(.0,.03,vb2.y-vb2.x))*bf2*.35);
  vec2 fct=(hash22(vec2(vb.z*17.,li))-.5)*.5*bf;
  return vec4(crack,vb.z,fct);
}
vec3 rockMat(vec3 pos, vec3 N, float sprayW, float pix, out vec3 dn, out float rough){
  vec3 aw=abs(N); aw=pow(aw,vec3(4.)); aw/=aw.x+aw.y+aw.z;
  float bedc=pos.y+6.*fbm(pos.xz*.004,3)+1.5*fbm(pos.xz*.03,2);
  float thick=3.5+3.*(noise3(pos*.01)*.5+.5);
  float li=floor(bedc/thick);
  float bf=clamp(1.-pix*.35,0.,1.), bf2=clamp(1.-pix*1.2,0.,1.);
  vec4 bx=aw.x>.02?rockBlocks(pos.zy,li,bf,bf2):vec4(0);
  vec4 bz=aw.z>.02?rockBlocks(pos.xy,li,bf,bf2):vec4(0);
  vec4 by=aw.y>.02?rockBlocks(pos.xz*.8,li,bf,bf2):vec4(0);
  float crack=bx.x*aw.x+bz.x*aw.z+by.x*aw.y;
  float bid=bx.y*aw.x+bz.y*aw.z+by.y*aw.y;
  // colours: weathered red-brown, dark basalt, ochre, grey lichen
  float P1=fbm3(pos*vec3(.012,.03,.012),4)*.5+.5, P2=fbm3(pos*.05+3.,3)*.5+.5;
  vec3 red=vec3(.15,.075,.05), brown=vec3(.085,.065,.052), dark=vec3(.042,.04,.038), ochre=vec3(.19,.12,.075), grey=vec3(.11,.105,.10);
  vec3 c=mix(brown,red,smoothstep(.35,.7,P1));
  c=mix(c,dark,smoothstep(.55,.8,P2)*.7);
  c=mix(c,ochre,smoothstep(.72,.9,P1)*.45);
  c*=.8+.4*hash12(vec2(bid*31.,li));
  c=mix(c,grey,smoothstep(.45,.8,fbm3(pos*.04+9.,3)*.5+.5)*.55);
  c*=.82+.36*(fbm3(pos*1.3,3)*.5+.5)*bf2+.18*(1.-bf2);
  // vertical water stains (triplanar)
  float stx=fbm(vec2(pos.z*.25,pos.y*.018),4)+.3*fbm(vec2(pos.z*1.1,pos.y*.06),2);
  float stz=fbm(vec2(pos.x*.25,pos.y*.018),4)+.3*fbm(vec2(pos.x*1.1,pos.y*.06),2);
  float streak=(stx*aw.x+stz*aw.z)/max(aw.x+aw.z,1e-3);
  float wallW=1.-aw.y;
  c*=mix(1.,.55,smoothstep(.15,.6,streak)*wallW);
  c=mix(c,vec3(.04,.055,.03),smoothstep(.35,.65,streak)*.3*wallW);
  c*=1.-.5*crack;
  c=mix(c,c*.32,sprayW);
  // facet normals + fine relief
  vec3 fx=vec3(0.,bx.w,bx.z), fz=vec3(bz.z,bz.w,0.), fy=vec3(by.z,0.,by.w);
  vec4 n1=fbm3d(pos*.15,3), n2=fbm3d(pos*.7+5.,3);
  vec3 g=n1.yzw*.15*1.2+n2.yzw*.7*.35*bf2+fx*aw.x+fz*aw.z+fy*aw.y;
  dn=(g-dot(g,N)*N)*.8*clamp(1.8-pix*.45,0.,1.);
  rough=.75;
  return c;
}

// ---------------------------------------------------------------- terrain shading
float isVegD(float r,float b){ return (1.-r)*(1.-b); }
vec3 shadeTerrain(vec3 pos, vec3 rd, float t){
  vec2 p=pos.xz;
  uLeafNear=1.-smoothstep(250.,600.,t);
  float pix=t*uTan*2./uRes.y;
  float det=detailAt(t);
  bool nearS=pix<1.8;
  float gh=nearS?Hc(p):H(p);
  float e=max(.6,pix*.8);
  vec3 Ng;
  if(nearS) Ng=normalize(vec3(Hc(p-vec2(e,0))-Hc(p+vec2(e,0)),2.*e,Hc(p-vec2(0,e))-Hc(p+vec2(0,e))));
  else Ng=normalize(vec3(H(p-vec2(e,0))-H(p+vec2(e,0)),2.*e,H(p-vec2(0,e))-H(p+vec2(0,e))));
  vec4 at=ATT(p), vm=VEG(p);
  float ao=at.x, conv=at.y, expo=at.z, flow=at.w;
  float slope=1.-Ng.y;
  float ch=max(pos.y-gh,0.);
  float veg=vm.r, beach=vm.b, palmZ=smoothstep(.15,.45,vm.g);
  // ---------- surfaces
  // canopy surface normal (displaced) + triplanar crown detail on steep ground
  float ee=max(.3,pix*.7);
  vec3 Nd=normalize(vec3(Hd(p-vec2(ee,0),det)-Hd(p+vec2(ee,0),det),2.*ee,Hd(p-vec2(0,ee),det)-Hd(p+vec2(0,ee),det)));
  vec3 w3=Ng*Ng; w3*=w3; w3/=(w3.x+w3.y+w3.z);
  vec4 cx=crowns(pos.zy,6.,13.), cz=crowns(pos.xy,6.,29.);
  vec3 tri=(vec3(0.,-cx.z,-cx.y)*w3.x+vec3(-cz.y,-cz.z,0.)*w3.z)*3.;
  float triH=cx.x*w3.x+cz.x*w3.z;
  float steep=smoothstep(.35,.75,slope);
  float cfade=clamp(2.-pix*.35,0.,1.);
  vec3 Nv=normalize(mix(Nd,Ng,steep*.5)+tri*cfade*steep);
  // leaf clusters
  float ff=clamp(2.4-pix*.9,0.,1.), ff2=clamp(1.8-pix*1.6,0.,1.);
  vec4 fA=noised3(pos*.55), fB=noised3(pos*1.6+7.3);
  vec3 lg=fA.yzw*.55*.55*ff+fB.yzw*1.6*.22*ff2;
  Nv=normalize(Nv-(lg-dot(lg,Nv)*Nv)*1.2);
  float lf1=clamp(1.-pix/.35,0.,1.), lf2=clamp(1.-pix/.12,0.,1.);
  vec4 L1=noised3(pos*3.1+1.3), L2=noised3(pos*8.7+5.1);
  vec3 lgr=L1.yzw*3.1*.09*lf1+L2.yzw*8.7*.035*lf2;
  Nv=normalize(Nv-(lgr-dot(lgr,Nv)*Nv));
  float leafSpk=1.+(.38*L1.x*lf1+.3*L2.x*lf2);
  float crel=clamp(ch/(CMAX*max(vm.a,.2)),0.,1.);
  float cav=mix(clamp(1.-pix*.12,0.,1.)*steep*(.4+.6*triH),crel,vm.a);   // 0 = deep gap between crowns
  float leafAO=mix(1.,.16+.84*smoothstep(0.,.8,cav),max(vm.a,steep*.85)*det);
  leafAO*=1.+.22*(fA.x*ff+fB.x*.5*ff2);
  if(uLeafNear>0.){ float lb=leafBumps(p); leafAO*=mix(1.,.35+.65*smoothstep(.2,1.2,lb),uLeafNear*vm.a*(1.-palmZ)); }
  // ---------- vegetation albedo
  float n1=fbm(p*.009,3), n2=fbm(p*.045+3.,3);
  float lush=clamp(.45+flow*.9-conv*.12+.35*n1,0.,1.);
  float ridge=smoothstep(.2,1.2,conv)*(1.-flow);
  vec4 cc=crowns(p,13.,0.);
  float cid=cc.w;
  vec3 vSun=vec3(.088,.13,.032), vMid=vec3(.036,.066,.024), vDeep=vec3(.017,.034,.017), vGrass=vec3(.12,.15,.04);
  vec3 va=mix(vMid,vDeep,lush);
  va=mix(va,vSun,smoothstep(.3,.9,cid)*.4*(1.-lush*.6));
  va=mix(va,vGrass,ridge*.55+smoothstep(.6,.9,n2)*.15*(1.-lush));
  va=mix(va,vec3(.085,.11,.06),step(.95,cid)*.45*(1.-palmZ));   // silvery kukui crowns
  va=mix(va,vec3(.09,.07,.035),step(.988,hash12(vec2(cid*57.,3.)))*.45*(1.-palmZ));   // dry / flowering crowns
  va*=.84+.32*hash12(vec2(cid*113.,7.));
  va*=1.+.35*(fA.x*ff+fB.x*.6*ff2)+.25*fbm3(pos*.3,2)*clamp(1.4-pix*.3,0.,1.);
  va*=leafSpk;
  va*=.82+.36*smoothstep(-.5,.5,n2);
  // clumps visible at every distance: 3D noise (works on any slope), filtered by footprint
  float k1=fbm3(pos*.075,3), k2=fbm3(pos*.22+4.,3);
  float kf1=clamp(1.5-pix*.12,0.,1.), kf2=clamp(1.5-pix*.4,0.,1.);
  float clump=k1*kf1*.9+k2*kf2*.6;
  va*=1.+.42*clump;
  float clumpAO=clamp(1.+.9*min(clump,0.),.25,1.);
  // palms: bright fronds over a dark understory
  float phv=palmZ>0.?palmH(p):0.;
  float frond=palmZ*smoothstep(.6,2.2,phv)*det;
  va=mix(va,mix(vec3(.015,.026,.01),vec3(.06,.088,.024)*(.8+.4*hash12(floor(p/10.))),smoothstep(.6,2.2,phv)),palmZ*.92);
  Nv=normalize(mix(Nv,normalize(Ng+vec3(0,.9,0)+(Nd-Ng)*.25),frond));
  leafAO=mix(leafAO,mix(.5,1.,smoothstep(.6,2.2,phv)),palmZ);
  // ---------- rock
  float sprayW=(1.-smoothstep(1.,mix(6.,22.,expo),gh))*smoothstep(.15,.5,slope);
  vec3 dn; float rr;
  vec3 ra=rockMat(pos,Ng,sprayW,pix,dn,rr);
  vec3 Nr=normalize(Ng+dn);
  // mossy ledges on rock: upward-facing detail normals get green
  float ledgeVeg=smoothstep(.15,.45,dot(Nr,vec3(0,1,0))-Ng.y*.5)*(1.-sprayW)*smoothstep(15.,40.,gh);
  ra=mix(ra,vMid*1.1,ledgeVeg*.75*(1.-veg));
  // ---------- sand
  float wet=1.-smoothstep(.2,1.4,gh);
  vec3 sa=mix(vec3(.44,.37,.26),vec3(.24,.20,.14),wet);
  sa*=.92+.12*vnoise(p*1.7)+.06*vnoise(p*7.);
  vec2 rip=vec2(sin(dot(p,vec2(.6,.8))*2.1+vnoise(p*.3)*3.),0.);
  vec3 Ns=normalize(Ng+vec3(.04*rip.x*clamp(1.-pix,0.,1.),0.,.03*rip.x*clamp(1.-pix,0.,1.)));
  // ---------- compose
  float rockW=1.-veg;
  vec3 alb=mix(va,ra,rockW);
  vec3 N=normalize(mix(Nv,Nr,rockW));
  float lao=mix(leafAO*clumpAO,1.,rockW);
  alb=mix(alb,sa,beach); N=normalize(mix(N,Ns,beach)); lao=mix(lao,1.,beach);
  // foot-of-cliff dark wet line + swash
  alb=mix(alb,alb*.4,(1.-smoothstep(.0,.6,gh))*(1.-beach*.5));
  if(uDbgM==1) return vec3(rockW,isVegD(rockW,beach),beach)*.6;
  // ---------- lighting
  float sh=shadow(pos+Ng*.6+N*.2,uSun,45.)*mix(1.,.55+.45*smoothstep(.0,.6,cav),vm.a*det*.7);
  float isVeg=(1.-rockW)*(1.-beach);
  float wrap=.3*isVeg;
  float NdL=dot(N,uSun);
  float dif=max((NdL+wrap)/(1.+wrap),0.);
  vec3 amb=skyIrr(N)*ao*lao;
  vec3 col=alb*(SUN*dif*sh+amb*.75);
  // leaf translucency (sun through the canopy) + rim
  float trans=pow(max(dot(-rd,uSun)*-1.+1.,0.)*.5,2.)*0.;
  col+=isVeg*vec3(.10,.20,.02)*pow(clamp(1.-dot(N,-rd),0.,1.),3.)*sh*.25*SUN.x/3.6;
  col+=isVeg*vec3(.08,.16,.015)*max(-NdL,0.)*sh*.5;
  // specular (wet rock, leaves)
  vec3 Hh=normalize(uSun-rd);
  float r=mix(mix(.75,rr,rockW),.3,sprayW);
  float a2=r*r*r*r;
  float NdH=max(dot(N,Hh),0.), dd=NdH*NdH*(a2-1.)+1.;
  float D=a2/(PI*dd*dd);
  float F=.04+.96*pow(1.-max(dot(Hh,-rd),0.),5.);
  col+=SUN*D*F*.25*max(NdL,0.)*sh*mix(mix(.12,.5,rockW),1.,sprayW);
  return col;
}

// cheap terrain colour for water reflections
vec3 terrainCheap(vec3 pos){
  vec2 p=pos.xz; float e=2.;
  vec3 N=normalize(vec3(H(p-vec2(e,0))-H(p+vec2(e,0)),2.*e,H(p-vec2(0,e))-H(p+vec2(0,e))));
  vec4 vm=VEG(p);
  vec3 alb=mix(vec3(.15,.08,.05),vec3(.04,.10,.02),vm.r);
  alb=mix(alb,vec3(.55,.46,.33),vm.b);
  return alb*(SUN*max(dot(N,uSun),0.)*.8+skyIrr(N)*ATT(p).x);
}

// ---------------------------------------------------------------- water shading
vec3 shadeWater(vec3 pos, vec3 rd, float t){
  vec2 p=pos.xz;
  float pix=t*uTan*2./uRes.y;
  float bed=H(p), depth=max(-bed,0.), w=max(-coastRaw(p),0.);
  vec4 at=ATT(p), vm=VEG(p);
  float expo=at.z;
  float g=shoreGain(depth,w)*uOAmp;
  float gust=.75+.45*fbm(p*.0011+vec2(uTime*.004,0.),3);
  vec4 d0=textureLod(uOD0,p/uOL.x,oLod(uOL.x,pix)), d1=textureLod(uOD1,p/uOL.y,oLod(uOL.y,pix)), d2=textureLod(uOD2,p/uOL.z,oLod(uOL.z,pix));
  vec4 s0=textureLod(uOS0,p/uOL.x,oLod(uOL.x,pix)), s1=textureLod(uOS1,p/uOL.y,oLod(uOL.y,pix)), s2=textureLod(uOS2,p/uOL.z,oLod(uOL.z,pix));
  float g2=smoothstep(-1.,4.,w)*uOAmp;
  vec2 sl=(s0.xy*.55+s1.xy*gust)*g+s2.xy*gust*g2;
  vec2 var=max(s0.zw-s0.xy*s0.xy,0.)+max(s1.zw-s1.xy*s1.xy,0.)+max(s2.zw-s2.xy*s2.xy,0.);
  float wh=(d0.y+d1.y*gust)*g+d2.y*gust*g2;
  vec4 sh=shoal(p,w,depth);
  // shoaling wave slope along the shore normal
  float ce=2.; vec2 cg=vec2(coastRaw(p+vec2(ce,0))-coastRaw(p-vec2(ce,0)),coastRaw(p+vec2(0,ce))-coastRaw(p-vec2(0,ce)))/(2.*ce);
  sl+= -cg*sh.y;
  // fine capillary ripples close to the camera
  float rf=clamp(1.4-pix*3.,0.,1.);
  vec3 rp=fbmd(p*2.3+vec2(uTime*.6,uTime*.4),3);
  sl+=rp.yz*2.3*.014*rf*g2;
  vec3 N=normalize(vec3(-sl.x,1.,-sl.y));
  float rough=sqrt(.0025+(var.x+var.y)*.5*g*g+.0004*pix);
  float cosi=max(dot(-rd,N),.001);
  float F=.02+.98*pow(1.-cosi,5.);
  vec3 R=reflect(rd,N); if(R.y<.01) R=normalize(vec3(R.x,.01+abs(R.y)*.3,R.z));
  vec3 refl=skyCol(R);
  // terrain reflected in the water (cliffs, headlands)
  if(t<1800.){
    float tr=2.; bool hit=false; vec3 q;
    for(int i=uZero;i<48;i++){ q=pos+R*tr; float dd=q.y-H(q.xz); if(dd<0.){hit=true;break;} tr+=max(dd*.6,1.5+tr*.02); if(tr>900.||q.y>uHmax) break; }
    if(hit) refl=terrainCheap(q);
  }
  float sunSh=shadow(vec3(p.x,.6,p.y),uSun,0.);
  // sun glint (GGX)
  vec3 Hh=normalize(uSun-rd);

}

vec3 fogApply(vec3 col, vec3 ro, vec3 rd, float t){
  float b=uFog, hf=1./420.;

const FS_BRIGHT = GLSL_COMMON + `
uniform sampler2D uAcc; uniform float uInvN; uniform vec2 uRes;
out vec4 o;

const FS_BLUR = GLSL_COMMON + `
uniform sampler2D uT; uniform vec2 uDir; uniform vec2 uRes;
out vec4 o;

const FS_POST = GLSL_COMMON + `
uniform sampler2D uAcc, uBloom, uHud; uniform float uInvN, uHudOn, uLens, uCA, uGrain, uFrame; uniform vec2 uRes, uOut;
uniform float uExpo, uSat, uSharp, uContrast;

vec3 srgb(vec3 c){ return mix(12.92*c,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c)); }
vec3 getUV(vec2 uv){ return textureLod(uAcc,uv,0.).rgb*uInvN; }
vec2 lens(vec2 uv, float k){

uniform sampler2D uH, uB, uE; uniform vec4 uRect, uDom; uniform ivec2 uOff; uniform int uHalf; uniform float uHres;

  vec2 uv=(p-uDom.xy)/uDom.z;
  float m=smoothstep(0.,.05,min(min(uv.x,uv.y),min(1.-uv.x,1.-uv.y)));
  return m>0.?mix(b,texBicubic(uE,uv).r,m):b;
}
void main(){
  ivec2 ic=ivec2(gl_FragCoord.xy); bool top=ic.y>=uHalf; if(top) ic.y-=uHalf;
  ivec2 t=ic+uOff;
  float v=top?massif(uRect.xy+(vec2(t)+.5)*uRect.z/uHres):texelFetch(uH,t,0).r;
  float q=floor(clamp((v+200.)*1000.,0.,16777215.));
  float r=floor(q/65536.), g=floor((q-r*65536.)/256.), b=q-r*65536.-g*256.;

  gl.uniform4f(P.u.uRect, RECT[0], RECT[1], RECT[2], 1 / RECT[2]); gl.uniform4f(P.u.uDom, SPLR[0], SPLR[1], SPLR[2], SPLR[2] / num('en', 1024));

}

  if (Q.has('hdump')) { cv.width = Math.round(innerWidth); cv.height = Math.round(innerHeight); await generate(); hdumpPass(); await gpuWait(); window.__ready = true; await postFrame(0); return; }
  const TC0 = performance.now();
  pr = prog(FS_RENDER); pp = prog(FS_POST); pbr = prog(FS_BRIGHT); pbl = prog(FS_BLUR);

  else { document.getElementById('load').style.opacity = 0; setTimeout(() => document.getElementById('load').remove(), 700); }
  if (MODE === 'still') {
    const spp = num('spp', 16); const TR = performance.now();
    const cam = stillCam(), t = num('t', 3.0);
    oceanUpdate(t);
    clearAcc();
    for (let i = 0; i < spp; i++) {
      renderSample(cam, t, spp > 1 ? jitter(i) : [0, 0], true);
      await gpuWait();   // never queue more than one sample of GPU work
    }
    present();
    await gpuWait();
    console.log('render done ms', (performance.now() - TR).toFixed(0));
    window.__ready = true;
    if (Q.has('post')) await postFrame(0);
  } else {
    await readGround();
    startDrone();
  }
}
main().catch((e) => { console.error(e.stack || e); if (Q.has('post')) fetch('/log', { method: 'POST', body: 'FATAL ' + e.message }); const lt = document.getElementById('loadtxt'); if (lt) lt.textContent = 'Error: ' + e.message; });
</script>
